name: Export issue 165 source

on:
  push:
    branches:
      - agent/issue-165-bounded-dtls-listener
  pull_request:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: issue-165-source
          path: |
            .
            !.git/**
            !.gradle/**
            !**/build/**
          include-hidden-files: true
          retention-days: 1
