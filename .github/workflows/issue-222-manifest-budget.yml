name: Issue 222 Manifest Budget Rewrite

on:
  push:
    branches:
      - agent/issue-222-low-map-budget

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Rewrite manifest limits source
        shell: python
        run: |
          from pathlib import Path

          path = Path("map-format/src/main/java/pl/grzegorz2047/standalonethewalls/mapformat/MinimalPreparationBundle.java")
          source = path.read_text(encoding="utf-8")
          old = "+ \"},\\\"id\\\":\\\"minimal_preparation\\\",\\\"license\\\":\\\"CC0-1.0\\\",\\\"limits\\\":{\\\"archiveBytes\\\":1048576,\\\"fileCount\\\":5,\\\"sceneNodes\\\":64,\\\"textureDimension\\\":64,\\\"triangles\\\":256,\\\"uncompressedBytes\\\":2097152},\\\"maximumPlayers\\\":40,\\\"minimumPlayers\\\":4,\\\"name\\\":\\\"Minimal Preparation\\\",\\\"playersPerTeam\\\":10,\\\"requiredProtocol\\\":{\\\"major\\\":1,\\\"minor\\\":0},\\\"schemaVersion\\\":1,\\\"teamCount\\\":4,\\\"version\\\":\\\"1.0.0\\\"}\";"
          new = "+ \"},\\\"id\\\":\\\"minimal_preparation\\\",\\\"license\\\":\\\"CC0-1.0\\\",\\\"limits\\\":\"\n                + LowProfileMapBudget.manifestLimitsJson()\n                + \",\\\"maximumPlayers\\\":40,\\\"minimumPlayers\\\":4,\\\"name\\\":\\\"Minimal Preparation\\\",\\\"playersPerTeam\\\":10,\\\"requiredProtocol\\\":{\\\"major\\\":1,\\\"minor\\\":0},\\\"schemaVersion\\\":1,\\\"teamCount\\\":4,\\\"version\\\":\\\"1.0.0\\\"}\";"
          if old not in source:
              raise SystemExit("expected manifest limits source not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")

      - name: Commit rewrite
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map-format/src/main/java/pl/grzegorz2047/standalonethewalls/mapformat/MinimalPreparationBundle.java
          git commit -m "Use Low map budget in canonical manifest"
          git push
