name: Apply preparation sync integration

on:
  push:
    branches:
      - agent/issue-174-preparation-sync
    paths:
      - .github/workflows/apply-issue-174.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-174-preparation-sync

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Normalize the existing Polish marker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply-issue-174.py')
          text = path.read_text(encoding='utf-8')
          old = 'direct.failure.preparation_spawn_not_in_map=Spawn przygotowania serwera nie występuje w zweryfikowanej mapie lokalnej.\\n'
          new = 'direct.failure.preparation_spawn_not_in_map=Spawn przygotowania wskazany przez serwer nie istnieje w zweryfikowanej lokalnej mapie.\\n'
          if old not in text:
              raise SystemExit('Polish marker to normalize was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply bounded preparation synchronization
        run: python .github/scripts/apply-issue-174.py

      - name: Format and test changed modules
        run: ./gradlew --no-daemon spotlessApply :server:test :client:test

      - name: Commit integration and remove one-time automation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/apply-issue-174.py
          rm .github/workflows/apply-issue-174.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Wire authoritative preparation movement"
          git push origin HEAD:agent/issue-174-preparation-sync

# One-time PR trigger; this file removes itself after a successful run.
