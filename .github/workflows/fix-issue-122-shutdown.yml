name: Fix Issue 122 Shutdown

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/fix-issue-122-shutdown.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-122-lobby-team-ready-protocol

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Apply domain-owned shutdown removal
        shell: python
        run: |
          from pathlib import Path
          import re

          runtime = Path('server/src/main/java/pl/grzegorz2047/standalonethewalls/server/lobby/MinimalLobbyRuntime.java')
          text = runtime.read_text()
          pattern = re.compile(
              r'    private void closeMembers\(LobbyState state\) \{\n'
              r'.*?'
              r'(?=        List<CompletableFuture<Void>> closures =)',
              re.DOTALL,
          )
          replacement = '''    private void closeMembers(LobbyState state) {
              List<MemberState> members = new ArrayList<>(state.members.values());
              List<AuthorizedPlayerSession> sessions = new ArrayList<>(members.size());
              for (MemberState member : members) {
                  MemberState removed = state.members.remove(member.participantId);
                  if (removed == null || removed.session != member.session) {
                      throw new IllegalStateException("owned lobby member disappeared during shutdown");
                  }
                  LobbyRosterDecision decision =
                          LobbyRosterRules.apply(
                                  configuration,
                                  state.roster,
                                  new LobbyRosterCommand.Leave(member.participantId));
                  if (!decision.accepted()) {
                      throw new IllegalStateException(
                              "authoritative lobby roster rejected an owned shutdown leave");
                  }
                  commitRoster(state, decision.state());
                  sessions.add(member.session);
              }
              if (sessions.isEmpty()) {
                  return;
              }

          '''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected exactly one closeMembers replacement, got {count}')
          runtime.write_text(text)

          test = Path('server/src/test/java/pl/grzegorz2047/standalonethewalls/server/identity/session/MinimalLobbyRuntimeTest.java')
          text = test.read_text()
          pattern = re.compile(
              r'(        assertThat\(lobby\.memberCount\(\)\)\.isZero\(\);\n)'
              r'(        assertThat\(first\.closeCount\(\)\)\.isEqualTo\(1\);)'
          )
          replacement = (
              r'\1'
              '        assertThat(lobby.revision()).isEqualTo(4L);\n'
              r'\2'
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected exactly one shutdown assertion replacement, got {count}')

          old_wait = '''            waitUntil(() -> lobby.memberCount() == 1 && alpha.closeCount() == 1);
          '''
          new_wait = '''            waitUntil(
                      () ->
                              lobby.memberCount() == 1
                                      && alpha.closeCount() == 1
                                      && latestSnapshotUnchecked(bravo).revision() == 4L);
          '''
          if text.count(old_wait) != 1:
              raise SystemExit(
                  f'expected exactly one replay wait replacement, got {text.count(old_wait)}'
              )
          test.write_text(text.replace(old_wait, new_wait, 1))

      - name: Format and test server
        run: ./gradlew --no-daemon spotlessApply :server:test

      - name: Commit tested fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/src/main/java/pl/grzegorz2047/standalonethewalls/server/lobby/MinimalLobbyRuntime.java
          git add server/src/test/java/pl/grzegorz2047/standalonethewalls/server/identity/session/MinimalLobbyRuntimeTest.java
          git commit -m '[P0][Server] Remove shutdown members through authoritative roster'
          git push origin HEAD:agent/issue-122-lobby-team-ready-protocol
