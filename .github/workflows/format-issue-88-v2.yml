name: Format issue 88 v2

on:
  push:
    branches:
      - agent/issue-88-direct-connect-service-v2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/issue-88-direct-connect-service-v2

      - name: Set up Java 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply IPv6 trust-reference correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          endpoint = Path('client/src/main/java/pl/grzegorz2047/standalonethewalls/client/network/DirectConnectEndpoint.java')
          text = endpoint.read_text()
          text = text.replace(
              '    public ServerReference serverReference() {\n        return new ServerReference(authority);\n    }',
              '    public ServerReference serverReference() {\n        String value = hostKind == HostKind.IPV6 ? "ipv6:" + host + \':\' + port : authority;\n        return new ServerReference(value);\n    }')
          endpoint.write_text(text)

          test = Path('client/src/test/java/pl/grzegorz2047/standalonethewalls/client/network/DirectConnectEndpointTest.java')
          text = test.read_text()
          text = text.replace(
              '        assertEquals(expectedAuthority, endpoint.serverReference().value());',
              '        String expectedReference =\n                expectedKind == DirectConnectEndpoint.HostKind.IPV6\n                        ? "ipv6:" + expectedHost + \':\' + expectedPort\n                        : expectedAuthority;\n        assertEquals(expectedReference, endpoint.serverReference().value());')
          test.write_text(text)

          adr = Path('docs/adr/0035-direct-connect-client-ownership-and-tofu.md')
          text = adr.read_text()
          text = text.replace(
              'The canonical authority is also the `ServerReference` trust-store key. The first\nrelease deliberately does not use redirects, SRV records, aliases, or automatic\nendpoint migration because those features need explicit trust-key semantics.',
              'The canonical authority is the trust-store key for DNS and IPv4. Because the\nexisting `ServerReference` alphabet intentionally excludes brackets, IPv6 uses the\ntagged opaque key `ipv6:<canonical-host>:<port>` while UI and socket authority remain\nbracketed. The first release deliberately does not use redirects, SRV records,\naliases, or automatic endpoint migration because those features need explicit\ntrust-key semantics.')
          adr.write_text(text)
          PY

      - name: Apply repository formatting
        run: ./gradlew --no-daemon spotlessApply

      - name: Commit formatted implementation and remove workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/format-issue-88-v2.yml
          git add client docs/adr/0035-direct-connect-client-ownership-and-tofu.md
          git diff --cached --quiet || git commit -m 'style: format Direct Connect implementation'
          git push origin HEAD:agent/issue-88-direct-connect-service-v2
