name: Temporary fix issue 82

on:
  push:
    branches:
      - agent/issue-82-asset-lock-cache
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: github.event_name == 'push' || github.head_ref == 'agent/issue-82-asset-lock-cache'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-82-asset-lock-cache

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fix test and format module
        run: |
          python3 - <<'PY'
          from pathlib import Path

          test = Path("asset-pack/src/test/java/pl/grzegorz2047/standalonethewalls/assets/AssetPackSynchronizerTest.java")
          text = test.read_text()
          old = '''        AssetPackManifest orphanManifest =
                new AssetPackManifest("core", "1.0.1", "CC0-1.0", List.of());
        assertThatThrownBy(() -> AssetPackManifestCodec.encode(orphanManifest))
                .isInstanceOf(IllegalArgumentException.class)
                .hasMessageContaining("file count");

        byte[] orphanBytes =
                bytes(
                        "{\\\"files\\\":[],\\\"license\\\":\\\"CC0-1.0\\\",\\\"packId\\\":\\\"core\\\",\\\"version\\\":\\\"1.0.1\\\"}");
        PackFixture orphan =
                createPackWithManifest(
                        "1.0.1", Map.of("data/orphan.txt", bytes("orphan")), orphanBytes);
'''
          new = '''        assertThatThrownBy(
                        () ->
                                new AssetPackManifest(
                                        "core", "1.0.1", "CC0-1.0", List.of()))
                .isInstanceOf(IllegalArgumentException.class)
                .hasMessageContaining("file count");

        byte[] listed = bytes("listed");
        byte[] orphanBytes =
                bytes(
                        "{\\\"files\\\":[{\\\"path\\\":\\\"data/listed.txt\\\",\\\"sha256\\\":\\\""
                                + sha256(listed)
                                + "\\\",\\\"size\\\":6}],\\\"license\\\":\\\"CC0-1.0\\\",\\\"packId\\\":\\\"core\\\",\\\"version\\\":\\\"1.0.1\\\"}");
        PackFixture orphan =
                createPackWithManifest(
                        "1.0.1",
                        Map.of(
                                "data/listed.txt", listed,
                                "data/orphan.txt", bytes("orphan")),
                        orphanBytes);
'''
          if old in text:
              test.write_text(text.replace(old, new, 1))
          elif "byte[] listed = bytes(\"listed\");" not in text:
              raise SystemExit("expected orphan manifest test block")
          PY
          ./gradlew --no-daemon spotlessApply

      - name: Commit fixes
        run: |
          if git diff --quiet -- asset-pack settings.gradle.kts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add asset-pack settings.gradle.kts
          git commit -m "Format asset module and fix orphan manifest test"
          git push origin HEAD:agent/issue-82-asset-lock-cache
