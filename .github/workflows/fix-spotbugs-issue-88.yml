name: Fix issue 88 SpotBugs findings

on:
  push:
    branches:
      - agent/issue-88-direct-connect-service-v2

permissions:
  contents: write

concurrency:
  group: fix-issue-88-spotbugs
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/issue-88-direct-connect-service-v2

      - name: Set up Java 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: '21'

      - name: Replace implicit failure contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          connected = Path('client/src/main/java/pl/grzegorz2047/standalonethewalls/client/network/ConnectedLobbySession.java')
          text = connected.read_text()
          replacement = '''    boolean startReceiving() {
              if (!receiverStarted.compareAndSet(false, true) || closing.get()) {
                  return false;
              }
              try {
                  Thread.ofVirtual()
                          .name("sunderfront-direct-connect-lobby-receiver")
                          .start(this::receiveLoop);
                  return true;
              } catch (RuntimeException exception) {
                  finish(Optional.of(DirectConnectFailure.of(DirectConnectFailureCode.INTERNAL_FAILURE)));
                  return false;
              }
          }

          static boolean containsExactSelf'''
          text, count = re.subn(
              r'    void startReceiving\(\) \{.*?\n    \}\n\n    static boolean containsExactSelf',
              replacement,
              text,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'unexpected startReceiving replacements: {count}')
          connected.write_text(text)

          service = Path('client/src/main/java/pl/grzegorz2047/standalonethewalls/client/network/DirectConnectService.java')
          text = service.read_text()
          text = text.replace(
              '                InetAddress[] addresses = resolveAddresses();\n'
              '                if (addresses == null) {\n'
              '                    return;\n'
              '                }\n'
              '                Socket socket = connectSocket(addresses);',
              '                Optional<InetAddress[]> addresses = resolveAddresses();\n'
              '                if (addresses.isEmpty()) {\n'
              '                    return;\n'
              '                }\n'
              '                Socket socket = connectSocket(addresses.orElseThrow());',
          )
          text, receiver_count = re.subn(
              r'                try \{\n                    lobbySession\.startReceiving\(\);\n'
              r'                \} catch \(RuntimeException exception\) \{\n'
              r'                    connected\.compareAndSet\(lobbySession, null\);\n'
              r'                    awaitClose\(lobbySession\.closeAsync\(\)\);\n'
              r'                    completeFailure\(DirectConnectFailureCode\.INTERNAL_FAILURE\);\n'
              r'                    return;\n                \}',
              '                if (!lobbySession.startReceiving()) {\n'
              '                    connected.compareAndSet(lobbySession, null);\n'
              '                    awaitClose(lobbySession.closeAsync());\n'
              '                    completeFailure(DirectConnectFailureCode.INTERNAL_FAILURE);\n'
              '                    return;\n'
              '                }',
              text,
          )
          resolver = '''        private Optional<InetAddress[]> resolveAddresses() {
              Future<InetAddress[]> resolution;
              try {
                  resolution = workers.submit(() -> addressResolver.resolve(endpoint.host()));
              } catch (RejectedExecutionException exception) {
                  completeFailure(DirectConnectFailureCode.SERVICE_CLOSED);
                  return Optional.empty();
              }
              try {
                  InetAddress[] resolved =
                          resolution.get(
                                  configuration.connectTimeout().toNanos(), TimeUnit.NANOSECONDS);
                  if (resolved.length == 0) {
                      completeFailure(DirectConnectFailureCode.DNS_OR_CONNECT_FAILED);
                      return Optional.empty();
                  }
                  return Optional.of(resolved.clone());
              } catch (InterruptedException exception) {
                  Thread.currentThread().interrupt();
                  resolution.cancel(true);
                  completeFailure(DirectConnectFailureCode.CANCELLED);
                  return Optional.empty();
              } catch (ExecutionException | TimeoutException | RuntimeException exception) {
                  resolution.cancel(true);
                  completeFailure(DirectConnectFailureCode.DNS_OR_CONNECT_FAILED);
                  return Optional.empty();
              }
          }

          private Socket connectSocket'''
          text, resolver_count = re.subn(
              r'        private InetAddress\[\] resolveAddresses\(\) \{.*?\n        \}\n\n        private Socket connectSocket',
              resolver,
              text,
              flags=re.S,
          )
          if 'Optional<InetAddress[]> addresses = resolveAddresses();' not in text:
              raise SystemExit('address call site was not replaced')
          if receiver_count != 1 or resolver_count != 1:
              raise SystemExit(
                  f'unexpected replacements: receiver={receiver_count}, resolver={resolver_count}'
              )
          service.write_text(text)
          PY

      - name: Apply repository formatting
        run: ./gradlew --no-daemon spotlessApply

      - name: Commit fixes and remove workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-spotbugs-issue-88.yml
          git add client/src/main/java/pl/grzegorz2047/standalonethewalls/client/network
          git diff --cached --quiet || git commit -m 'fix(client): make Direct Connect failure contracts explicit'
          git push origin HEAD:agent/issue-88-direct-connect-service-v2
