name: Publish Sunderfront Alpha

on:
  push:
    branches:
      - "publish-v0.1.0-alpha.5"
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: publish-v0.1.0-alpha.5
  cancel-in-progress: false

jobs:
  resolve-candidate:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'publish-v0.1.0-alpha.5')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_commit: ${{ steps.candidate.outputs.source_commit }}
      publication_commit: ${{ steps.candidate.outputs.publication_commit }}
      publication_ref: ${{ steps.candidate.outputs.publication_ref }}
      version: ${{ steps.candidate.outputs.version }}
      tag: ${{ steps.candidate.outputs.tag }}
    steps:
      - name: Check out publication branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Resolve immutable release candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PUBLICATION_REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\r\n' < release/version.txt)
          TAG="v${VERSION}"
          TRIGGER=".release-trigger/${TAG}.json"
          test "$VERSION" = "0.1.0-alpha.5"
          test "$PUBLICATION_REF" = "publish-${TAG}"
          test "$(git rev-parse HEAD)" = "$PUBLICATION_COMMIT"
          test -f "$TRIGGER"

          read -r MANIFEST_VERSION SOURCE_COMMIT < <(
            python3 - "$TRIGGER" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          with open(path, encoding="utf-8") as handle:
              data = json.load(handle)
          if set(data) != {"version", "commit"}:
              raise SystemExit("release trigger must contain exactly version and commit")
          version = data["version"]
          commit = data["commit"]
          if not isinstance(version, str) or not isinstance(commit, str):
              raise SystemExit("release trigger values must be strings")
          print(version, commit)
          PY
          )

          test "$MANIFEST_VERSION" = "$VERSION"
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse "${PUBLICATION_COMMIT}^")" = "$SOURCE_COMMIT"
          test "$(git diff --name-only "$SOURCE_COMMIT" "$PUBLICATION_COMMIT")" = "$TRIGGER"

          git fetch --no-tags origin main "$PUBLICATION_REF"
          test "$(git rev-parse origin/main)" = "$SOURCE_COMMIT"
          test "$(git rev-parse "origin/${PUBLICATION_REF}")" = "$PUBLICATION_COMMIT"
          git cat-file -e "${SOURCE_COMMIT}^{commit}"
          test "$(git show "${SOURCE_COMMIT}:release/version.txt" | tr -d '\r\n')" = "$VERSION"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; releases are immutable." >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; published bytes are immutable." >&2
            exit 1
          fi

          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "publication_commit=$PUBLICATION_COMMIT" >> "$GITHUB_OUTPUT"
          echo "publication_ref=$PUBLICATION_REF" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  prepare-ui-font:
    needs: resolve-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve-candidate.outputs.source_commit }}

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/fonts/requirements.txt

      - name: Install pinned font tooling
        run: python -m pip install --disable-pip-version-check --requirement tools/fonts/requirements.txt

      - name: Download and generate licensed UI font
        run: python tools/fonts/prepare_sunderfront_ui_font.py

      - name: Upload verified UI font inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sunderfront-ui-font-atlas-release
          path: build/generated-ui-font/SunderfrontUI-Regular.png.b64*
          if-no-files-found: error
          retention-days: 1

  verify-linux:
    needs:
      - resolve-candidate
      - prepare-ui-font
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve-candidate.outputs.source_commit }}

      - name: Download verified UI font inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sunderfront-ui-font-atlas-release
          path: client/src/main/resources/Interface/Fonts

      - name: Set up Java 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-read-only: true

      - name: Run complete quality gate
        run: ./gradlew --no-daemon check

      - name: Verify JVM release distributions
        run: bash release/verify_release.sh

  verify-windows:
    needs:
      - resolve-candidate
      - prepare-ui-font
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve-candidate.outputs.source_commit }}

      - name: Download verified UI font inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sunderfront-ui-font-atlas-release
          path: client/src/main/resources/Interface/Fonts

      - name: Set up Java 21 x64
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: "21"
          architecture: x64

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-read-only: true

      - name: Run complete quality gate
        run: .\gradlew.bat --no-daemon --no-configuration-cache check

      - name: Verify Windows JVM first-run launchers
        shell: pwsh
        run: .\release\verify_windows_launchers.ps1

      - name: Build and verify Windows app image twice
        shell: pwsh
        run: .\release\verify_windows_app_image.ps1

      - name: Upload verified Windows release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sunderfront-client-windows-x64-release
          path: build/windows-release/*.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs:
      - resolve-candidate
      - prepare-ui-font
      - verify-linux
      - verify-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_COMMIT: ${{ needs.resolve-candidate.outputs.source_commit }}
      PUBLICATION_COMMIT: ${{ needs.resolve-candidate.outputs.publication_commit }}
      PUBLICATION_REF: ${{ needs.resolve-candidate.outputs.publication_ref }}
      VERSION: ${{ needs.resolve-candidate.outputs.version }}
      TAG: ${{ needs.resolve-candidate.outputs.tag }}
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve-candidate.outputs.source_commit }}
          fetch-depth: 0

      - name: Download verified UI font inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sunderfront-ui-font-atlas-release
          path: client/src/main/resources/Interface/Fonts

      - name: Set up Java 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-read-only: true

      - name: Download verified Windows release archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sunderfront-client-windows-x64-release
          path: ${{ runner.temp }}/sunderfront-windows-release

      - name: Rebuild final JVM release payload
        run: bash release/verify_release.sh

      - name: Assemble and verify cross-platform payload
        shell: bash
        run: |
          set -euo pipefail
          WINDOWS_ARCHIVE="$RUNNER_TEMP/sunderfront-windows-release/sunderfront-client-windows-x64-${VERSION}.zip"
          python3 release/assemble_cross_platform_release.py build/release "$WINDOWS_ARCHIVE" "$VERSION"
          python3 release/verify_artifacts.py build/release "$VERSION" --require-windows
          python3 release/verify_m2_documentation.py build/release "$VERSION" --require-windows
          (
            cd build/release
            sha256sum --check SHA256SUMS
          )

      - name: Revalidate immutable target and payload
        shell: bash
        run: |
          set -euo pipefail
          test "$VERSION" = "0.1.0-alpha.5"
          test "$TAG" = "v${VERSION}"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git fetch --no-tags origin main "$PUBLICATION_REF"
          test "$(git rev-parse origin/main)" = "$SOURCE_COMMIT"
          test "$(git rev-parse "origin/${PUBLICATION_REF}")" = "$PUBLICATION_COMMIT"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} appeared during verification; refusing replacement." >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${TAG} appeared during verification; refusing replacement." >&2
            exit 1
          fi

      - name: Create immutable prerelease and tag
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_COMMIT" \
            --prerelease \
            --title "Sunderfront ${TAG} — Interactive Lobby Alpha" \
            --notes-file release/RELEASE_NOTES.md \
            "build/release/sunderfront-client-windows-x64-${VERSION}.zip" \
            "build/release/sunderfront-client-${VERSION}.zip" \
            "build/release/sunderfront-server-${VERSION}.zip" \
            build/release/SHA256SUMS

      - name: Verify published target and assets
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
          test "$(git rev-list -n 1 "$TAG")" = "$SOURCE_COMMIT"
          EXPECTED=$(printf '%s\n' \
            SHA256SUMS \
            "sunderfront-client-windows-x64-${VERSION}.zip" \
            "sunderfront-client-${VERSION}.zip" \
            "sunderfront-server-${VERSION}.zip" | sort)
          ACTUAL=$(gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' | sort)
          test "$ACTUAL" = "$EXPECTED"

  audit-published-release:
    needs:
      - resolve-candidate
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_COMMIT: ${{ needs.resolve-candidate.outputs.source_commit }}
      VERSION: ${{ needs.resolve-candidate.outputs.version }}
      TAG: ${{ needs.resolve-candidate.outputs.tag }}
    steps:
      - name: Check out immutable candidate for audit tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve-candidate.outputs.source_commit }}
          fetch-depth: 0

      - name: Download published assets from GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          AUDIT_DIR="$RUNNER_TEMP/published-release"
          mkdir -p "$AUDIT_DIR"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$AUDIT_DIR"

      - name: Independently audit published target and bytes
        shell: bash
        run: |
          set -euo pipefail
          AUDIT_DIR="$RUNNER_TEMP/published-release"
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
          test "$(git rev-list -n 1 "$TAG")" = "$SOURCE_COMMIT"
          EXPECTED=$(printf '%s\n' \
            SHA256SUMS \
            "sunderfront-client-windows-x64-${VERSION}.zip" \
            "sunderfront-client-${VERSION}.zip" \
            "sunderfront-server-${VERSION}.zip" | sort)
          ACTUAL=$(find "$AUDIT_DIR" -maxdepth 1 -type f -printf '%f\n' | sort)
          test "$ACTUAL" = "$EXPECTED"
          python3 release/verify_artifacts.py "$AUDIT_DIR" "$VERSION" --require-windows
          python3 release/verify_m2_documentation.py "$AUDIT_DIR" "$VERSION" --require-windows
          (
            cd "$AUDIT_DIR"
            sha256sum --check SHA256SUMS
          )
