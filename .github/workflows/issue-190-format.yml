name: Issue 190 Spotless

on:
  push:
    branches:
      - agent/issue-190-authoritative-support-boxes
    paths:
      - .github/workflows/issue-190-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-190-authoritative-support-boxes
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Format repository
        run: ./gradlew --no-daemon spotlessApply
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Apply Spotless to final issue 190 changes"
          git push origin HEAD:agent/issue-190-authoritative-support-boxes
