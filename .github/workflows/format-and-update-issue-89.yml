name: Update and format issue 89

on:
  push:
    branches:
      - agent/issue-89-minimal-lobby

permissions:
  contents: write

jobs:
  update-and-format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/issue-89-minimal-lobby
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: '21'

      - name: Merge current main
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main

      - name: Apply repository formatter
        run: ./gradlew --no-daemon spotlessApply

      - name: Commit formatted sources and remove this workflow
        shell: bash
        run: |
          git rm .github/workflows/format-and-update-issue-89.yml
          git add protocol/src/main/java/pl/grzegorz2047/standalonethewalls/protocol
          git add protocol/src/test/java/pl/grzegorz2047/standalonethewalls/protocol
          git add server/src/main/java/pl/grzegorz2047/standalonethewalls/server
          git add server/src/test/java/pl/grzegorz2047/standalonethewalls/server
          git add docs/adr/0034-minimal-reliable-lobby.md
          git diff --cached --quiet || git commit -m 'style: update and format minimal lobby implementation'
          git push origin HEAD:agent/issue-89-minimal-lobby
