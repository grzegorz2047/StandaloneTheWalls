name: Export issue 163 source

on:
  pull_request:
  push:
    branches:
      - agent/issue-163-realtime-ticket-provisioning

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Package source tree
        shell: bash
        run: tar --exclude=.git -czf "$RUNNER_TEMP/issue-163-source.tar.gz" .

      - name: Upload source tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-163-source
          path: ${{ runner.temp }}/issue-163-source.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
