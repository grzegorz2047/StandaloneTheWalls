name: PR147 Apply

on:
  push:
    branches:
      - agent/issue-129-session-verified-preparation-scene

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-129-session-verified-preparation-scene
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Apply saved integration patch
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          saved = subprocess.check_output([
              "git",
              "show",
              "0a7bb7940cb5849d99aa601475e4bb72c7d30ce6:.github/workflows/pr147-finalize.yml",
          ], text=True)
          marker = "      - name: Integrate verified preparation scene\n        shell: python\n        run: |\n"
          start = saved.index(marker) + len(marker)
          end = saved.index("      - name: Format and test client slice\n", start)
          script = "".join(
              line[10:] if line.startswith("          ") else line
              for line in saved[start:end].splitlines(keepends=True)
          )
          exec(compile(script, "pr147-integration", "exec"), {"__name__": "__main__"})

      - name: Format implementation
        run: ./gradlew --no-daemon spotlessApply

      - name: Remove applicator and commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr147-apply.yml
          git config user.name "OpenAI Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "Verify preparation scene in connected session"
          git push origin HEAD:agent/issue-129-session-verified-preparation-scene
