name: Issue 76 maintenance

on:
  pull_request:

permissions:
  contents: write

jobs:
  maintain:
    if: github.head_ref == 'agent/issue-76-tls-identity-admission'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate strict lock and format sources
        run: ./gradlew --no-daemon :server:resolveDependencyLocks --write-locks spotlessApply

      - name: Commit maintenance output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/gradle.lockfile protocol server docs ARCHITECTURE.md IDENTITY.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Apply issue 76 locks and formatting"
          git push origin HEAD:${{ github.head_ref }}
