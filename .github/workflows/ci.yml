name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate verification metadata and run quality gate
        run: ./gradlew --no-daemon check --write-verification-metadata sha256

      - name: Commit verification metadata
        if: always() && github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- gradle/verification-metadata.xml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          git commit -m "Trust SQLite dependency artifacts"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports-linux
          path: |
            **/build/reports/jacoco/**
            **/build/reports/spotbugs/**
            **/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7

  verify-windows-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run full quality gate
        run: .\gradlew.bat --no-daemon check
