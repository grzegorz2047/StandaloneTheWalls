name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  format-team-lobby-slice:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/issue-127-visual-team-lobby'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out team lobby branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-127-visual-team-lobby

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Make team localization keys locale-stable
        shell: python
        run: |
          from pathlib import Path

          source = Path('client/src/main/java/pl/grzegorz2047/standalonethewalls/client/SunderfrontClient.java')
          text = source.read_text()
          import_marker = 'import java.util.List;\n'
          locale_import = 'import java.util.Locale;\n'
          if locale_import not in text:
              if import_marker not in text:
                  raise SystemExit('List import marker not found')
              text = text.replace(import_marker, import_marker + locale_import, 1)
          old = 'panel.team().name().toLowerCase()'
          new = 'panel.team().name().toLowerCase(Locale.ROOT)'
          if text.count(old) != 1:
              raise SystemExit(f'expected one locale-sensitive team key, got {text.count(old)}')
          source.write_text(text.replace(old, new, 1))

      - name: Transfer controlled lobby sessions only once
        shell: python
        run: |
          from pathlib import Path

          fixture = Path('client/src/test/java/pl/grzegorz2047/standalonethewalls/client/network/DirectConnectUiTestFixtures.java')
          text = fixture.read_text()
          if 'import java.util.Objects;\n' not in text:
              text = text.replace(
                  'import java.util.Optional;\n',
                  'import java.util.Optional;\nimport java.util.Objects;\n',
                  1,
              )
          admission_import = (
              'import pl.grzegorz2047.standalonethewalls.protocol.identity.'
              'PlayerSessionAdmissionStatus;\n'
          )
          if admission_import not in text:
              text = text.replace(
                  'import pl.grzegorz2047.standalonethewalls.protocol.identity.PlayerId;\n',
                  'import pl.grzegorz2047.standalonethewalls.protocol.identity.PlayerId;\n'
                  + admission_import,
                  1,
              )
          text = text.replace(
              '        private final ConnectedLobbySession session;\n',
              '        private ConnectedLobbySession session;\n',
              1,
          )
          old_method = '''        public ConnectedLobbySession session() {
              return session;
          }
'''
          new_method = '''        public synchronized DirectConnectResult connectedResult(
                  PlayerSessionAdmissionStatus admissionStatus) {
              Objects.requireNonNull(admissionStatus, "admissionStatus");
              ConnectedLobbySession transferred = session;
              if (transferred == null) {
                  throw new IllegalStateException("controlled lobby session was already transferred");
              }
              session = null;
              return new DirectConnectResult.Connected(transferred, admissionStatus);
          }
'''
          if text.count(old_method) != 1:
              raise SystemExit(f'expected one mutable session accessor, got {text.count(old_method)}')
          fixture.write_text(text.replace(old_method, new_method, 1))

          test = Path('client/src/test/java/pl/grzegorz2047/standalonethewalls/client/ui/directconnect/ConnectedLobbyUiCommandTest.java')
          text = test.read_text()
          old_snapshot_wait = '''        waitUntil(() -> lobby.session().currentSnapshot().revision() == 4L);
          controller.refreshConnectedSnapshot();
'''
          new_snapshot_wait = '''        waitUntil(
                  () -> {
                      controller.refreshConnectedSnapshot();
                      return connected(controller).lobby().revision() == 4L;
                  });
'''
          if text.count(old_snapshot_wait) != 1:
              raise SystemExit('snapshot wait using exposed session was not found exactly once')
          text = text.replace(old_snapshot_wait, new_snapshot_wait, 1)
          if text.count('        lobby.session().closeAsync();\n') != 1:
              raise SystemExit('manual close using exposed session was not found exactly once')
          text = text.replace(
              '        lobby.session().closeAsync();\n',
              '        controller.escape();\n',
              1,
          )
          old_result = '''            result =
                      new DirectConnectResult.Connected(
                              lobby.session(),
                              PlayerSessionAdmissionStatus.LOCAL_RETURNING_ACCEPTED);
'''
          new_result = '''            result =
                      lobby.connectedResult(
                              PlayerSessionAdmissionStatus.LOCAL_RETURNING_ACCEPTED);
'''
          if text.count(old_result) != 1:
              raise SystemExit('backend session construction was not found exactly once')
          test.write_text(text.replace(old_result, new_result, 1))

      - name: Apply canonical Java formatting
        run: ./gradlew --no-daemon spotlessApply

      - name: Verify formatted client slice
        run: ./gradlew --no-daemon :client:test :client:spotbugsMain :client:spotbugsTest --rerun-tasks

      - name: Upload team lobby diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-lobby-quality-reports
          path: |
            client/build/reports/spotbugs/**
            client/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 2

      - name: Commit formatting only when required
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- '*.java'; then
            echo "Java sources are already formatted."
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.java'
          git commit -m '[P0][Client/UI] Apply canonical team lobby formatting'
          git push origin HEAD:agent/issue-127-visual-team-lobby

  verify-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run full quality gate
        run: ./gradlew --no-daemon check

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports-linux
          path: |
            **/build/reports/jacoco/**
            **/build/reports/spotbugs/**
            **/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7

  verify-release-linux:
    needs:
      - verify-linux
      - verify-windows-app-image
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Java 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-read-only: true

      - name: Download verified Windows app image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sunderfront-client-windows-x64
          path: ${{ runner.temp }}/sunderfront-windows-release

      - name: Verify JVM release distributions
        run: bash release/verify_release.sh

      - name: Assemble and verify cross-platform payload
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\r\n' < release/version.txt)
          WINDOWS_ARCHIVE="$RUNNER_TEMP/sunderfront-windows-release/sunderfront-client-windows-x64-${VERSION}.zip"
          python3 release/assemble_cross_platform_release.py build/release "$WINDOWS_ARCHIVE" "$VERSION"
          python3 release/verify_artifacts.py build/release "$VERSION" --require-windows
          (
            cd build/release
            sha256sum --check SHA256SUMS
          )

      - name: Upload verified release artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: direct-connect-alpha-artifacts
          path: build/release/**
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0

  verify-windows-first-run:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Windows first-run launchers
        shell: pwsh
        run: .\release\verify_windows_launchers.ps1

  verify-windows-app-image:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Java 21 x64
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: "21"
          architecture: x64

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-read-only: true

      - name: Build and verify Windows app image twice
        shell: pwsh
        run: .\release\verify_windows_app_image.ps1

      - name: Upload verified Windows app image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sunderfront-client-windows-x64
          path: build/windows-release/*.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  verify-windows-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run full quality gate
        run: .\gradlew.bat --no-daemon --no-configuration-cache check
