          migration = '''    private void migrateSchemaToCurrent(Connection connection) throws SQLException {
              int version = readSchemaVersion(connection);
              if (version > SCHEMA_VERSION) {
                  throw new SQLException("SQLite local identity schema is newer than this server");
              }
              if (version == 1) {
                  createPlayerBanSchema(connection);
                  try (PreparedStatement statement =
                          connection.prepareStatement(
                                  "UPDATE "
                                          + SCHEMA_TABLE
                                          + " SET version = ? WHERE singleton = 1 AND version = 1")) {
                      statement.setInt(1, SCHEMA_VERSION);
                      requireOneRow(statement.executeUpdate(), "local identity schema migration");
                  }
                  return;
              }
              if (version != SCHEMA_VERSION) {
                  throw new SQLException("SQLite local identity schema version is unsupported");
              }
          }

          private static int readSchemaVersion(Connection connection) throws SQLException {
              int rowCount = 0;
              int version = 0;
              try (PreparedStatement statement =
                              connection.prepareStatement(
                                      "SELECT singleton, version FROM " + SCHEMA_TABLE);
                      ResultSet result = statement.executeQuery()) {
                  while (result.next()) {
                      rowCount++;
                      if (result.getInt(1) != 1) {
                          throw new SQLException(
                                  "SQLite local identity schema metadata is invalid");
                      }
                      version = result.getInt(2);
                  }
              }
              if (rowCount != 1) {
                  throw new SQLException(
                          "SQLite local identity schema metadata is incomplete");
              }
              return version;
          }

          private static void createPlayerBanSchema(Connection connection) throws SQLException {
              try (Statement statement = connection.createStatement()) {
                  statement.executeUpdate(
                          "CREATE TABLE "
                                  + BANS_TABLE
                                  + " (player_id TEXT PRIMARY KEY NOT NULL, banned_at TEXT NOT NULL, "
                                  + "administrator_id TEXT NOT NULL, reason TEXT NOT NULL) WITHOUT ROWID");
                  statement.executeUpdate(
                          "CREATE TABLE "
                                  + BAN_AUDIT_TABLE
                                  + " (sequence INTEGER PRIMARY KEY, occurred_at TEXT NOT NULL, "
                                  + "administrator_id TEXT NOT NULL, action TEXT NOT NULL, "
                                  + "player_id TEXT NOT NULL, reason TEXT NOT NULL, "
                                  + "CHECK (action IN ('BAN', 'UNBAN')))");
                  statement.executeUpdate(
                          "CREATE TRIGGER "
                                  + BAN_AUDIT_UPDATE_TRIGGER
                                  + " BEFORE UPDATE ON "
                                  + BAN_AUDIT_TABLE
                                  + " BEGIN SELECT RAISE(ABORT, "
                                  + "'local player ban audit is append-only'); END");
                  statement.executeUpdate(
                          "CREATE TRIGGER "
                                  + BAN_AUDIT_DELETE_TRIGGER
                                  + " BEFORE DELETE ON "
                                  + BAN_AUDIT_TABLE
                                  + " BEGIN SELECT RAISE(ABORT, "
                                  + "'local player ban audit is append-only'); END");
              }
          }

'''
