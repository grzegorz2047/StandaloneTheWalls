name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run full quality gate
        run: ./gradlew --no-daemon check

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports-linux
          path: |
            **/build/reports/jacoco/**
            **/build/reports/spotbugs/**
            **/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7

  verify-release-linux:
    needs: verify-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Java 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-read-only: true

      - name: Verify release distributions
        run: bash release/verify_release.sh

      - name: Upload verified release artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: direct-connect-alpha-artifacts
          path: build/release/**
          if-no-files-found: ignore
          retention-days: 7

  verify-windows-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run full quality gate
        run: .\gradlew.bat --no-daemon --no-configuration-cache check

  verify-published-alpha:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/verify-v0.1.0-alpha.1-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.1.0-alpha.1
      SOURCE_COMMIT: de30dc747cc9a0a7ebf6a1a273bf3029cd28a7d6
    steps:
      - name: Verify release metadata and assets
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,targetCommitish,isDraft,isPrerelease,assets \
            > release.json
          jq -e --arg tag "$TAG" --arg source "$SOURCE_COMMIT" '
            .tagName == $tag and
            .targetCommitish == $source and
            .isDraft == false and
            .isPrerelease == true and
            ([.assets[].name] | sort) == [
              "SHA256SUMS",
              "sunderfront-client-0.1.0-alpha.1.zip",
              "sunderfront-server-0.1.0-alpha.1.zip"
            ] and
            ([.assets[].size > 0] | all)
          ' release.json
          jq '{tagName, targetCommitish, isDraft, isPrerelease, assets: [.assets[] | {name, size}]}' release.json

      - name: Download and verify published bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir published
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir published
          test "$(find published -maxdepth 1 -type f -printf '%f\n' | sort)" = "$(printf '%s\n' \
            SHA256SUMS \
            sunderfront-client-0.1.0-alpha.1.zip \
            sunderfront-server-0.1.0-alpha.1.zip | sort)"
          (
            cd published
            sha256sum --check SHA256SUMS
            unzip -t sunderfront-client-0.1.0-alpha.1.zip
            unzip -t sunderfront-server-0.1.0-alpha.1.zip
          )
