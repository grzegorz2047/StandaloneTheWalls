name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  test-and-harden-issue-174:
    if: github.head_ref == 'agent/issue-174-preparation-sync'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-174-preparation-sync

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/fonts/requirements.txt

      - name: Generate pinned UI font inputs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement tools/fonts/requirements.txt
          python tools/fonts/prepare_sunderfront_ui_font.py
          cp build/generated-ui-font/SunderfrontUI-Regular.png.b64* client/src/main/resources/Interface/Fonts/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Add runtime test and client SpotBugs fixes
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/add-issue-174-runtime-test.py
          python .github/scripts/fix-issue-174-client-spotbugs.py
          python - <<'PY'
          from pathlib import Path

          path = Path("server/src/test/java/pl/grzegorz2047/standalonethewalls/server/identity/session/MinimalLobbyRuntimeTest.java")
          text = path.read_text(encoding="utf-8")
          old = """            assertThat(latestMatchSnapshotUnchecked(alpha).revision())
                              .isEqualTo(preparation.revision());
          """
          new = """            LobbyMatchPhaseSnapshot afterDisconnect = latestMatchSnapshotUnchecked(alpha);
                      assertThat(afterDisconnect.phase()).isEqualTo(LobbyMatchPhase.PREPARATION);
                      assertThat(afterDisconnect.connectedPlayers()).isEqualTo(1);
                      assertThat(afterDisconnect.revision())
                              .isEqualTo(preparation.revision() + 1L);
          """
          if text.count(old) != 1:
              raise RuntimeError("expected exactly one stale post-disconnect revision assertion")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Format Java and run focused gates
        run: ./gradlew --no-daemon spotlessJavaApply :server:test :client:spotbugsMain

      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-174-focused-diagnostics
          path: |
            client/build/reports/spotbugs/**
            server/build/reports/tests/**
            server/build/test-results/**
          if-no-files-found: ignore
          retention-days: 2

      - name: Commit tested changes and remove one-time automation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          rm .github/scripts/add-issue-174-runtime-test.py
          rm .github/scripts/fix-issue-174-client-spotbugs.py
          rm -f client/src/main/resources/Interface/Fonts/SunderfrontUI-Regular.png.b64*
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Test and harden authoritative preparation movement"
          git push origin HEAD:agent/issue-174-preparation-sync
