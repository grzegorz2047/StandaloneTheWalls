name: Apply Direct Connect UI formatting

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-90-direct-connect-ui
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Make headless navigation deterministic
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('client/src/main/java/pl/grzegorz2047/standalonethewalls/client/SunderfrontClient.java')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import java.util.concurrent.Future;\n', '')
          replacement = '''    void exerciseDirectConnectNavigation(Duration timeout) {
              Objects.requireNonNull(timeout, "timeout");
              if (timeout.isZero() || timeout.isNegative()) {
                  throw new IllegalArgumentException("timeout must be positive");
              }
              if (!smokeMode) {
                  throw new IllegalStateException("navigation smoke exercise requires smoke mode");
              }
              openDirectConnectScreen();
              if (screen != Screen.DIRECT_CONNECT || directConnectController == null) {
                  throw new IllegalStateException("Direct Connect screen did not open in smoke mode");
              }
              directConnectController.escape();
              if (screen != Screen.START_MENU || directConnectController != null) {
                  throw new IllegalStateException(
                          "Direct Connect screen did not return to the start menu");
              }
          }

          '''
          pattern = re.compile(
              r'    void exerciseDirectConnectNavigation\(Duration timeout\).*?'
              r'(?=    private void registerInputs\(\))',
              re.DOTALL,
          )
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected exactly one headless smoke method, found {count}')
          path.write_text(updated, encoding='utf-8')

      - name: Apply repository formatter
        run: ./gradlew --no-daemon spotlessApply

      - name: Restore standard workflows
        run: |
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/format-direct-connect-ui.yml

      - name: Commit formatted sources
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "style(client): format Direct Connect UI and fix headless smoke"
          git push origin HEAD:agent/issue-90-direct-connect-ui
