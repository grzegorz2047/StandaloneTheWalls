name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  integrate-issue-178:
    if: github.head_ref == 'agent/issue-178-prediction-reconciliation'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-178-prediction-reconciliation

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/fonts/requirements.txt

      - name: Generate pinned UI font inputs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement tools/fonts/requirements.txt
          python tools/fonts/prepare_sunderfront_ui_font.py
          cp build/generated-ui-font/SunderfrontUI-Regular.png.b64* client/src/main/resources/Interface/Fonts/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Integrate prediction reconciliation
        run: python .github/scripts/apply-issue-178-reconciliation.py

      - name: Format and verify client
        run: ./gradlew --no-daemon spotlessJavaApply :client:test :client:spotbugsMain

      - name: Commit tested integration and remove helper files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          rm .github/scripts/apply-issue-178-reconciliation.py
          rm -f client/src/main/resources/Interface/Fonts/SunderfrontUI-Regular.png.b64*
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Reconcile bounded local preparation prediction"
          git push origin HEAD:agent/issue-178-prediction-reconciliation
