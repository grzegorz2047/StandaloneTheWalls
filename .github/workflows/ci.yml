name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix-issue-174-server-spotbugs:
    if: github.head_ref == 'agent/issue-174-preparation-sync'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-174-preparation-sync

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply focused SpotBugs fix
        run: python .github/scripts/fix-issue-174-server-spotbugs.py

      - name: Format and verify server
        run: ./gradlew --no-daemon spotlessJavaApply :server:test :server:spotbugsMain

      - name: Commit fix and remove one-time automation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          rm .github/scripts/fix-issue-174-server-spotbugs.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Narrow preparation transition rollback failure"
          git push origin HEAD:agent/issue-174-preparation-sync
