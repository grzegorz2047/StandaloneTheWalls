name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run full quality gate
        id: quality
        continue-on-error: true
        run: ./gradlew --no-daemon check

      - name: Generate formatted Direct Connect sources
        if: steps.quality.outcome == 'failure'
        run: ./gradlew --no-daemon spotlessApply

      - name: Upload formatted Direct Connect sources
        if: steps.quality.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: formatted-direct-connect-ui
          path: |
            client/src/main/java/pl/grzegorz2047/standalonethewalls/client/SunderfrontClient.java
            client/src/main/java/pl/grzegorz2047/standalonethewalls/client/network/DirectConnectService.java
            client/src/main/java/pl/grzegorz2047/standalonethewalls/client/ui/directconnect/**
            client/src/test/java/pl/grzegorz2047/standalonethewalls/client/SunderfrontClientDirectConnectSmokeTest.java
            client/src/test/java/pl/grzegorz2047/standalonethewalls/client/network/DirectConnectServiceTest.java
            client/src/test/java/pl/grzegorz2047/standalonethewalls/client/network/DirectConnectUiTestFixtures.java
            client/src/test/java/pl/grzegorz2047/standalonethewalls/client/ui/directconnect/**
            server/src/test/java/pl/grzegorz2047/standalonethewalls/server/DirectConnectUiLoopbackTest.java
          if-no-files-found: error
          retention-days: 1

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports-linux
          path: |
            **/build/reports/jacoco/**
            **/build/reports/spotbugs/**
            **/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve quality-gate failure
        if: steps.quality.outcome == 'failure'
        run: exit 1

  verify-windows-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run full quality gate
        run: .\gradlew.bat --no-daemon check
