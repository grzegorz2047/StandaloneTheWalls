name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-issue-198-vertical-slice:
    if: github.head_ref == 'agent/issue-198-open-central-walls' && github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out latest pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Apply server and client phase policy
        shell: pwsh
        run: |
          python tools/issue_198_apply.py
          python tools/issue_198_post_apply.py

      - name: Format and verify focused modules
        shell: pwsh
        run: |
          .\gradlew.bat --no-daemon spotlessApply
          .\gradlew.bat --no-daemon :map-format:test :protocol:test :server:test :client:compileJava

      - name: Commit verified implementation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) { exit 0 }
          git commit --no-verify -m "Apply authoritative central wall opening"
          git pull --rebase origin ${{ github.head_ref }}
          git push origin HEAD:${{ github.head_ref }}
