name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run full quality gate
        run: ./gradlew --no-daemon check

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports-linux
          path: |
            **/build/reports/jacoco/**
            **/build/reports/spotbugs/**
            **/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7

  migrate-issue-128-ui:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/issue-128-authoritative-countdown'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply strict UI migration
        run: |
          python3 .github/scripts/patch_issue_128_ui.py
          python3 .github/scripts/patch_issue_128_phase_tests.py
          python3 .github/scripts/patch_issue_128_refresh_tests.py

      - name: Format and validate UI migration
        run: |
          set -euo pipefail
          ./gradlew --no-daemon spotlessApply \
            :protocol:test \
            :client:test \
            :client:spotbugsMain \
            :client:spotbugsTest \
            :server:test
          python3 - <<'PY'
          import subprocess

          allowed = {
              'client/src/main/java/pl/grzegorz2047/standalonethewalls/client/SunderfrontClient.java',
              'client/src/main/java/pl/grzegorz2047/standalonethewalls/client/ui/directconnect/ConnectedLobbyMatchModel.java',
              'client/src/main/java/pl/grzegorz2047/standalonethewalls/client/ui/directconnect/ConnectedLobbyScreenModel.java',
              'client/src/main/java/pl/grzegorz2047/standalonethewalls/client/ui/directconnect/DirectConnectUiController.java',
              'client/src/test/java/pl/grzegorz2047/standalonethewalls/client/network/DirectConnectUiTestFixtures.java',
              'client/src/test/java/pl/grzegorz2047/standalonethewalls/client/ui/directconnect/ConnectedLobbyUiCommandTest.java',
              'client/src/test/java/pl/grzegorz2047/standalonethewalls/client/ui/directconnect/DirectConnectScreenModelTest.java',
              'server/src/test/java/pl/grzegorz2047/standalonethewalls/server/ServerLauncherTest.java',
          }
          actual = {
              line for line in subprocess.check_output(
                  ['git', 'diff', '--name-only'], text=True
              ).splitlines() if line
          }
          required = {
              'client/src/main/java/pl/grzegorz2047/standalonethewalls/client/SunderfrontClient.java',
              'client/src/main/java/pl/grzegorz2047/standalonethewalls/client/ui/directconnect/DirectConnectUiController.java',
              'client/src/test/java/pl/grzegorz2047/standalonethewalls/client/network/DirectConnectUiTestFixtures.java',
              'client/src/test/java/pl/grzegorz2047/standalonethewalls/client/ui/directconnect/ConnectedLobbyUiCommandTest.java',
              'server/src/test/java/pl/grzegorz2047/standalonethewalls/server/ServerLauncherTest.java',
          }
          unexpected = actual - allowed
          missing = required - actual
          if unexpected or missing:
              raise SystemExit(f'unexpected={sorted(unexpected)} missing={sorted(missing)} actual={sorted(actual)}')
          PY

      - name: Commit migrated lobby phase UI
        run: |
          set -euo pipefail
          git add -- \
            client/src/main/java/pl/grzegorz2047/standalonethewalls/client/SunderfrontClient.java \
            client/src/main/java/pl/grzegorz2047/standalonethewalls/client/ui/directconnect/ConnectedLobbyMatchModel.java \
            client/src/main/java/pl/grzegorz2047/standalonethewalls/client/ui/directconnect/ConnectedLobbyScreenModel.java \
            client/src/main/java/pl/grzegorz2047/standalonethewalls/client/ui/directconnect/DirectConnectUiController.java \
            client/src/test/java/pl/grzegorz2047/standalonethewalls/client/network/DirectConnectUiTestFixtures.java \
            client/src/test/java/pl/grzegorz2047/standalonethewalls/client/ui/directconnect/ConnectedLobbyUiCommandTest.java \
            client/src/test/java/pl/grzegorz2047/standalonethewalls/client/ui/directconnect/DirectConnectScreenModelTest.java \
            server/src/test/java/pl/grzegorz2047/standalonethewalls/server/ServerLauncherTest.java
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Migrate issue 128 lobby phase UI"
          git push origin HEAD:${GITHUB_HEAD_REF}

  verify-release-linux:
    needs:
      - verify-linux
      - verify-windows-app-image
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Java 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-read-only: true

      - name: Download verified Windows app image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sunderfront-client-windows-x64
          path: ${{ runner.temp }}/sunderfront-windows-release

      - name: Verify JVM release distributions
        run: bash release/verify_release.sh

      - name: Assemble and verify cross-platform payload
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\r\n' < release/version.txt)
          WINDOWS_ARCHIVE="$RUNNER_TEMP/sunderfront-windows-release/sunderfront-client-windows-x64-${VERSION}.zip"
          python3 release/assemble_cross_platform_release.py build/release "$WINDOWS_ARCHIVE" "$VERSION"
          python3 release/verify_artifacts.py build/release "$VERSION" --require-windows
          (
            cd build/release
            sha256sum --check SHA256SUMS
          )

      - name: Upload verified release artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: direct-connect-alpha-artifacts
          path: build/release/**
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0

  verify-windows-first-run:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Windows first-run launchers
        shell: pwsh
        run: .\release\verify_windows_launchers.ps1

  verify-windows-app-image:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Java 21 x64
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: "21"
          architecture: x64

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-read-only: true

      - name: Build and verify Windows app image twice
        shell: pwsh
        run: .\release\verify_windows_app_image.ps1

      - name: Upload verified Windows app image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sunderfront-client-windows-x64
          path: build/windows-release/*.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  verify-windows-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run full quality gate
        run: .\gradlew.bat --no-daemon --no-configuration-cache check
