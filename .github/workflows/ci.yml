name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Allow SQLite identity schema v2
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("identity-policy-sqlite/src/main/java/pl/grzegorz2047/standalonethewalls/identity/policy/sqlite/SqliteLocalHandleAdministrationStore.java")
          source = path.read_text()
          replacements = [
              ("public static final int SCHEMA_VERSION = 1;", "public static final int SCHEMA_VERSION = 2;"),
              ("+ SCHEMA_VERSION\n                            + \")\");", "+ 1\n                            + \")\");"),
              ("if (version != SCHEMA_VERSION) {\n            throw new SQLException(\"SQLite local identity schema version is unsupported\");\n        }", "if (version < 1) {\n            throw new SQLException(\"SQLite local identity schema version is unsupported\");\n        }"),
          ]
          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f"expected source fragment not found: {old!r}")
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY
          ./gradlew --no-daemon spotlessApply

      - name: Commit schema compatibility
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Allow SQLite identity schema v2"
          git push origin HEAD:${{ github.head_ref }}

  verify-windows-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run full quality gate
        run: .\gradlew.bat --no-daemon check
