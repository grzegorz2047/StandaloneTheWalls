name: Apply Direct Connect concurrency fixes

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-90-direct-connect-ui
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Make shared state explicit
        shell: python
        run: |
          from pathlib import Path

          client = Path('client/src/main/java/pl/grzegorz2047/standalonethewalls/client/SunderfrontClient.java')
          text = client.read_text(encoding='utf-8')
          replacements = {
              '    private int renderedWidth = -1;': '    private volatile int renderedWidth = -1;',
              '    private int renderedHeight = -1;': '    private volatile int renderedHeight = -1;',
              '        if (screen != Screen.DIRECT_CONNECT || directConnectController == null) {': '        if (screen != Screen.DIRECT_CONNECT) {',
              '        if (screen != Screen.START_MENU || directConnectController != null) {': '        if (screen != Screen.START_MENU) {',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected one SunderfrontClient match for: {old}')
              text = text.replace(old, new)
          client.write_text(text, encoding='utf-8')

          controller = Path('client/src/main/java/pl/grzegorz2047/standalonethewalls/client/ui/directconnect/DirectConnectUiController.java')
          text = controller.read_text(encoding='utf-8')
          if 'import java.util.concurrent.atomic.AtomicLong;\n' not in text:
              text = text.replace(
                  'import java.util.concurrent.atomic.AtomicBoolean;\n',
                  'import java.util.concurrent.atomic.AtomicBoolean;\nimport java.util.concurrent.atomic.AtomicLong;\n',
              )
          exact = {
              '    private long connectedRevision = -1L;': '    private final AtomicLong connectedRevision = new AtomicLong(-1L);',
              '    private long generation;': '    private final AtomicLong generation = new AtomicLong();',
              '        generation++;': '        generation.incrementAndGet();',
              '        long attemptGeneration = ++generation;': '        long attemptGeneration = generation.incrementAndGet();',
              '        connectedRevision = -1L;': '        connectedRevision.set(-1L);',
              '                connectedRevision = snapshot.revision();': '                connectedRevision.set(snapshot.revision());',
              '            connectedRevision = snapshot.revision();': '            connectedRevision.set(snapshot.revision());',
              '        return !closed.get() && generation == attemptGeneration;': '        return !closed.get() && generation.get() == attemptGeneration;',
          }
          expected_counts = {
              '    private long connectedRevision = -1L;': 1,
              '    private long generation;': 1,
              '        generation++;': 4,
              '        long attemptGeneration = ++generation;': 2,
              '        connectedRevision = -1L;': 4,
              '                connectedRevision = snapshot.revision();': 1,
              '            connectedRevision = snapshot.revision();': 1,
              '        return !closed.get() && generation == attemptGeneration;': 1,
          }
          for old, new in exact.items():
              count = text.count(old)
              if count != expected_counts[old]:
                  raise SystemExit(f'expected {expected_counts[old]} controller matches, found {count}: {old}')
              text = text.replace(old, new)
          old = '        if (snapshot.revision() > connectedRevision) {'
          new = '        if (snapshot.revision() > connectedRevision.get()) {'
          if text.count(old) != 1:
              raise SystemExit('expected one connectedRevision comparison')
          controller.write_text(text.replace(old, new), encoding='utf-8')

      - name: Apply repository formatter
        run: ./gradlew --no-daemon spotlessApply

      - name: Restore standard CI
        run: git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml

      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(client): make Direct Connect UI concurrency explicit"
          git push origin HEAD:agent/issue-90-direct-connect-ui
