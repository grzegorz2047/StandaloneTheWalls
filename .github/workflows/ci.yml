name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-issue-198-vertical-slice:
    if: github.head_ref == 'agent/issue-198-open-central-walls' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out latest pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Apply server and client phase policy
        run: |
          python tools/issue_198_apply.py
          python tools/issue_198_post_apply.py

      - name: Format and verify focused modules
        run: |
          ./gradlew --no-daemon spotlessApply
          ./gradlew --no-daemon :map-format:test :protocol:test :server:test :client:compileJava

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/main/java/pl/grzegorz2047/standalonethewalls/client/ui/directconnect/DirectConnectUiController.java
          git add client/src/main/resources/i18n/messages_en.properties
          git add client/src/main/resources/i18n/messages_pl.properties
          git add map-format/src/test/java/pl/grzegorz2047/standalonethewalls/mapformat/PreparationObstacleMapTest.java
          git add map-format/src/test/java/pl/grzegorz2047/standalonethewalls/mapformat/PreparationWorldBoundsTest.java
          git add server/src/main/java/pl/grzegorz2047/standalonethewalls/server/lobby/MinimalLobbyRuntime.java
          git add server/src/main/java/pl/grzegorz2047/standalonethewalls/server/preparation/PreparationMovementSimulation.java
          git add server/src/test/java/pl/grzegorz2047/standalonethewalls/server/preparation/PreparationObstacleMovementSimulationTest.java
          git diff --cached --quiet && exit 0
          git commit -m "Apply authoritative central wall opening"
          git pull --rebase origin ${{ github.head_ref }}
          git push origin HEAD:${{ github.head_ref }}
