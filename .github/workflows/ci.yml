name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix SQLite binding capacity query
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("identity-policy-sqlite/src/main/java/pl/grzegorz2047/standalonethewalls/identity/policy/sqlite/SqliteLocalHandleAdministrationStore.java")
          source = path.read_text()
          old = "if (count(connection, BINDINGS_TABLE) >= maximumBindings) {"
          new = "if (countBindings(connection) >= maximumBindings) {"
          if old not in source:
              raise SystemExit("expected SQLite capacity query not found")
          path.write_text(source.replace(old, new, 1))
          PY
          ./gradlew --no-daemon spotlessApply

      - name: Commit SQLite query fix
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Fix SQLite binding capacity query"
          git push origin HEAD:${{ github.head_ref }}

  verify-windows-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run full quality gate
        run: .\gradlew.bat --no-daemon check
