name: Temporary Spotless Issue 200

on:
  push:
    branches:
      - agent/issue-200-graphics-quality-core

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew --no-daemon spotlessApply
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/main/java/pl/grzegorz2047/standalonethewalls/client/performance
          git add client/src/test/java/pl/grzegorz2047/standalonethewalls/client/performance
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --check
          git commit -m "Apply Spotless to performance benchmark core"
          git push origin "HEAD:${GITHUB_REF_NAME}"
