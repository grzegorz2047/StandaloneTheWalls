name: PR149 Finalize Preparation Entry

on:
  push:
    branches:
      - agent/issue-129-client-preparation-entry

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-129-client-preparation-entry
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Apply preparation entry integration
        run: python tools/pr149_apply.py

      - name: Format and test preparation entry
        run: |
          ./gradlew --no-daemon spotlessApply
          ./gradlew --no-daemon :client:test \
            --tests "pl.grzegorz2047.standalonethewalls.client.preparation.PreparationTransitionGateTest" \
            --tests "pl.grzegorz2047.standalonethewalls.client.SunderfrontPreparationTransitionTest" \
            --tests "pl.grzegorz2047.standalonethewalls.client.ui.directconnect.DirectConnectUiControllerTest"

      - name: Commit clean implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr149-finalize.yml tools/pr149_apply.py
          git config user.name "OpenAI Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "Enter preparation from verified scene"
          git push origin HEAD:agent/issue-129-client-preparation-entry
