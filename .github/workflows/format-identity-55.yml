name: One-time identity formatter

on:
  push:
    branches:
      - agent/issue-55-identity-orchestration

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-55-identity-orchestration
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply Spotless
        run: ./gradlew --no-daemon spotlessApply

      - name: Verify formatter scope
        shell: bash
        run: |
          allowed='^(ARCHITECTURE\.md|docs/adr/0010-identity-proof-v2-reliable-exchange\.md|docs/protocol/identity-exchange-v1-vectors\.txt|protocol/src/(main|test)/java/pl/grzegorz2047/standalonethewalls/protocol/identity/|transport-bctls/src/(main|test)/java/pl/grzegorz2047/standalonethewalls/transport/bctls/|\.github/workflows/format-identity-55\.yml)'
          unexpected="$(git status --porcelain | cut -c4- | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected formatter changes:\n%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Remove one-time workflow
        run: rm .github/workflows/format-identity-55.yml

      - name: Commit formatted files
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ARCHITECTURE.md docs/adr/0010-identity-proof-v2-reliable-exchange.md docs/protocol/identity-exchange-v1-vectors.txt protocol/src/main/java/pl/grzegorz2047/standalonethewalls/protocol/identity protocol/src/test/java/pl/grzegorz2047/standalonethewalls/protocol/identity transport-bctls/src/main/java/pl/grzegorz2047/standalonethewalls/transport/bctls transport-bctls/src/test/java/pl/grzegorz2047/standalonethewalls/transport/bctls .github/workflows/format-identity-55.yml
          git commit -m 'Apply Spotless to identity exchange'
          git push origin HEAD:agent/issue-55-identity-orchestration
