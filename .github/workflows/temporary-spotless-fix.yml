name: Temporary Spotless Fix

on:
  push:
    branches:
      - agent/issue-198-open-central-walls

permissions:
  contents: write

jobs:
  spotless:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply repository formatting
        run: ./gradlew --no-daemon spotlessApply

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Spotless formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
