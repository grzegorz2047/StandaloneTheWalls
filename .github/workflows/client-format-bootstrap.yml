name: One-time Client Spotless Apply

on:
  push:
    branches:
      - agent/issue-26-start-screen

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out client branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-26-start-screen
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply repository formatting
        run: ./gradlew --no-daemon spotlessApply

      - name: Verify exact formatting scope
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(client/src/main/java/pl/grzegorz2047/standalonethewalls/client/i18n/ClientMessages\.java|client/src/main/java/pl/grzegorz2047/standalonethewalls/client/ui/StartMenuModel\.java|client/src/test/java/pl/grzegorz2047/standalonethewalls/client/ClientLaunchOptionsTest\.java|client/src/test/java/pl/grzegorz2047/standalonethewalls/client/i18n/ClientLanguageTest\.java|client/src/test/java/pl/grzegorz2047/standalonethewalls/client/i18n/ClientMessagesTest\.java|client/src/test/java/pl/grzegorz2047/standalonethewalls/client/ui/StartMenuModelTest\.java)$'
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if ! [[ "$file" =~ $allowed ]]; then
              echo "Unexpected file modified by client formatting: $file" >&2
              exit 1
            fi
          done < <(git diff --name-only)

      - name: Commit formatted client and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/client-format-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply client formatting"
          git push origin HEAD:agent/issue-26-start-screen
