name: Issue 196 final test formatting

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/issue-196-authoritative-headroom'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out issue branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Java 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-read-only: true

      - name: Apply repository formatting
        run: ./gradlew --no-daemon spotlessApply

      - name: Commit exact formatted test changes
        shell: bash
        run: |
          set -euo pipefail
          git add \
            client/src/test/java/pl/grzegorz2047/standalonethewalls/client/preparation/PreparationPredictionHistoryTest.java \
            client/src/test/java/pl/grzegorz2047/standalonethewalls/client/preparation/PreparationSupportMovementControllerTest.java \
            server/src/test/java/pl/grzegorz2047/standalonethewalls/server/preparation/PreparationObstacleMovementSimulationTest.java
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Format issue 196 acceptance tests'
          git push origin HEAD:${{ github.head_ref }}

      - name: Run focused movement tests
        run: ./gradlew --no-daemon :client:test :server:test
