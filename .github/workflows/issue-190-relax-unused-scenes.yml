name: Issue 190 Unused Scene Patch

on:
  push:
    branches:
      - agent/issue-190-authoritative-support-boxes
    paths:
      - .github/workflows/issue-190-relax-unused-scenes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-190-authoritative-support-boxes
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restrict support requirements to the default scene
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('map-format/src/main/java/pl/grzegorz2047/standalonethewalls/mapformat/Glb2PreparationSupportDecoder.java')
          source = path.read_text(encoding='utf-8')
          old = '''            if (nodeIndices == null) {
                          throw failure(
                                  PreparationSupportException.Code.MISSING_LAYOUT,
                                  "collision GLB scene has no direct nodes");
                      }
                      scenes.add(new Scene(nodeIndices));'''
          new = '''            scenes.add(new Scene(nodeIndices == null ? List.of() : nodeIndices));'''
          if old not in source:
              raise SystemExit('expected readScenes block was not found')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
          ./gradlew --no-daemon spotlessApply
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Allow unused collision scenes without direct nodes"
          git push origin HEAD:agent/issue-190-authoritative-support-boxes
