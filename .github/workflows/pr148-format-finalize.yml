name: PR148 Format Finalize

on:
  push:
    branches:
      - agent/issue-129-preparation-movement-boundary

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-129-preparation-movement-boundary
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Format changed Java sources
        run: ./gradlew --no-daemon spotlessApply

      - name: Remove finalizer and commit formatted sources
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr148-format-finalize.yml
          git config user.name "OpenAI Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "Format preparation movement boundary"
          git push origin HEAD:agent/issue-129-preparation-movement-boundary
