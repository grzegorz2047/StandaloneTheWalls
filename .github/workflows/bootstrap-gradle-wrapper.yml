name: Bootstrap verified Gradle wrapper

on:
  push:
    branches:
      - agent/issue-20-foundation
    paths:
      - .github/workflows/bootstrap-gradle-wrapper.yml

permissions:
  contents: write

jobs:
  bootstrap-wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Generate wrapper with pinned distribution checksum
        run: >-
          gradle wrapper
          --gradle-version 9.6.1
          --distribution-type bin
          --gradle-distribution-sha256-sum 9c0f7faeeb306cb14e4279a3e084ca6b596894089a0638e68a07c945a32c9e14

      - name: Verify official wrapper JAR checksum
        run: echo "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check --strict

      - name: Commit generated wrapper
        run: |
          chmod +x gradlew
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          git diff --cached --check
          git commit -m "Add verified Gradle wrapper"
          git push origin "HEAD:${GITHUB_REF_NAME}"
