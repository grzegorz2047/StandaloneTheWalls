name: Bootstrap Gradle Wrapper

on:
  push:
    branches:
      - agent/issue-20-foundation
    paths:
      - .github/workflows/bootstrap-gradle-wrapper.yml

permissions:
  contents: write

jobs:
  generate-wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out foundation branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Generate and verify official wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 9.6.1 --distribution-type bin
          printf '\ndistributionSha256Sum=9c0f7faeeb306cb14e4279a3e084ca6b596894089a0638e68a07c945a32c9e14\n' >> gradle/wrapper/gradle-wrapper.properties
          echo "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check --strict
          ./gradlew --no-daemon check

      - name: Commit generated wrapper and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/bootstrap-gradle-wrapper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper .github/workflows/bootstrap-gradle-wrapper.yml
          git commit -m "Add verified Gradle 9.6.1 wrapper"
          git push
