name: Format Issue 122 Final Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/format-issue-122-final.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-122-lobby-team-ready-protocol

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Apply canonical formatting
        run: ./gradlew --no-daemon spotlessApply

      - name: Verify formatting scope
        shell: bash
        run: |
          set -euo pipefail
          expected=$(cat <<'EOF'
          client/src/test/java/pl/grzegorz2047/standalonethewalls/client/network/ConnectedLobbySessionTest.java
          server/src/test/java/pl/grzegorz2047/standalonethewalls/server/ServerLauncherTest.java
          EOF
          )
          actual=$(git diff --name-only -- '*.java' | sort)
          if [ "$actual" != "$(printf '%s\n' "$expected" | sort)" ]; then
            echo 'Unexpected formatted file set:' >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi

      - name: Run affected module tests
        run: ./gradlew --no-daemon :client:test :server:test

      - name: Commit tested formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/test/java/pl/grzegorz2047/standalonethewalls/client/network/ConnectedLobbySessionTest.java
          git add server/src/test/java/pl/grzegorz2047/standalonethewalls/server/ServerLauncherTest.java
          git commit -m '[P0][Format] Apply canonical formatting to issue 122 tests'
          git push origin HEAD:agent/issue-122-lobby-team-ready-protocol
