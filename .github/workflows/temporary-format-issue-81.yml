name: Temporary format issue 81

on:
  push:
    branches:
      - agent/issue-81-production-tls-listener

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-81-production-tls-listener

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply repository Java formatting
        run: ./gradlew --no-daemon spotlessApply

      - name: Commit formatted Java sources
        run: |
          if git diff --quiet -- server/src; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src
          git commit -m "Apply repository Java formatting"
          git push origin HEAD:agent/issue-81-production-tls-listener
