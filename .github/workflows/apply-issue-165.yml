name: Apply issue 165 provider gate

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: apply-issue-165
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/issue-165-bounded-dtls-listener'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/issue-165-bounded-dtls-listener
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/fonts/requirements.txt

      - name: Generate licensed UI font inputs
        run: |
          python -m pip install --disable-pip-version-check --requirement tools/fonts/requirements.txt
          python tools/fonts/prepare_sunderfront_ui_font.py
          cp build/generated-ui-font/SunderfrontUI-Regular.png.b64* client/src/main/resources/Interface/Fonts/

      - name: Set up Java 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-read-only: true

      - name: Restore implementation payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/issue-165-payload/part-* > "$RUNNER_TEMP/issue-165-changes.b64"
          test "$(wc -c < "$RUNNER_TEMP/issue-165-changes.b64")" = '47068'
          base64 --decode "$RUNNER_TEMP/issue-165-changes.b64" > "$RUNNER_TEMP/issue-165-changes.tar.xz"
          echo '1ee0a374e3267c4d1747d2c05fc24f789e6310360361d0f4f8ca8b89b5c378d8  '"$RUNNER_TEMP/issue-165-changes.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/issue-165-changes.tar.xz" -C .
          rm -f .github/workflows/export-issue-165-source.yml

      - name: Apply repository formatting
        run: ./gradlew --no-daemon spotlessApply

      - name: Run full quality gate
        run: ./gradlew --no-daemon check

      - name: Commit provider capability gate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/issue-165-payload
          rm -f .github/workflows/apply-issue-165.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fail closed without reviewed DTLS 1.3 provider'
          git push origin HEAD:agent/issue-165-bounded-dtls-listener
