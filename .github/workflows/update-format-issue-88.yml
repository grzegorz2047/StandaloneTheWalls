name: Update and format issue 88

on:
  push:
    branches:
      - agent/issue-88-direct-connect-service

permissions:
  contents: write

jobs:
  update-and-format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/issue-88-direct-connect-service
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: '21'

      - name: Merge current main
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main

      - name: Apply repository formatter
        run: ./gradlew --no-daemon spotlessApply

      - name: Commit and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/update-format-issue-88.yml
          git add client/src/main/java/pl/grzegorz2047/standalonethewalls/client/network
          git add client/src/test/java/pl/grzegorz2047/standalonethewalls/client/network
          git diff --cached --quiet || git commit -m 'style: update and format direct connect foundation'
          git push origin HEAD:agent/issue-88-direct-connect-service
