name: Temporary fix issue 81

on:
  push:
    branches:
      - agent/issue-81-production-tls-listener

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-81-production-tls-listener

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply focused review fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          launcher = Path("server/src/main/java/pl/grzegorz2047/standalonethewalls/server/ServerLauncher.java")
          source = launcher.read_text()
          old = '''                                Objects.requireNonNull(
                                          identityRuntime,
                                          "reliable TLS requires local identity runtime"),
                                  Clock.systemUTC());'''
          new = '''                                Objects.requireNonNull(
                                          identityRuntime,
                                          "reliable TLS requires local identity runtime"),
                                  Clock.systemUTC(),
                                  runtime::close);'''
          if source.count(old) != 1:
              raise SystemExit("expected one launcher composition site")
          launcher.write_text(source.replace(old, new))

          test = Path("server/src/test/java/pl/grzegorz2047/standalonethewalls/server/config/transport/ReliableTlsProcessConfigurationLoaderTest.java")
          source = test.read_text()
          old = '''        Files.write(
                  temporaryDirectory.resolve("server-key.pk8"),
                  new byte[ReliableTlsProcessConfigurationLoader.MAXIMUM_PRIVATE_KEY_BYTES + 1]);
          assertThatThrownBy(() -> ReliableTlsProcessConfigurationLoader.load(configuration, server))'''
          new = '''        configuration =
                  writeConfiguration(
                          "transport.schema=1\\n"
                                  + "transport.reliable.private-key-pkcs8-path=server-key.pk8\\n"
                                  + "transport.reliable.certificate-x509-path=server-certificate.der\\n");
          Files.write(
                  temporaryDirectory.resolve("server-key.pk8"),
                  new byte[ReliableTlsProcessConfigurationLoader.MAXIMUM_PRIVATE_KEY_BYTES + 1]);
          assertThatThrownBy(() -> ReliableTlsProcessConfigurationLoader.load(configuration, server))'''
          if source.count(old) != 1:
              raise SystemExit("expected one oversized credential assertion")
          test.write_text(source.replace(old, new))
          PY

      - name: Apply repository Java formatting
        run: ./gradlew --no-daemon spotlessApply

      - name: Commit review fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src
          git commit -m "Apply final TLS composition review fixes"
          git push origin HEAD:agent/issue-81-production-tls-listener
