name: Temporary fix issue 81

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/issue-81-production-tls-listener'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply focused fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          launcher = Path("server/src/main/java/pl/grzegorz2047/standalonethewalls/server/ServerLauncher.java")
          text = launcher.read_text()
          start = text.index("ReliableTlsAdmissionRuntime.open(")
          if "runtime::close);" not in text[start:start + 700]:
              position = text.index("Clock.systemUTC());", start)
              text = text[:position] + "Clock.systemUTC(),\n                                runtime::close);" + text[position + len("Clock.systemUTC());"):]
              launcher.write_text(text)

          loader = Path("server/src/main/java/pl/grzegorz2047/standalonethewalls/server/config/transport/ReliableTlsProcessConfigurationLoader.java")
          text = loader.read_text()
          if "CRYPTO_PROVIDER" not in text:
              text = text.replace("import java.security.PrivateKey;\n", "import java.security.PrivateKey;\nimport java.security.Provider;\n", 1)
              text = text.replace("import pl.grzegorz2047.standalonethewalls.server.config.ServerConfiguration;\n", "import pl.grzegorz2047.standalonethewalls.server.config.ServerConfiguration;\nimport pl.grzegorz2047.standalonethewalls.transport.bctls.BouncyCastleTlsCryptoFactory;\n", 1)
              text = text.replace("    private static final byte[] CREDENTIAL_MATCH_PROBE =", "    private static final Provider CRYPTO_PROVIDER =\n            BouncyCastleTlsCryptoFactory.provider();\n\n    private static final byte[] CREDENTIAL_MATCH_PROBE =", 1)
              text = text.replace('KeyFactory.getInstance("Ed25519")', 'KeyFactory.getInstance("Ed25519", CRYPTO_PROVIDER)')
              text = text.replace('CertificateFactory.getInstance("X.509")', 'CertificateFactory.getInstance("X.509", CRYPTO_PROVIDER)')
              text = text.replace('Signature.getInstance("Ed25519")', 'Signature.getInstance("Ed25519", CRYPTO_PROVIDER)')
              loader.write_text(text)

          fixture = Path("server/src/test/java/pl/grzegorz2047/standalonethewalls/server/testsupport/ServerTlsTestCertificateMaterial.java")
          text = fixture.read_text()
          if "BouncyCastleTlsCryptoFactory" not in text:
              text = text.replace("import java.security.KeyPairGenerator;\n", "import java.security.KeyPairGenerator;\nimport java.security.Provider;\n", 1)
              text = text.replace("import org.bouncycastle.operator.jcajce.JcaContentSignerBuilder;\n", "import org.bouncycastle.operator.jcajce.JcaContentSignerBuilder;\nimport pl.grzegorz2047.standalonethewalls.transport.bctls.BouncyCastleTlsCryptoFactory;\n", 1)
              text = text.replace('        KeyPairGenerator generator = KeyPairGenerator.getInstance("Ed25519");\n', '        Provider provider = BouncyCastleTlsCryptoFactory.provider();\n        KeyPairGenerator generator = KeyPairGenerator.getInstance("Ed25519", provider);\n', 1)
              text = text.replace('        ContentSigner signer = new JcaContentSignerBuilder("Ed25519").build(keyPair.getPrivate());\n', '        ContentSigner signer =\n                new JcaContentSignerBuilder("Ed25519")\n                        .setProvider(provider)\n                        .build(keyPair.getPrivate());\n', 1)
              text = text.replace('                new JcaX509CertificateConverter().getCertificate(holder);\n        certificate.verify(keyPair.getPublic());\n', '                new JcaX509CertificateConverter()\n                        .setProvider(provider)\n                        .getCertificate(holder);\n        certificate.verify(keyPair.getPublic(), provider);\n', 1)
              fixture.write_text(text)

          test = Path("server/src/test/java/pl/grzegorz2047/standalonethewalls/server/config/transport/ReliableTlsProcessConfigurationLoaderTest.java")
          text = test.read_text()
          if "Path oversized =" not in text:
              marker = "        Files.write(\n                temporaryDirectory.resolve(\"server-key.pk8\"),\n                new byte[ReliableTlsProcessConfigurationLoader.MAXIMUM_PRIVATE_KEY_BYTES + 1]);"
              replacement = "        Path oversized =\n                writeConfiguration(\n                        \"transport.schema=1\\n\"\n                                + \"transport.reliable.private-key-pkcs8-path=server-key.pk8\\n\"\n                                + \"transport.reliable.certificate-x509-path=server-certificate.der\\n\");\n" + marker
              text = text.replace(marker, replacement, 1)
              position = text.index("ReliableTlsProcessConfigurationLoader.load(configuration, server)", text.index("Path oversized ="))
              text = text[:position] + "ReliableTlsProcessConfigurationLoader.load(oversized, server)" + text[position + len("ReliableTlsProcessConfigurationLoader.load(configuration, server)"):]
              test.write_text(text)
          PY
          ./gradlew --no-daemon spotlessApply

      - name: Commit fixes
        run: |
          if git diff --quiet -- server/src transport-bctls/src; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src transport-bctls/src
          git commit -m "Apply TLS credential and lifecycle review fixes"
          git push origin HEAD:${{ github.head_ref }}
