name: Promote Direct Connect Alpha Tag

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: promote-v0.1.0-alpha.1
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      promote: ${{ steps.tag.outputs.promote }}
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Detect immutable alpha tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\r\n' < release/version.txt)
          TAG="v${VERSION}"
          test "$TAG" = "v0.1.0-alpha.1"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; this workflow will not move or replace it."
            echo "promote=false" >> "$GITHUB_OUTPUT"
          else
            echo "promote=true" >> "$GITHUB_OUTPUT"
          fi

  verify-linux:
    needs: detect
    if: needs.detect.outputs.promote == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}

      - name: Set up Java 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-read-only: true

      - name: Run complete quality gate
        run: ./gradlew --no-daemon check

      - name: Verify release distributions
        run: bash release/verify_release.sh

  verify-windows:
    needs: detect
    if: needs.detect.outputs.promote == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}

      - name: Set up Java 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-read-only: true

      - name: Run complete quality gate
        run: .\gradlew.bat --no-daemon check

  promote:
    needs:
      - detect
      - verify-linux
      - verify-windows
    if: >-
      needs.detect.outputs.promote == 'true' &&
      needs.verify-linux.result == 'success' &&
      needs.verify-windows.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
    steps:
      - name: Check out verified main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Promote exact verified commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\r\n' < release/version.txt)
          TAG="v${VERSION}"
          test "$TAG" = "v0.1.0-alpha.1"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$VERIFIED_SHA"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} appeared during verification; refusing to move or replace it." >&2
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$TAG" "$VERIFIED_SHA" -m "Sunderfront Direct Connect Alpha"
          git push origin "refs/tags/${TAG}"
          gh workflow run release-alpha.yml --ref main
