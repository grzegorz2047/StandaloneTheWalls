name: Agent Spotless 236

on:
  push:
    branches:
      - agent/issue-236-manual-graphics-benchmark
    paths:
      - '.github/workflows/agent-spotless-236.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/agent-spotless-236.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-236-manual-graphics-benchmark
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply canonical formatting
        run: ./gradlew --no-daemon spotlessApply
      - name: Remove helper and commit formatter output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-spotless-236.yml
          git add -A
          git commit -m "Apply Spotless formatting"
          git push origin HEAD:agent/issue-236-manual-graphics-benchmark
