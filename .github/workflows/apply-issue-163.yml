name: Apply issue 163 implementation

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/issue-163-realtime-ticket-provisioning
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Restore implementation payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/issue-163-payload/part-* > "$RUNNER_TEMP/issue-163-changes.b64"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("${{ runner.temp }}/issue-163-changes.b64")
          encoded = path.read_text()
          offset = 22174
          if len(encoded) != 63900 or encoded[offset] != "l":
              raise SystemExit("unexpected issue-163 payload shape")
          path.write_text(encoded[:offset] + "p" + encoded[offset + 1 :])
          PY
          base64 --decode "$RUNNER_TEMP/issue-163-changes.b64" > "$RUNNER_TEMP/issue-163-changes.tar.xz"
          echo "49a13d8bd3ed190f72e944b5b3af948942731629921f80cd93953f864b6f4600  $RUNNER_TEMP/issue-163-changes.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/issue-163-changes.tar.xz" -C .
          rm -f .github/workflows/export-issue-163-source.yml

      - name: Apply repository formatting
        run: ./gradlew --no-daemon spotlessApply

      - name: Verify focused implementation
        run: ./gradlew --no-daemon :protocol:test :transport-bctls:test :server:test

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/issue-163-payload
          rm -f .github/workflows/apply-issue-163.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Provision one-time realtime tickets over reliable TLS"
          git push origin HEAD:agent/issue-163-realtime-ticket-provisioning
