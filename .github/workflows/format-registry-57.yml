name: One-time registry formatter

on:
  push:
    branches:
      - agent/issue-57-offline-registry-snapshot

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-57-offline-registry-snapshot
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply Spotless
        run: ./gradlew --no-daemon spotlessApply

      - name: Verify formatter scope
        shell: bash
        run: |
          unexpected="$(git status --porcelain | cut -c4- | grep -Ev '^(identity-registry/|\.github/workflows/format-registry-57\.yml)' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected formatter changes:\n%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Remove one-time workflow
        run: rm .github/workflows/format-registry-57.yml

      - name: Commit formatted files
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add identity-registry .github/workflows/format-registry-57.yml
          git commit -m 'Apply Spotless to registry module'
          git push origin HEAD:agent/issue-57-offline-registry-snapshot
