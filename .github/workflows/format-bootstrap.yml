name: One-time Spotless Apply

on:
  push:
    branches:
      - agent/issue-24-quality-gates

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out formatting branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-24-quality-gates
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply repository formatting
        run: ./gradlew --no-daemon spotlessApply

      - name: Verify formatting scope
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              *.java|*.gradle.kts|*.md|*.json|*.yml|*.yaml|.editorconfig|.gitattributes|.gitignore)
                ;;
              *)
                echo "Unexpected file modified by formatting: $file" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only)

      - name: Commit formatted sources and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/format-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Spotless produced no changes; bootstrap removal is the only expected commit." >&2
            exit 1
          fi
          git commit -m "Apply repository formatting"
          git push origin HEAD:agent/issue-24-quality-gates
