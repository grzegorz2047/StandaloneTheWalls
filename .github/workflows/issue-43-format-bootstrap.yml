name: One-time Issue 43 Spotless Apply

on:
  push:
    branches:
      - agent/issue-43-server-identity-binding

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out security branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-43-server-identity-binding
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply repository formatting
        run: ./gradlew --no-daemon spotlessApply

      - name: Verify formatting scope
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(protocol/src/(main|test)/java/pl/grzegorz2047/standalonethewalls/protocol/identity/[^/]+\.java|docs/adr/0004-server-identity-pinning-and-channel-binding\.md)$'
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if ! [[ "$file" =~ $allowed ]]; then
              echo "Unexpected file modified by formatting: $file" >&2
              exit 1
            fi
          done < <(git diff --name-only)

      - name: Commit formatted sources and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue-43-format-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply issue 43 formatting"
          git push origin HEAD:agent/issue-43-server-identity-binding
