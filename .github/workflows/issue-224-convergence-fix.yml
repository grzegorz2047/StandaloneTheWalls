name: Issue 224 Convergence Rewrite

on:
  push:
    branches:
      - agent/issue-224-two-session-snapshot-wait

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Harden movement snapshot convergence wait
        shell: python
        run: |
          from pathlib import Path

          path = Path("server/src/test/java/pl/grzegorz2047/standalonethewalls/server/identity/session/MinimalLobbyRuntimeTest.java")
          source = path.read_text(encoding="utf-8")
          old = """                    waitUntil(\n                            () ->\n                                    latestPreparationWorldSnapshotUnchecked(alpha)\n                                                    .authoritativeTick()\n                                            >= expectedTick);\n"""
          new = """                    waitUntil(\n                            () -> {\n                                PreparationWorldSnapshot alphaSnapshot =\n                                        latestPreparationWorldSnapshotUnchecked(alpha);\n                                return alphaSnapshot.authoritativeTick() >= expectedTick\n                                        && alphaSnapshot.equals(\n                                                latestPreparationWorldSnapshotUnchecked(bravo));\n                            });\n"""
          if old not in source:
              raise SystemExit("expected movement snapshot wait not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")

      - name: Commit rewrite
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/test/java/pl/grzegorz2047/standalonethewalls/server/identity/session/MinimalLobbyRuntimeTest.java
          git commit -m "Harden two-session movement convergence wait"
          git push
