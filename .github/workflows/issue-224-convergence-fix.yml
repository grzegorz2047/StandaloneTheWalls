name: Issue 224 Cleanup

on:
  push:
    branches:
      - agent/issue-224-two-session-snapshot-wait

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Remove temporary helper files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-224-convergence-fix.yml
          git rm .github/issue-224-convergence-fix.trigger
          git commit -m "Remove temporary convergence helper"
          git push
