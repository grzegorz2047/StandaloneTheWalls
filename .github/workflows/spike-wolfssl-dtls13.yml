name: Spike wolfSSL DTLS 1.3

on:
  push:
    branches:
      - agent/issue-167-wolfjsse-dtls13-spike
    paths:
      - .github/workflows/spike-wolfssl-dtls13.yml
      - .github/spikes/wolfssl/PskDtls13Loopback.java
      - .github/spikes/wolfssl/PskDtls13NegativeMatrix.java
  pull_request:
    paths:
      - .github/workflows/spike-wolfssl-dtls13.yml
      - .github/spikes/wolfssl/PskDtls13Loopback.java
      - .github/spikes/wolfssl/PskDtls13NegativeMatrix.java

permissions:
  contents: read

concurrency:
  group: spike-wolfssl-dtls13-${{ github.ref }}
  cancel-in-progress: true

env:
  WOLFSSL_COMMIT: 1d363f3adceba9d1478230ede476a37b0dcdef24
  WOLFSSLJNI_COMMIT: 2eebdb8db88c1d8f5531e92060a3a2741dd694de

jobs:
  linux-api-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out spike
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install native build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake libtool make ant

      - name: Fetch exact upstream commits
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/wolfSSL/wolfssl.git "$RUNNER_TEMP/wolfssl"
          git -C "$RUNNER_TEMP/wolfssl" checkout --detach "$WOLFSSL_COMMIT"
          test "$(git -C "$RUNNER_TEMP/wolfssl" rev-parse HEAD)" = "$WOLFSSL_COMMIT"

          git clone --filter=blob:none https://github.com/wolfSSL/wolfssljni.git "$RUNNER_TEMP/wolfssljni"
          git -C "$RUNNER_TEMP/wolfssljni" checkout --detach "$WOLFSSLJNI_COMMIT"
          test "$(git -C "$RUNNER_TEMP/wolfssljni" rev-parse HEAD)" = "$WOLFSSLJNI_COMMIT"

      - name: Build native wolfSSL with DTLS 1.3 and PSK
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/wolfssl"
          ./autogen.sh
          ./configure \
            --prefix="$RUNNER_TEMP/wolfssl-install" \
            --enable-jni \
            --enable-dtls \
            --enable-dtls13 \
            --enable-psk
          make -j2
          make check
          make install

      - name: Build wolfSSL JNI and JSSE
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/wolfssl-install/lib
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/wolfssljni"
          make WOLFSSL_INSTALL_DIR="$RUNNER_TEMP/wolfssl-install" build

      - name: Verify Java and native DTLS 1.3 API surface
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/wolfssl-install/lib:${{ runner.temp }}/wolfssljni/lib
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/wolfssl-dtls13-api-report.txt"
          jar_path="$(find "$RUNNER_TEMP/wolfssljni" -type f -name 'wolfssl*.jar' | head -n 1)"
          test -n "$jar_path"
          native_path="$(find "$RUNNER_TEMP/wolfssljni" -type f -name 'libwolfssljni.so' | head -n 1)"
          test -n "$native_path"

          {
            echo "wolfssl_commit=$WOLFSSL_COMMIT"
            echo "wolfssljni_commit=$WOLFSSLJNI_COMMIT"
            echo "java_version=$(java -version 2>&1 | head -n 1)"
            echo "jar=$(basename "$jar_path")"
            echo "native=$(basename "$native_path")"
            echo
            echo "== WolfSSL DTLS 1.3 methods =="
            javap -classpath "$jar_path" com.wolfssl.WolfSSL | grep -E 'DTLSv1_3_(Method|ServerMethod|ClientMethod)'
            echo
            echo "== WolfSSLContext PSK and cookie callbacks =="
            javap -classpath "$jar_path" com.wolfssl.WolfSSLContext | grep -E 'setPsk(Server|Client)Cb|setGenCookie'
            echo
            echo "== WolfSSLSession transport, handshake and PSK methods =="
            javap -classpath "$jar_path" com.wolfssl.WolfSSLSession | grep -E 'WolfSSLSession\(|setFd\(|dtlsSetPeer|setPsk(Server|Client)Cb|accept\(|connect\(|read\(|write\(|freeSSL|shutdownSSL'
            echo
            echo "== Native dependencies =="
            ldd "$native_path"
            echo
            echo "== Artifact checksums =="
            sha256sum "$jar_path" "$native_path"
          } | tee "$report"

          grep -q 'DTLSv1_3_ServerMethod' "$report"
          grep -q 'DTLSv1_3_ClientMethod' "$report"
          grep -q 'setPskServerCb' "$report"
          grep -q 'setPskClientCb' "$report"
          grep -q 'dtlsSetPeer' "$report"

      - name: Compile one-time ticket store
        run: ./gradlew --no-daemon :transport-bctls:classes

      - name: Run external-PSK DTLS 1.3 positive and negative proofs
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/wolfssl-install/lib:${{ runner.temp }}/wolfssljni/lib
        run: |
          set -euo pipefail
          jar_path="$(find "$RUNNER_TEMP/wolfssljni" -type f -name 'wolfssl*.jar' | head -n 1)"
          project_classpath="$GITHUB_WORKSPACE/protocol/build/classes/java/main:$GITHUB_WORKSPACE/transport-bctls/build/classes/java/main"
          runtime_classpath="$RUNNER_TEMP/spike-classes:$jar_path:$project_classpath"
          mkdir -p "$RUNNER_TEMP/spike-classes"

          javac \
            -Xlint:all \
            -Werror \
            -classpath "$jar_path:$project_classpath" \
            -d "$RUNNER_TEMP/spike-classes" \
            .github/spikes/wolfssl/PskDtls13Loopback.java \
            .github/spikes/wolfssl/PskDtls13NegativeMatrix.java

          java \
            -Djava.library.path="$RUNNER_TEMP/wolfssljni/lib:$RUNNER_TEMP/wolfssl-install/lib" \
            -classpath "$runtime_classpath" \
            PskDtls13Loopback | tee wolfssl-dtls13-loopback-report.txt

          java \
            -Djava.library.path="$RUNNER_TEMP/wolfssljni/lib:$RUNNER_TEMP/wolfssl-install/lib" \
            -classpath "$runtime_classpath" \
            PskDtls13NegativeMatrix | tee wolfssl-dtls13-negative-matrix-report.txt

          grep -q 'loopback passed; replay rejected; secrets redacted' \
            wolfssl-dtls13-loopback-report.txt
          grep -q 'negative matrix passed; unknown expired bad-psk parallel-replay downgrade cleanup; secrets redacted' \
            wolfssl-dtls13-negative-matrix-report.txt

          missing_dir="$RUNNER_TEMP/wolfssl-missing-native"
          corrupt_dir="$RUNNER_TEMP/wolfssl-corrupt-native"
          mkdir -p "$missing_dir" "$corrupt_dir"

          set +e
          env -u LD_LIBRARY_PATH java \
            -Djava.library.path="$missing_dir" \
            -classpath "$runtime_classpath" \
            PskDtls13Loopback > "$RUNNER_TEMP/missing-native.log" 2>&1
          missing_exit=$?
          printf 'not-a-native-library' > "$corrupt_dir/libwolfssljni.so"
          env -u LD_LIBRARY_PATH java \
            -Djava.library.path="$corrupt_dir" \
            -classpath "$runtime_classpath" \
            PskDtls13Loopback > "$RUNNER_TEMP/corrupt-native.log" 2>&1
          corrupt_exit=$?
          set -e

          test "$missing_exit" -ne 0
          test "$corrupt_exit" -ne 0
          {
            echo 'missing_native_fails_closed=true'
            echo 'corrupt_native_fails_closed=true'
            echo 'native_failure_logs_uploaded=false'
          } | tee wolfssl-dtls13-native-failure-report.txt

      - name: Upload API and loopback proof
        uses: actions/upload-artifact@v4
        with:
          name: wolfssl-dtls13-api-proof-linux
          path: |
            wolfssl-dtls13-api-report.txt
            wolfssl-dtls13-loopback-report.txt
            wolfssl-dtls13-negative-matrix-report.txt
            wolfssl-dtls13-native-failure-report.txt
          retention-days: 30
