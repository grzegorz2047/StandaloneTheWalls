name: Format Direct Connect UI

on:
  push:
    branches:
      - agent/issue-90-direct-connect-ui

permissions:
  contents: write

concurrency:
  group: format-direct-connect-ui
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-90-direct-connect-ui
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make headless navigation deterministic
        shell: python
        run: |
          from pathlib import Path

          path = Path('client/src/main/java/pl/grzegorz2047/standalonethewalls/client/SunderfrontClient.java')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import java.util.concurrent.Future;\n', '')
          old = '''    void exerciseDirectConnectNavigation(Duration timeout)
                  throws InterruptedException, TimeoutException {
              Objects.requireNonNull(timeout, "timeout");
              if (!smokeMode) {
                  throw new IllegalStateException("navigation smoke exercise requires smoke mode");
              }
              Future<Void> exercise =
                      enqueue(
                              () -> {
                                  openDirectConnectScreen();
                                  if (screen != Screen.DIRECT_CONNECT || directConnectController == null) {
                                      throw new IllegalStateException(
                                              "Direct Connect screen did not open in smoke mode");
                                  }
                                  directConnectController.escape();
                                  if (screen != Screen.START_MENU || directConnectController != null) {
                                      throw new IllegalStateException(
                                              "Direct Connect screen did not return to the start menu");
                                  }
                                  return null;
                              });
              try {
                  exercise.get(timeout.toMillis(), TimeUnit.MILLISECONDS);
              } catch (ExecutionException exception) {
                  throw new IllegalStateException(
                          "Direct Connect navigation smoke exercise failed", exception.getCause());
              }
          }
          '''
          new = '''    void exerciseDirectConnectNavigation(Duration timeout) {
              Objects.requireNonNull(timeout, "timeout");
              if (timeout.isZero() || timeout.isNegative()) {
                  throw new IllegalArgumentException("timeout must be positive");
              }
              if (!smokeMode) {
                  throw new IllegalStateException("navigation smoke exercise requires smoke mode");
              }
              openDirectConnectScreen();
              if (screen != Screen.DIRECT_CONNECT || directConnectController == null) {
                  throw new IllegalStateException("Direct Connect screen did not open in smoke mode");
              }
              directConnectController.escape();
              if (screen != Screen.START_MENU || directConnectController != null) {
                  throw new IllegalStateException(
                          "Direct Connect screen did not return to the start menu");
              }
          }
          '''
          if old not in text:
              raise SystemExit('expected headless smoke block was not found')
          path.write_text(text.replace(old, new), encoding='utf-8')

      - name: Apply repository formatter
        run: ./gradlew --no-daemon spotlessApply

      - name: Remove one-shot workflow
        run: rm .github/workflows/format-direct-connect-ui.yml

      - name: Commit formatted sources
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(client): format Direct Connect UI"
          git push origin HEAD:agent/issue-90-direct-connect-ui
