name: Issue 196 formatting proof

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/issue-196-authoritative-headroom'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out issue branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Java 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-read-only: true

      - name: Apply exact remaining migrations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          decoder = Path('map-format/src/main/java/pl/grzegorz2047/standalonethewalls/mapformat/Glb2PreparationObstacleDecoder.java')
          source = decoder.read_text()
          if 'private static final String OBSTACLE_SUFFIX = "ObstacleCollision";' not in source:
              marker = '    private static final String WALL_Z_SUFFIX = "WallZCollision";'
              replacement = marker + '\n    private static final String OBSTACLE_SUFFIX = "ObstacleCollision";'
              if source.count(marker) != 1:
                  raise SystemExit('unexpected obstacle suffix constant')
              source = source.replace(marker, replacement)
          if 'name.endsWith(OBSTACLE_SUFFIX)' not in source:
              marker = '                        || name.endsWith(WALL_Z_SUFFIX));'
              replacement = (
                  '                        || name.endsWith(WALL_Z_SUFFIX)\n'
                  '                        || name.endsWith(OBSTACLE_SUFFIX));'
              )
              if source.count(marker) != 1:
                  raise SystemExit('unexpected obstacle name predicate')
              source = source.replace(marker, replacement)
          decoder.write_text(source)

          server_test = Path('server/src/test/java/pl/grzegorz2047/standalonethewalls/server/preparation/PreparationObstacleMovementSimulationTest.java')
          source = server_test.read_text()
          if '.withMessageContaining("standing clearance");' in source:
              source = source.replace(
                  '.withMessageContaining("standing clearance");',
                  '.withMessageContaining("obstacle");',
                  1,
              )
              server_test.write_text(source)
          PY

      - name: Apply repository formatting
        run: ./gradlew --no-daemon spotlessApply

      - name: Commit exact formatted source changes
        shell: bash
        run: |
          set -euo pipefail
          git add \
            map-format/src/main/java/pl/grzegorz2047/standalonethewalls/mapformat/Glb2PreparationObstacleDecoder.java \
            map-format/src/test/java/pl/grzegorz2047/standalonethewalls/mapformat/Glb2PreparationObstacleDecoderTest.java \
            client/src/test/java/pl/grzegorz2047/standalonethewalls/client/preparation/PreparationSupportMovementControllerTest.java \
            client/src/test/java/pl/grzegorz2047/standalonethewalls/client/preparation/PreparationObstacleSlidingControllerTest.java \
            client/src/test/java/pl/grzegorz2047/standalonethewalls/client/preparation/PreparationCameraPlacementTest.java \
            server/src/test/java/pl/grzegorz2047/standalonethewalls/server/preparation/PreparationObstacleMovementSimulationTest.java
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Complete issue 196 focused migrations'
          git push origin HEAD:${{ github.head_ref }}

      - name: Run focused issue tests
        run: ./gradlew --no-daemon :map-format:test :client:test :server:test
