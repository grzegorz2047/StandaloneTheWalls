name: Apply Spotless for issue 161

on:
  push:
    branches:
      - "agent/issue-161-realtime-psk-tickets"

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[spotless-auto]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Apply repository formatter
        run: ./gradlew --no-daemon spotlessApply

      - name: Commit exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Spotless produced no changes."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transport-bctls
          git commit -m "[spotless-auto] Format issue 161 sources"
          git push origin "HEAD:${GITHUB_REF_NAME}"
