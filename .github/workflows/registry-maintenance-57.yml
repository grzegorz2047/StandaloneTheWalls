name: One-time registry maintenance

on:
  push:
    branches:
      - agent/issue-57-offline-registry-snapshot

permissions:
  contents: write

jobs:
  maintain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-57-offline-registry-snapshot
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply Spotless
        run: ./gradlew --no-daemon spotlessApply

      - name: Refresh strict locks and SHA verification
        run: ./gradlew --no-daemon --write-locks --write-verification-metadata sha256 resolveAndLockAll

      - name: Verify maintenance scope
        shell: bash
        run: |
          allowed='^(ARCHITECTURE\.md|IDENTITY\.md|README\.md|build\.gradle\.kts|settings\.gradle\.kts|gradle/libs\.versions\.toml|gradle/verification-metadata\.xml|identity-registry/|docs/adr/0011-offline-signed-registry-snapshot\.md|docs/registry/snapshot-v1-vector\.json|\.github/workflows/registry-maintenance-57\.yml)'
          unexpected="$(git status --porcelain | cut -c4- | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected maintenance changes:\n%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Remove one-time workflow
        run: rm .github/workflows/registry-maintenance-57.yml

      - name: Commit maintained files
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ARCHITECTURE.md IDENTITY.md README.md build.gradle.kts settings.gradle.kts gradle/libs.versions.toml gradle/verification-metadata.xml identity-registry docs/adr/0011-offline-signed-registry-snapshot.md docs/registry/snapshot-v1-vector.json .github/workflows/registry-maintenance-57.yml
          git commit -m 'Maintain registry module dependencies and formatting'
          git push origin HEAD:agent/issue-57-offline-registry-snapshot
