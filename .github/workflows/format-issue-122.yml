name: Format Issue 122

on:
  push:
    branches:
      - agent/issue-122-lobby-team-ready-protocol
    paths:
      - '.github/workflows/format-issue-122.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/format-issue-122.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/issue-122-lobby-team-ready-protocol

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Apply canonical formatting
        run: ./gradlew --no-daemon spotlessApply

      - name: Commit canonical formatting
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only -- '*.java')
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No formatted Java files found.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${files[@]}"
          git commit -m '[P0][Format] Apply canonical formatting for issue 122'
          git push origin HEAD:agent/issue-122-lobby-team-ready-protocol

      - name: Collect formatted files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git show --pretty='' --name-only HEAD -- '*.java')
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No formatted Java files in the current commit.' >&2
            exit 1
          fi
          tar -czf issue-122-formatted-sources.tar.gz "${files[@]}"
          printf '%s\n' "${files[@]}"

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: issue-122-formatted-sources
          path: issue-122-formatted-sources.tar.gz
          if-no-files-found: error
          retention-days: 1
