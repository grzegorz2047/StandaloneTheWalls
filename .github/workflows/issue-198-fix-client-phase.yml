name: Fix issue 198 client phases

on:
  push:
    branches:
      - agent/issue-198-open-central-walls

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-198-open-central-walls
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Patch client phase handling
        shell: python
        run: |
          from pathlib import Path

          controller = Path("client/src/main/java/pl/grzegorz2047/standalonethewalls/client/ui/directconnect/DirectConnectUiController.java")
          text = controller.read_text(encoding="utf-8")
          old = '''                    case PREPARATION -> messages.text("direct.lobby.phase.preparation");
                };'''
          new = '''                    case PREPARATION -> messages.text("direct.lobby.phase.preparation");
                    case WALLS_OPENING ->
                            messages.text(
                                    "direct.lobby.phase.walls_opening", snapshot.ticksRemaining());
                    case OPEN_COMBAT -> messages.text("direct.lobby.phase.open_combat");
                };'''
          if old not in text:
              raise SystemExit("client phase switch anchor not found")
          controller.write_text(text.replace(old, new, 1), encoding="utf-8")

          additions = {
              Path("client/src/main/resources/i18n/messages_en.properties"): (
                  "direct.lobby.phase.preparation=Preparation has started. Team and readiness controls are locked.\n",
                  "direct.lobby.phase.preparation=Preparation has started. Team and readiness controls are locked.\n"
                  "direct.lobby.phase.walls_opening=Central walls open in {0} tick(s).\n"
                  "direct.lobby.phase.open_combat=Central walls are open. Open combat has started.\n",
              ),
              Path("client/src/main/resources/i18n/messages_pl.properties"): (
                  "direct.lobby.phase.preparation=Rozpoczęła się faza przygotowania. Zmiana drużyny i gotowości jest zablokowana.\n",
                  "direct.lobby.phase.preparation=Rozpoczęła się faza przygotowania. Zmiana drużyny i gotowości jest zablokowana.\n"
                  "direct.lobby.phase.walls_opening=Centralne ściany otworzą się za {0} ticków.\n"
                  "direct.lobby.phase.open_combat=Centralne ściany są otwarte. Rozpoczęła się otwarta walka.\n",
              ),
          }
          for path, (anchor, replacement) in additions.items():
              content = path.read_text(encoding="utf-8")
              if anchor not in content:
                  raise SystemExit(f"translation anchor not found: {path}")
              path.write_text(content.replace(anchor, replacement, 1), encoding="utf-8")

      - name: Format and compile focused modules
        run: |
          ./gradlew --no-daemon spotlessApply
          ./gradlew --no-daemon :client:compileJava :protocol:test :server:test

      - name: Commit phase handling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/main/java/pl/grzegorz2047/standalonethewalls/client/ui/directconnect/DirectConnectUiController.java
          git add client/src/main/resources/i18n/messages_en.properties
          git add client/src/main/resources/i18n/messages_pl.properties
          git diff --cached --quiet && exit 0
          git commit -m "Handle opening and combat match phases in the client"
          git push origin HEAD:agent/issue-198-open-central-walls
