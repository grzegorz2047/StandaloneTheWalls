name: PR147 Run Tool

on:
  push:
    branches:
      - agent/issue-129-session-verified-preparation-scene

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-129-session-verified-preparation-scene
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Apply and format implementation
        run: |
          python tools/pr147_apply.py
          ./gradlew --no-daemon spotlessApply

      - name: Restore CI, remove tools, and commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/pr147-run-tool.yml tools/pr147_apply.py
          git config user.name "OpenAI Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "Verify preparation scene in connected session"
          git push origin HEAD:agent/issue-129-session-verified-preparation-scene
