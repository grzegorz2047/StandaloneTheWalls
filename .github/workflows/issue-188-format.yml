name: Format issue 188 jump changes

on:
  push:
    branches:
      - agent/issue-188-authoritative-jump

permissions:
  contents: write

jobs:
  format-jump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out jump branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/issue-188-authoritative-jump
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Apply repository formatting
        run: ./gradlew --no-daemon spotlessApply

      - name: Commit formatting and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/issue-188-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Format authoritative preparation jump"
          git push origin HEAD:agent/issue-188-authoritative-jump
