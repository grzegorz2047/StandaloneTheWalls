name: One-time Issue 51 Reformat

on:
  push:
    branches:
      - agent/issue-51-bounded-tls-listener
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-51-bounded-tls-listener
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon spotlessJavaApply
      - shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue-51-reformat.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transport-bctls/src/main/java/pl/grzegorz2047/standalonethewalls/transport/bctls/Tls13ServerListener.java .github/workflows/issue-51-reformat.yml
          unexpected="$(git diff --cached --name-only | grep -Ev '^(transport-bctls/src/main/java/pl/grzegorz2047/standalonethewalls/transport/bctls/Tls13ServerListener\.java|\.github/workflows/issue-51-reformat\.yml)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected staged paths:"
            echo "$unexpected"
            exit 1
          fi
          git commit -m "Format TLS listener close handling"
          git push origin HEAD:agent/issue-51-bounded-tls-listener
