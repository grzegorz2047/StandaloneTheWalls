name: Apply release build core

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/issue-91-direct-connect-alpha-release
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: "21"

      - name: Patch release build conventions
        shell: python
        run: |
          from pathlib import Path
          import re

          build = Path('build.gradle.kts')
          text = build.read_text(encoding='utf-8')
          if 'import org.gradle.api.tasks.bundling.AbstractArchiveTask\n' not in text:
              text = text.replace(
                  'import org.gradle.api.tasks.compile.JavaCompile\n',
                  'import org.gradle.api.tasks.compile.JavaCompile\n'
                  'import org.gradle.api.tasks.bundling.AbstractArchiveTask\n',
              )
          text = text.replace(
              'version = "0.1.0-SNAPSHOT"',
              'version = file("release/version.txt").readText().trim()',
          )
          marker = '''allprojects {
              repositories {
                  mavenCentral()
              }
          '''
          replacement = '''allprojects {
              repositories {
                  mavenCentral()
              }

              tasks.withType<AbstractArchiveTask>().configureEach {
                  isPreserveFileTimestamps = false
                  isReproducibleFileOrder = true
              }
          '''
          if marker not in text:
              raise SystemExit('allprojects marker not found')
          build.write_text(text.replace(marker, replacement, 1), encoding='utf-8')

          client = Path('client/src/main/java/pl/grzegorz2047/standalonethewalls/client/SunderfrontClient.java')
          text = client.read_text(encoding='utf-8')
          pattern = re.compile(
              r'    private static Path defaultDataDirectory\(\) \{.*?\n    \}\n\n'
              r'(?=    private enum Screen)',
              re.DOTALL,
          )
          replacement = '''    private static Path defaultDataDirectory() {
              return Path.of("data").toAbsolutePath().normalize();
          }

          '''
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one default data directory method, found {count}')
          client.write_text(updated, encoding='utf-8')

      - name: Apply formatter
        run: ./gradlew --no-daemon spotlessApply

      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-release-build-core.yml

      - name: Commit release build core
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "build: make alpha archives reproducible and portable"
          git fetch origin agent/issue-91-direct-connect-alpha-release
          git rebase origin/agent/issue-91-direct-connect-alpha-release
          git push origin HEAD:agent/issue-91-direct-connect-alpha-release
