name: Issue 76 lifecycle fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/issue-76-tls-identity-admission'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out issue branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Reorder gateway shutdown ownership
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('server/src/main/java/pl/grzegorz2047/standalonethewalls/server/identity/session/TlsIdentityAdmissionGateway.java')
          text = path.read_text(encoding='utf-8')
          old = '''        try {
              authorizedSessions.close();
          } catch (RuntimeException exception) {
              failures.add(exception);
          }
          try {
              if (!executor.awaitTermination(shutdownTimeout.toNanos(), TimeUnit.NANOSECONDS)) {
                  failures.add(
                          new IllegalStateException("identity admission executor did not terminate"));
              }
          } catch (InterruptedException exception) {
              Thread.currentThread().interrupt();
              failures.add(
                      new IllegalStateException(
                              "interrupted while closing identity admission gateway", exception));
          }
          state.set(State.CLOSED);
          '''
          new = '''        try {
              if (!executor.awaitTermination(shutdownTimeout.toNanos(), TimeUnit.NANOSECONDS)) {
                  failures.add(
                          new IllegalStateException("identity admission executor did not terminate"));
              }
          } catch (InterruptedException exception) {
              Thread.currentThread().interrupt();
              failures.add(
                      new IllegalStateException(
                              "interrupted while closing identity admission gateway", exception));
          }
          try {
              authorizedSessions.close();
          } catch (RuntimeException exception) {
              failures.add(exception);
          }
          state.set(State.CLOSED);
          '''
          if old not in text:
              raise SystemExit('expected shutdown block was not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Apply repository format
        run: ./gradlew --no-daemon spotlessApply

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/main/java/pl/grzegorz2047/standalonethewalls/server/identity/session/TlsIdentityAdmissionGateway.java
          git commit -m "Order identity admission shutdown ownership"
          git push origin HEAD:${{ github.head_ref }}
