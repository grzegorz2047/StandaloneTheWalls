name: Spotless Apply 216

on:
  push:
    branches:
      - agent/issue-216-first-run-quality-coordinator

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Apply Spotless
        run: ./gradlew --no-daemon spotlessApply

      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/main/java/pl/grzegorz2047/standalonethewalls/client/performance/GraphicsQualityStartupCoordinator.java
          git add client/src/test/java/pl/grzegorz2047/standalonethewalls/client/performance/GraphicsQualityStartupCoordinatorTest.java
          git commit -m "Apply Spotless formatting"
          git push
