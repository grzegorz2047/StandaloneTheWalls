name: Temporary Self Review Server Fix V2

on:
  push:
    branches:
      - agent/issue-198-open-central-walls

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply focused self-review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path('server/src/main/java/pl/grzegorz2047/standalonethewalls/server/lobby/MinimalLobbyRuntime.java')
          runtime = runtime_path.read_text()
          start = runtime.index('    private void publishPreparationTransition(')
          end = runtime.index('    private void advancePreparationMovement(', start)
          replacement = '''    private void publishPreparationTransition(
                  LobbyState state, LobbyMatchSnapshot matchSnapshot) {
              List<PreparationClientSpawn> plan =
                      PreparationTransitionPlanner.plan(preparationMap, state.roster, matchSnapshot);
              Map<
                              pl.grzegorz2047.standalonethewalls.protocol.identity.PlayerId,
                              PreparationSpawnAssignment>
                      assignments = new HashMap<>();
              for (PreparationClientSpawn delivery : plan) {
                  MemberState member = state.members.get(delivery.participantId());
                  if (member == null) {
                      throw new IllegalStateException(
                              "preparation transition plan contains an unowned participant");
                  }
                  member.preparationInputMailbox.open(matchSnapshot.roundNumber());
                  assignments.put(member.identity.playerId(), delivery.assignment());
              }
              state.preparationMovement =
                      PreparationMovementSimulation.start(
                              matchSnapshot.roundNumber(),
                              matchSnapshot.authoritativeTick(),
                              preparationMap,
                              assignments);

              byte[] snapshotPayload =
                      LobbyMatchProtocolCodec.encodeSnapshot(
                              LobbyMatchProtocolAdapter.toProtocol(matchSnapshot));
              List<LobbyParticipantId> failed =
                      new ArrayList<>(
                              sendToMembers(
                                      state.members,
                                      MessageType.LOBBY_MATCH_SNAPSHOT,
                                      snapshotPayload));
              for (PreparationClientSpawn delivery : plan) {
                  if (failed.contains(delivery.participantId())) {
                      continue;
                  }
                  MemberState member = state.members.get(delivery.participantId());
                  if (member == null) {
                      throw new IllegalStateException(
                              "preparation transition member disappeared before assignment send");
                  }
                  byte[] assignmentPayload =
                          pl.grzegorz2047.standalonethewalls.protocol.preparation.PreparationSpawnProtocolCodec
                                  .encodeAssignment(delivery.assignment());
                  failed.addAll(
                          sendToMembers(
                                  Map.of(delivery.participantId(), member),
                                  MessageType.PREPARATION_SPAWN_ASSIGNMENT,
                                  assignmentPayload));
              }

              if (!failed.isEmpty()) {
                  removeFailedMembers(state, failed);
                  if (state.members.isEmpty()) {
                      return;
                  }
                  stabilizeSnapshots(state);
              }
              PreparationMovementSimulation movement = state.preparationMovement;
              if (movement != null) {
                  publishPreparationSnapshot(state, movement.currentSnapshot().orElseThrow());
              }
          }

'''
          runtime = runtime[:start] + replacement + runtime[end:]

          helper_start = runtime.index(
              '    private static Map<LobbyParticipantId, ReliableChannel> preparationChannels(')
          helper_end = runtime.index('    private void removeFailedMembers(', helper_start)
          runtime = runtime[:helper_start] + runtime[helper_end:]
          runtime_path.write_text(runtime)

          test_path = Path('server/src/test/java/pl/grzegorz2047/standalonethewalls/server/identity/session/MinimalLobbyRuntimeTest.java')
          tests = test_path.read_text()
          flaky_old = '''            waitUntil(
                    () ->
                            latestMatchSnapshotUnchecked(alpha).phase()
                                    == LobbyMatchPhase.PREPARATION);
            LobbyMatchPhaseSnapshot preparation = latestMatchSnapshotUnchecked(alpha);
            assertThat(preparation).isEqualTo(latestMatchSnapshotUnchecked(bravo));'''
          flaky_new = '''            waitUntil(
                    () ->
                            latestMatchSnapshotUnchecked(alpha).phase()
                                            == LobbyMatchPhase.PREPARATION
                                    && latestMatchSnapshotUnchecked(alpha)
                                            .equals(latestMatchSnapshotUnchecked(bravo)));
            LobbyMatchPhaseSnapshot preparation = latestMatchSnapshotUnchecked(alpha);
            assertThat(preparation).isEqualTo(latestMatchSnapshotUnchecked(bravo));'''
          if tests.count(flaky_old) != 1:
              raise SystemExit('expected exactly one flaky preparation wait')
          tests = tests.replace(flaky_old, flaky_new, 1)

          anchor = '''    @Test
    void shutdownDuringCountdownClosesEverySessionAndRejectsLaterTicks()'''
          additions = '''    @Test
    void preparationSpawnSendFailureRemovesOnlyBrokenSessionAndKeepsRemainingWorld()
            throws InterruptedException {
        AuthorizedPlayerSessionQueue queue = queue(2);
        TestSession alpha = new TestSession(1, playerId('a'), "alpha");
        TestSession bravo = new TestSession(2, playerId('b'), "bravo");
        enqueue(queue, alpha);
        enqueue(queue, bravo);
        MinimalLobbyRuntime lobby = countdownLobby(queue);

        try {
            lobby.start();
            waitUntil(() -> lobby.memberCount() == 2);
            readyTwoPlayers(alpha, bravo);
            waitUntil(
                    () ->
                            latestMatchSnapshotUnchecked(alpha).phase()
                                    == LobbyMatchPhase.START_COUNTDOWN);
            assertThat(lobby.offerSimulationTick(0L)).isTrue();
            waitUntil(() -> latestMatchSnapshotUnchecked(alpha).ticksRemaining() == 2L);
            assertThat(lobby.offerSimulationTick(1L)).isTrue();
            waitUntil(() -> latestMatchSnapshotUnchecked(alpha).ticksRemaining() == 1L);

            bravo.channel.failNextSend(MessageType.PREPARATION_SPAWN_ASSIGNMENT);
            assertThat(lobby.offerSimulationTick(2L)).isTrue();
            waitUntil(
                    () ->
                            lobby.memberCount() == 1
                                    && bravo.closeCount() == 1
                                    && latestMatchSnapshotUnchecked(alpha).phase()
                                            == LobbyMatchPhase.PREPARATION
                                    && latestMatchSnapshotUnchecked(alpha).connectedPlayers() == 1
                                    && preparationAssignmentCount(alpha) == 1
                                    && preparationWorldSnapshotCount(alpha) >= 1);

            assertThat(lobby.isRunning()).isTrue();
            assertThat(lobby.failure()).isEmpty();
            assertThat(alpha.closeCount()).isZero();
            assertThat(latestSnapshotUnchecked(alpha).members())
                    .extracting(LobbyMember::playerId)
                    .containsExactly(alpha.playerId());
            assertThat(latestPreparationWorldSnapshotUnchecked(alpha).players())
                    .extracting(PreparationPlayerSnapshot::playerId)
                    .containsExactly(alpha.playerId());
        } finally {
            lobby.close();
            queue.close();
        }
    }

    @Test
    void openingSnapshotSendFailureRemovesOnlyBrokenSessionAndPreservesOpening()
            throws InterruptedException {
        AuthorizedPlayerSessionQueue queue = queue(2);
        TestSession alpha = new TestSession(1, playerId('a'), "alpha");
        TestSession bravo = new TestSession(2, playerId('b'), "bravo");
        enqueue(queue, alpha);
        enqueue(queue, bravo);
        MinimalLobbyRuntime lobby = countdownLobby(queue);

        try {
            lobby.start();
            waitUntil(() -> lobby.memberCount() == 2);
            readyTwoPlayers(alpha, bravo);
            waitUntil(
                    () ->
                            latestMatchSnapshotUnchecked(alpha).phase()
                                    == LobbyMatchPhase.START_COUNTDOWN);
            assertThat(lobby.offerSimulationTick(0L)).isTrue();
            assertThat(lobby.offerSimulationTick(1L)).isTrue();
            assertThat(lobby.offerSimulationTick(2L)).isTrue();
            waitUntil(() -> preparationAssignmentCount(alpha) == 1);
            assertThat(lobby.offerSimulationTick(3L)).isTrue();
            waitUntil(
                    () ->
                            latestMatchSnapshotUnchecked(alpha).phase()
                                            == LobbyMatchPhase.PREPARATION
                                    && latestMatchSnapshotUnchecked(alpha).ticksRemaining() == 1L);

            bravo.channel.failNextSend(MessageType.LOBBY_MATCH_SNAPSHOT);
            assertThat(lobby.offerSimulationTick(4L)).isTrue();
            waitUntil(
                    () ->
                            lobby.memberCount() == 1
                                    && bravo.closeCount() == 1
                                    && latestMatchSnapshotUnchecked(alpha).phase()
                                            == LobbyMatchPhase.WALLS_OPENING
                                    && latestMatchSnapshotUnchecked(alpha).connectedPlayers() == 1);

            assertThat(lobby.isRunning()).isTrue();
            assertThat(lobby.failure()).isEmpty();
            assertThat(alpha.closeCount()).isZero();
            assertThat(lobby.offerSimulationTick(5L)).isTrue();
            waitUntil(
                    () ->
                            latestMatchSnapshotUnchecked(alpha).phase()
                                    == LobbyMatchPhase.OPEN_COMBAT);
        } finally {
            lobby.close();
            queue.close();
        }
    }

    @Test
    void openCombatSnapshotSendFailureRemovesOnlyBrokenSessionAndPreservesOpenCombat()
            throws InterruptedException {
        AuthorizedPlayerSessionQueue queue = queue(2);
        TestSession alpha = new TestSession(1, playerId('a'), "alpha");
        TestSession bravo = new TestSession(2, playerId('b'), "bravo");
        enqueue(queue, alpha);
        enqueue(queue, bravo);
        MinimalLobbyRuntime lobby = countdownLobby(queue);

        try {
            lobby.start();
            waitUntil(() -> lobby.memberCount() == 2);
            readyTwoPlayers(alpha, bravo);
            waitUntil(
                    () ->
                            latestMatchSnapshotUnchecked(alpha).phase()
                                    == LobbyMatchPhase.START_COUNTDOWN);
            for (long tick = 0L; tick <= 4L; tick++) {
                assertThat(lobby.offerSimulationTick(tick)).isTrue();
            }
            waitUntil(
                    () ->
                            latestMatchSnapshotUnchecked(alpha).phase()
                                    == LobbyMatchPhase.WALLS_OPENING);

            bravo.channel.failNextSend(MessageType.LOBBY_MATCH_SNAPSHOT);
            assertThat(lobby.offerSimulationTick(5L)).isTrue();
            waitUntil(
                    () ->
                            lobby.memberCount() == 1
                                    && bravo.closeCount() == 1
                                    && latestMatchSnapshotUnchecked(alpha).phase()
                                            == LobbyMatchPhase.OPEN_COMBAT
                                    && latestMatchSnapshotUnchecked(alpha).connectedPlayers() == 1);

            assertThat(lobby.isRunning()).isTrue();
            assertThat(lobby.failure()).isEmpty();
            assertThat(alpha.closeCount()).isZero();
        } finally {
            lobby.close();
            queue.close();
        }
    }

    @Test
    void shutdownAtOpeningBoundaryClosesSessionsAndRejectsOpenCombatTick()
            throws InterruptedException {
        AuthorizedPlayerSessionQueue queue = queue(2);
        TestSession alpha = new TestSession(1, playerId('a'), "alpha");
        TestSession bravo = new TestSession(2, playerId('b'), "bravo");
        enqueue(queue, alpha);
        enqueue(queue, bravo);
        MinimalLobbyRuntime lobby = countdownLobby(queue);

        try {
            lobby.start();
            waitUntil(() -> lobby.memberCount() == 2);
            readyTwoPlayers(alpha, bravo);
            waitUntil(
                    () ->
                            latestMatchSnapshotUnchecked(alpha).phase()
                                    == LobbyMatchPhase.START_COUNTDOWN);
            for (long tick = 0L; tick <= 4L; tick++) {
                assertThat(lobby.offerSimulationTick(tick)).isTrue();
            }
            waitUntil(
                    () ->
                            latestMatchSnapshotUnchecked(alpha).phase()
                                    == LobbyMatchPhase.WALLS_OPENING);

            lobby.close();
            lobby.close();

            assertThat(lobby.isRunning()).isFalse();
            assertThat(lobby.offerSimulationTick(5L)).isFalse();
            assertThat(lobby.failure()).isEmpty();
            assertThat(lobby.memberCount()).isZero();
            assertThat(alpha.closeCount()).isEqualTo(1);
            assertThat(bravo.closeCount()).isEqualTo(1);
            assertThat(queue.activeTransferCount()).isZero();
        } finally {
            lobby.close();
            queue.close();
        }
    }

'''
          if tests.count(anchor) != 1:
              raise SystemExit('expected shutdown test anchor')
          test_path.write_text(tests.replace(anchor, additions + anchor, 1))

          movement_path = Path('server/src/test/java/pl/grzegorz2047/standalonethewalls/server/preparation/PreparationObstacleMovementSimulationTest.java')
          movement = movement_path.read_text()
          movement_anchor = '''    @Test
    void rejectsASpawnWithoutAuthoritativeStandingClearance()'''
          fresh = '''    @Test
    void freshSimulationStartsClosedAfterAnotherSimulationOpened() {
        PreparationObstacleBox centralBarrier =
                obstacle(
                        PreparationObstacleMap.CENTRAL_WALL_X_NAME,
                        -0.4d,
                        0.0d,
                        -2.0d,
                        -0.39d,
                        5.0d,
                        2.0d);
        PreparationMovementSimulation opened =
                simulation(-0.8d, 0.5d, 0.0d, centralBarrier);

        opened.advanceTick(11L, Map.of(), PreparationBarrierPolicy.OPEN);
        PreparationMovementSimulation fresh =
                simulation(-0.8d, 0.5d, 0.0d, centralBarrier);

        assertThat(opened.barrierPolicy()).isEqualTo(PreparationBarrierPolicy.OPEN);
        assertThat(fresh.barrierPolicy()).isEqualTo(PreparationBarrierPolicy.CLOSED);
    }

'''
          if movement.count(movement_anchor) != 1:
              raise SystemExit('expected fresh simulation test anchor')
          movement_path.write_text(movement.replace(movement_anchor, fresh + movement_anchor, 1))
          PY

      - name: Canonical formatting
        run: ./gradlew --no-daemon spotlessApply

      - name: Commit focused fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Isolate phase send failures after self review"
          git push origin "HEAD:${GITHUB_REF_NAME}"
