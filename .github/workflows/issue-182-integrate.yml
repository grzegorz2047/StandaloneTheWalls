name: Integrate issue 182 authoritative sprint

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  integrate-issue-182:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out sprint branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/issue-182-authoritative-sprint
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/fonts/requirements.txt

      - name: Install pinned font tooling
        run: python -m pip install --disable-pip-version-check --requirement tools/fonts/requirements.txt

      - name: Generate and stage pinned UI font inputs
        shell: bash
        run: |
          set -euo pipefail
          python tools/fonts/prepare_sunderfront_ui_font.py
          mkdir -p client/src/main/resources/Interface/Fonts
          cp build/generated-ui-font/SunderfrontUI-Regular.png.b64* client/src/main/resources/Interface/Fonts/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Integrate authoritative sprint
        run: python tools/issue_182_integrate.py

      - name: Format and run the full repository quality gate
        run: |
          ./gradlew --no-daemon spotlessApply
          ./gradlew --no-daemon check

      - name: Commit tested sprint and remove helper files
        shell: bash
        run: |
          set -euo pipefail
          rm -f client/src/main/resources/Interface/Fonts/SunderfrontUI-Regular.png.b64*
          rm -f tools/issue_182_integrate.py
          rm -f .github/workflows/issue-182-integrate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add authoritative preparation sprint"
          git push origin HEAD:agent/issue-182-authoritative-sprint
