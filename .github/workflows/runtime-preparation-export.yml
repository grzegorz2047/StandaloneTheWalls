name: Runtime Preparation Export

on:
  push:
    branches:
      - agent/issue-129-runtime-preparation-transition

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Apply deterministic runtime patch
        shell: python
        run: |
          from pathlib import Path

          runtime_path = Path("server/src/main/java/pl/grzegorz2047/standalonethewalls/server/lobby/MinimalLobbyRuntime.java")
          runtime = runtime_path.read_text(encoding="utf-8")

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          runtime = replace_once(
              runtime,
              "import pl.grzegorz2047.standalonethewalls.domain.match.MatchConfiguration;\nimport pl.grzegorz2047.standalonethewalls.protocol.MessageType;\nimport pl.grzegorz2047.standalonethewalls.protocol.ProtocolEnvelope;\nimport pl.grzegorz2047.standalonethewalls.protocol.ReliableSendResult;",
              "import pl.grzegorz2047.standalonethewalls.domain.match.MatchConfiguration;\nimport pl.grzegorz2047.standalonethewalls.domain.match.MatchPhase;\nimport pl.grzegorz2047.standalonethewalls.mapformat.MinimalPreparationBundle;\nimport pl.grzegorz2047.standalonethewalls.mapformat.TwMapBundleException;\nimport pl.grzegorz2047.standalonethewalls.mapformat.TwMapBundleLoader;\nimport pl.grzegorz2047.standalonethewalls.mapformat.TwMapLoadPolicy;\nimport pl.grzegorz2047.standalonethewalls.mapformat.VerifiedMapBundle;\nimport pl.grzegorz2047.standalonethewalls.protocol.MessageType;\nimport pl.grzegorz2047.standalonethewalls.protocol.ProtocolEnvelope;\nimport pl.grzegorz2047.standalonethewalls.protocol.ReliableChannel;\nimport pl.grzegorz2047.standalonethewalls.protocol.ReliableSendResult;",
              "runtime imports",
          )
          runtime = replace_once(
              runtime,
              "import pl.grzegorz2047.standalonethewalls.server.identity.session.AuthorizedPlayerSession;\nimport pl.grzegorz2047.standalonethewalls.server.identity.session.AuthorizedPlayerSessionQueue;",
              "import pl.grzegorz2047.standalonethewalls.server.identity.session.AuthorizedPlayerSession;\nimport pl.grzegorz2047.standalonethewalls.server.identity.session.AuthorizedPlayerSessionQueue;\nimport pl.grzegorz2047.standalonethewalls.server.preparation.PreparationMapDefinition;\nimport pl.grzegorz2047.standalonethewalls.server.preparation.PreparationTransitionPublisher;\nimport pl.grzegorz2047.standalonethewalls.server.preparation.VerifiedPreparationMapAdapter;\nimport pl.grzegorz2047.standalonethewalls.server.preparation.VerifiedPreparationMapException;",
              "preparation imports",
          )
          runtime = replace_once(
              runtime,
              "    private static final int DEFAULT_TICK_RATE = 20;\n    private static final long POLL_MILLIS = 10L;",
              "    private static final int DEFAULT_TICK_RATE = 20;\n    private static final long POLL_MILLIS = 10L;\n    private static final TwMapLoadPolicy DEFAULT_MAP_LOAD_POLICY =\n            new TwMapLoadPolicy(2 * 1024 * 1024, 4 * 1024 * 1024, 16, 100);",
              "map load policy",
          )
          runtime = replace_once(
              runtime,
              "    private final LobbyConfiguration configuration;\n    private final LobbyMatchCoordinator matchCoordinator;\n    private final Duration sendTimeout;",
              "    private final LobbyConfiguration configuration;\n    private final LobbyMatchCoordinator matchCoordinator;\n    private final PreparationMapDefinition preparationMap;\n    private final Duration sendTimeout;",
              "preparation map field",
          )
          runtime = replace_once(
              runtime,
              "        matchCoordinator = new LobbyMatchCoordinator(configuration, lifecycleConfiguration);\n        visibleMatchSnapshot = new AtomicReference<>(matchCoordinator.snapshot());",
              "        matchCoordinator = new LobbyMatchCoordinator(configuration, lifecycleConfiguration);\n        preparationMap = defaultPreparationMap();\n        visibleMatchSnapshot = new AtomicReference<>(matchCoordinator.snapshot());",
              "default map initialization",
          )
          runtime = replace_once(
              runtime,
              "                if (changed.isPresent()) {\n                    visibleMatchSnapshot.set(changed.orElseThrow());\n                    stabilizeMatchSnapshots(state);\n                }",
              "                if (changed.isPresent()) {\n                    LobbyMatchSnapshot snapshot = changed.orElseThrow();\n                    visibleMatchSnapshot.set(snapshot);\n                    stabilizeMatchSnapshots(state, snapshot);\n                }",
              "tick transition routing",
          )
          runtime = replace_once(
              runtime,
              """    private void stabilizeMatchSnapshots(LobbyState state) {
        if (state.members.isEmpty()) {
            return;
        }
        byte[] payload =
                LobbyMatchProtocolCodec.encodeSnapshot(
                        LobbyMatchProtocolAdapter.toProtocol(matchCoordinator.snapshot()));
        List<LobbyParticipantId> failed =
                sendToMembers(state.members, MessageType.LOBBY_MATCH_SNAPSHOT, payload);
        if (failed.isEmpty()) {
            return;
        }
        removeFailedMembers(state, failed);
        stabilizeSnapshots(state);
    }
""",
              """    private void stabilizeMatchSnapshots(
            LobbyState state, LobbyMatchSnapshot matchSnapshot) {
        if (state.members.isEmpty()) {
            return;
        }
        LobbyMatchSnapshot snapshot = Objects.requireNonNull(matchSnapshot, "matchSnapshot");
        if (snapshot.phase() == MatchPhase.PREPARATION) {
            if (!state.preparationTransitionAttempted) {
                state.preparationTransitionAttempted = true;
                publishPreparationTransition(state, snapshot);
            }
            return;
        }
        byte[] payload =
                LobbyMatchProtocolCodec.encodeSnapshot(
                        LobbyMatchProtocolAdapter.toProtocol(snapshot));
        List<LobbyParticipantId> failed =
                sendToMembers(state.members, MessageType.LOBBY_MATCH_SNAPSHOT, payload);
        if (failed.isEmpty()) {
            return;
        }
        removeFailedMembers(state, failed);
        stabilizeSnapshots(state);
    }

    private void publishPreparationTransition(
            LobbyState state, LobbyMatchSnapshot matchSnapshot) {
        PreparationTransitionPublisher.publish(
                preparationMap,
                state.roster,
                matchSnapshot,
                preparationChannels(state),
                sendTimeout);
    }

    private static Map<LobbyParticipantId, ReliableChannel> preparationChannels(
            LobbyState state) {
        Map<LobbyParticipantId, ReliableChannel> channels = new LinkedHashMap<>();
        for (LobbyParticipantState participant : state.roster.participants()) {
            MemberState member = state.members.get(participant.participantId());
            if (member == null) {
                throw new IllegalStateException(
                        "authoritative preparation roster contains an unowned member");
            }
            channels.put(participant.participantId(), member.session.reliableChannel());
        }
        return Map.copyOf(channels);
    }
""",
              "ordered preparation publication",
          )
          runtime = replace_once(
              runtime,
              """    private static Throwable unwrap(Throwable failure) {
        Throwable current = failure;
        while ((current instanceof ExecutionException || current instanceof CompletionException)
                && current.getCause() != null) {
            current = current.getCause();
        }
        return current;
    }

    private enum State {
""",
              """    private static Throwable unwrap(Throwable failure) {
        Throwable current = failure;
        while ((current instanceof ExecutionException || current instanceof CompletionException)
                && current.getCause() != null) {
            current = current.getCause();
        }
        return current;
    }

    private static PreparationMapDefinition defaultPreparationMap() {
        return DefaultPreparationMapHolder.MAP;
    }

    private static final class DefaultPreparationMapHolder {
        private static final PreparationMapDefinition MAP = load();

        private static PreparationMapDefinition load() {
            try {
                VerifiedMapBundle bundle =
                        TwMapBundleLoader.load(
                                MinimalPreparationBundle.createArchive(), DEFAULT_MAP_LOAD_POLICY);
                return VerifiedPreparationMapAdapter.adapt(bundle);
            } catch (TwMapBundleException | VerifiedPreparationMapException exception) {
                throw new ExceptionInInitializerError(exception);
            }
        }
    }

    private enum State {
""",
              "default preparation map holder",
          )
          runtime = replace_once(
              runtime,
              """    private static final class LobbyState {
        private final TreeMap<LobbyParticipantId, MemberState> members = new TreeMap<>();
        private LobbyRosterState roster = LobbyRosterState.initial();
    }
""",
              """    private static final class LobbyState {
        private final TreeMap<LobbyParticipantId, MemberState> members = new TreeMap<>();
        private LobbyRosterState roster = LobbyRosterState.initial();
        private boolean preparationTransitionAttempted;
    }
""",
              "transition attempt state",
          )
          runtime_path.write_text(runtime, encoding="utf-8")

          test_path = Path("server/src/test/java/pl/grzegorz2047/standalonethewalls/server/identity/session/MinimalLobbyRuntimeTest.java")
          test = test_path.read_text(encoding="utf-8")
          test = replace_once(
              test,
              "import pl.grzegorz2047.standalonethewalls.domain.match.MatchConfiguration;\nimport pl.grzegorz2047.standalonethewalls.identity.policy.HandleVerificationLevel;",
              "import pl.grzegorz2047.standalonethewalls.domain.match.MatchConfiguration;\nimport pl.grzegorz2047.standalonethewalls.identity.policy.HandleVerificationLevel;\nimport pl.grzegorz2047.standalonethewalls.mapformat.MinimalPreparationBundle;",
              "test map import",
          )
          test = replace_once(
              test,
              "import pl.grzegorz2047.standalonethewalls.protocol.lobby.LobbySnapshot;\nimport pl.grzegorz2047.standalonethewalls.protocol.lobby.LobbyTeam;\nimport pl.grzegorz2047.standalonethewalls.server.lobby.MinimalLobbyRuntime;",
              "import pl.grzegorz2047.standalonethewalls.protocol.lobby.LobbySnapshot;\nimport pl.grzegorz2047.standalonethewalls.protocol.lobby.LobbyTeam;\nimport pl.grzegorz2047.standalonethewalls.protocol.preparation.PreparationProtocolException;\nimport pl.grzegorz2047.standalonethewalls.protocol.preparation.PreparationSpawnAssignment;\nimport pl.grzegorz2047.standalonethewalls.protocol.preparation.PreparationSpawnProtocolCodec;\nimport pl.grzegorz2047.standalonethewalls.server.lobby.MinimalLobbyRuntime;",
              "test preparation imports",
          )
          test = replace_once(
              test,
              """            assertThat(matchSnapshotCount(alpha, LobbyMatchPhase.PREPARATION)).isOne();
            assertThat(matchSnapshotCount(bravo, LobbyMatchPhase.PREPARATION)).isOne();

            int rosterSnapshotsBeforeLockedCommand = snapshotCount(alpha);
""",
              """            assertThat(matchSnapshotCount(alpha, LobbyMatchPhase.PREPARATION)).isOne();
            assertThat(matchSnapshotCount(bravo, LobbyMatchPhase.PREPARATION)).isOne();
            waitUntil(
                    () ->
                            preparationAssignmentCount(alpha) == 1
                                    && preparationAssignmentCount(bravo) == 1);
            PreparationSpawnAssignment alphaAssignment =
                    latestPreparationAssignmentUnchecked(alpha);
            PreparationSpawnAssignment bravoAssignment =
                    latestPreparationAssignmentUnchecked(bravo);
            assertThat(alphaAssignment.mapId()).isEqualTo(MinimalPreparationBundle.MAP_ID);
            assertThat(bravoAssignment.mapId()).isEqualTo(MinimalPreparationBundle.MAP_ID);
            assertThat(alphaAssignment.mapSha256())
                    .containsExactly(bravoAssignment.mapSha256())
                    .hasSize(32);
            assertThat(alphaAssignment.rosterRevision()).isEqualTo(8L);
            assertThat(bravoAssignment.rosterRevision()).isEqualTo(8L);
            assertThat(alphaAssignment.team()).isEqualTo(LobbyTeam.GREEN);
            assertThat(bravoAssignment.team()).isEqualTo(LobbyTeam.BLUE);
            assertThat(alphaAssignment.spawnIndex()).isNotEqualTo(bravoAssignment.spawnIndex());
            assertThat(preparationSnapshotMessageIndex(alpha))
                    .isLessThan(preparationAssignmentMessageIndex(alpha));
            assertThat(preparationSnapshotMessageIndex(bravo))
                    .isLessThan(preparationAssignmentMessageIndex(bravo));

            int rosterSnapshotsBeforeLockedCommand = snapshotCount(alpha);
""",
              "assignment assertions",
          )
          test = replace_once(
              test,
              """            assertThat(latestMatchSnapshotUnchecked(alpha).revision())
                    .isEqualTo(preparation.revision());
""",
              """            assertThat(latestMatchSnapshotUnchecked(alpha).revision())
                    .isEqualTo(preparation.revision());
            assertThat(preparationAssignmentCount(alpha)).isOne();
            assertThat(preparationAssignmentCount(bravo)).isOne();
""",
              "no duplicate assignment assertion",
          )
          test = replace_once(
              test,
              """    private static int snapshotCount(TestSession session) {
""",
              """    private static int preparationAssignmentCount(TestSession session) {
        return Math.toIntExact(
                session.channel.sent().stream()
                        .filter(
                                message ->
                                        message.messageType()
                                                == MessageType.PREPARATION_SPAWN_ASSIGNMENT)
                        .count());
    }

    private static PreparationSpawnAssignment latestPreparationAssignmentUnchecked(
            TestSession session) {
        SentMessage message =
                session.channel.sent().stream()
                        .filter(
                                candidate ->
                                        candidate.messageType()
                                                == MessageType.PREPARATION_SPAWN_ASSIGNMENT)
                        .reduce((first, second) -> second)
                        .orElseThrow();
        try {
            return PreparationSpawnProtocolCodec.decodeAssignment(message.payload());
        } catch (PreparationProtocolException exception) {
            throw new AssertionError(exception);
        }
    }

    private static int preparationSnapshotMessageIndex(TestSession session) {
        List<SentMessage> messages = session.channel.sent();
        for (int index = 0; index < messages.size(); index++) {
            SentMessage message = messages.get(index);
            if (message.messageType() != MessageType.LOBBY_MATCH_SNAPSHOT) {
                continue;
            }
            try {
                if (LobbyMatchProtocolCodec.decodeSnapshot(message.payload()).phase()
                        == LobbyMatchPhase.PREPARATION) {
                    return index;
                }
            } catch (LobbyProtocolException exception) {
                throw new AssertionError(exception);
            }
        }
        throw new AssertionError("preparation snapshot was not sent");
    }

    private static int preparationAssignmentMessageIndex(TestSession session) {
        List<SentMessage> messages = session.channel.sent();
        for (int index = 0; index < messages.size(); index++) {
            if (messages.get(index).messageType()
                    == MessageType.PREPARATION_SPAWN_ASSIGNMENT) {
                return index;
            }
        }
        throw new AssertionError("preparation assignment was not sent");
    }

    private static int snapshotCount(TestSession session) {
""",
              "assignment helpers",
          )
          test_path.write_text(test, encoding="utf-8")
      - name: Apply repository formatter
        run: ./gradlew --no-daemon spotlessApply
      - name: Upload patched sources
        uses: actions/upload-artifact@v4
        with:
          name: runtime-preparation-export
          path: |
            server/src/main/java/pl/grzegorz2047/standalonethewalls/server/lobby/MinimalLobbyRuntime.java
            server/src/test/java/pl/grzegorz2047/standalonethewalls/server/identity/session/MinimalLobbyRuntimeTest.java
          if-no-files-found: error
          retention-days: 1
