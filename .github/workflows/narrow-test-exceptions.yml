name: One-time Narrow Test Exceptions

on:
  push:
    branches:
      - agent/issue-24-quality-gates

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out quality branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-24-quality-gates
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Narrow checked exception declarations
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "protocol/src/test/java/pl/grzegorz2047/standalonethewalls/protocol/identity/IdentityTranscriptTest.java": [
                  ("void isDeterministicAndUnambiguousAcrossEveryBoundField() throws Exception {", "void isDeterministicAndUnambiguousAcrossEveryBoundField() throws IdentityException {")
              ],
              "protocol/src/test/java/pl/grzegorz2047/standalonethewalls/protocol/identity/PlayerIdentityTest.java": [
                  ("import java.security.KeyPairGenerator;", "import java.security.KeyPairGenerator;\nimport java.security.NoSuchAlgorithmException;"),
                  ("void derivesAStablePlayerIdAndFingerprintFromCanonicalPublicKeyBytes() throws Exception {", "void derivesAStablePlayerIdAndFingerprintFromCanonicalPublicKeyBytes() throws IdentityException {"),
                  ("void generatesAnApplicationIdentityWithoutExposingKeyBytesInText() throws Exception {", "void generatesAnApplicationIdentityWithoutExposingKeyBytesInText() throws IdentityException {"),
                  ("void loadOrCreatePersistsOnceAndReturnsTheSameCryptographicIdentity() throws Exception {", "void loadOrCreatePersistsOnceAndReturnsTheSameCryptographicIdentity() throws IdentityException {"),
                  ("void rejectsMismatchedPublicAndPrivateKeysLoadedFromStorage() throws Exception {", "void rejectsMismatchedPublicAndPrivateKeysLoadedFromStorage() throws NoSuchAlgorithmException {"),
                  ("void separateGeneratedKeysProduceSeparatePlayerIds() throws Exception {", "void separateGeneratedKeysProduceSeparatePlayerIds() throws IdentityException {")
              ],
              "server/src/test/java/pl/grzegorz2047/standalonethewalls/server/ServerLauncherTest.java": [
                  ("import java.nio.file.Files;", "import java.io.IOException;\nimport java.nio.file.Files;"),
                  ("void validatesConfigurationWithoutStartingTheRuntime() throws Exception {", "void validatesConfigurationWithoutStartingTheRuntime() throws IOException {")
              ],
              "server/src/test/java/pl/grzegorz2047/standalonethewalls/server/config/ServerConfigurationLoaderTest.java": [
                  ("import java.io.StringReader;", "import java.io.IOException;\nimport java.io.StringReader;"),
                  ("void loadsOverridesAndKeepsUnspecifiedDefaults() throws Exception {", "void loadsOverridesAndKeepsUnspecifiedDefaults() throws IOException {")
              ],
              "server/src/test/java/pl/grzegorz2047/standalonethewalls/server/runtime/FixedTickLoopTest.java": [
                  ("void schedulesDeterministicTicksWithoutUsingWallClockTime() throws Exception {", "void schedulesDeterministicTicksWithoutUsingWallClockTime() throws InterruptedException {"),
                  ("void boundsCatchUpAndReportsDroppedSchedulingDebt() throws Exception {", "void boundsCatchUpAndReportsDroppedSchedulingDebt() throws InterruptedException {"),
                  ("void rejectsConcurrentRunAndUnsafeConfiguration() throws Exception {", "void rejectsConcurrentRunAndUnsafeConfiguration() throws InterruptedException {")
              ],
              "server/src/test/java/pl/grzegorz2047/standalonethewalls/server/runtime/ServerRuntimeTest.java": [
                  ("void terminatesItsOnlyThreadAfterARequestedTickBudget() throws Exception {", "void terminatesItsOnlyThreadAfterARequestedTickBudget() throws InterruptedException {"),
                  ("void capturesHandlerFailureAndCannotBeStartedTwice() throws Exception {", "void capturesHandlerFailureAndCannotBeStartedTwice() throws InterruptedException {")
              ]
          }

          for file_name, file_replacements in replacements.items():
              path = Path(file_name)
              text = path.read_text(encoding="utf-8")
              for old, new in file_replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"Expected one occurrence in {file_name}: {old!r}; found {count}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

      - name: Apply repository formatting
        run: ./gradlew --no-daemon spotlessApply

      - name: Verify exact file scope
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(protocol/src/test/java/pl/grzegorz2047/standalonethewalls/protocol/identity/(IdentityTranscriptTest|PlayerIdentityTest)\.java|server/src/test/java/pl/grzegorz2047/standalonethewalls/server/ServerLauncherTest\.java|server/src/test/java/pl/grzegorz2047/standalonethewalls/server/config/ServerConfigurationLoaderTest\.java|server/src/test/java/pl/grzegorz2047/standalonethewalls/server/runtime/(FixedTickLoopTest|ServerRuntimeTest)\.java)$'
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if ! [[ "$file" =~ $allowed ]]; then
              echo "Unexpected modified file: $file" >&2
              exit 1
            fi
          done < <(git diff --name-only)

      - name: Commit fixes and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/narrow-test-exceptions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Narrow test exception declarations"
          git push origin HEAD:agent/issue-24-quality-gates
