name: Issue 194 Face Triangulation Fix

on:
  push:
    branches:
      - agent/issue-194-canonical-collision-bytes
    paths:
      - .github/workflows/issue-194-topology-fix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-194-canonical-collision-bytes
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Patch, format and verify
        shell: bash
        run: |
          set +e
          log=/tmp/issue-194-topology.log
          result=.github/issue-194-topology-result.txt
          python3 - <<'PY' > "$log" 2>&1
          from pathlib import Path

          source_path = Path('map-format/src/main/java/pl/grzegorz2047/standalonethewalls/mapformat/Glb2CanonicalBoxMeshVerifier.java')
          source = source_path.read_text(encoding='utf-8')
          old_arrays = '''        int[] faceTriangleCounts = new int[6];
                  int[] faceCornerMasks = new int[6];'''
          new_arrays = '''        int[] faceTriangleCounts = new int[6];
                  int[] faceCornerMasks = new int[6];
                  int[] firstTriangleMasks = new int[6];
                  int[] sharedCornerMasks = new int[6];'''
          old_update = '''            faceTriangleCounts[face]++;
                      faceCornerMasks[face] |= (1 << first) | (1 << second) | (1 << third);'''
          new_update = '''            int triangleMask = (1 << first) | (1 << second) | (1 << third);
                      if (faceTriangleCounts[face] == 0) {
                          firstTriangleMasks[face] = triangleMask;
                      } else if (faceTriangleCounts[face] == 1) {
                          sharedCornerMasks[face] = firstTriangleMasks[face] & triangleMask;
                      }
                      faceTriangleCounts[face]++;
                      faceCornerMasks[face] |= triangleMask;'''
          old_check = '''            if (faceTriangleCounts[face] != 2 || Integer.bitCount(faceCornerMasks[face]) != 4) {
                          return false;
                      }'''
          new_check = '''            if (faceTriangleCounts[face] != 2
                              || Integer.bitCount(faceCornerMasks[face]) != 4
                              || !isFaceDiagonal(sharedCornerMasks[face])) {
                          return false;
                      }'''
          method_marker = '''    private static int face(int first, int second, int third) {'''
          diagonal_method = '''    private static boolean isFaceDiagonal(int cornerMask) {
                  if (Integer.bitCount(cornerMask) != 2) {
                      return false;
                  }
                  int first = Integer.numberOfTrailingZeros(cornerMask);
                  int second = Integer.numberOfTrailingZeros(cornerMask & ~(1 << first));
                  return Integer.bitCount(first ^ second) == 2;
              }

          '''
          for marker, replacement in ((old_arrays, new_arrays), (old_update, new_update), (old_check, new_check)):
              if source.count(marker) != 1:
                  raise SystemExit(f'source marker count {source.count(marker)}: {marker[:60]!r}')
              source = source.replace(marker, replacement)
          if source.count(method_marker) != 1:
              raise SystemExit('face method marker missing')
          source = source.replace(method_marker, diagonal_method + method_marker)
          source_path.write_text(source, encoding='utf-8')

          test_path = Path('map-format/src/test/java/pl/grzegorz2047/standalonethewalls/mapformat/Glb2CanonicalBoxMeshVerifierTest.java')
          test = test_path.read_text(encoding='utf-8')
          insertion = '''    @Test
              void rejectsFaceTrianglesSharingCubeEdgeInsteadOfDiagonal()
                      throws Glb2Exception, Glb2CanonicalBoxMeshVerifier.VerificationException {
                  byte[] overlappingFace = CanonicalCollisionGlbFixture.canonicalBinary();
                  ByteBuffer.wrap(overlappingFace)
                          .order(ByteOrder.LITTLE_ENDIAN)
                          .putShort(
                                  CanonicalCollisionGlbFixture.POSITION_BYTES + 4 * Short.BYTES,
                                  (short) 1);

                  assertRejected(overlappingFace);
              }

          '''
          marker = '''    @Test
              void rejectsOutOfRangeDegenerateMissingFaceAndUnusedVertexIndices()'''
          if test.count(marker) != 1:
              raise SystemExit('topology test insertion marker missing')
          test_path.write_text(test.replace(marker, insertion + marker), encoding='utf-8')
          PY
          status=$?
          if [ "$status" -eq 0 ]; then
            ./gradlew --no-daemon spotlessApply :map-format:test :map-format:spotbugsMain :map-format:spotbugsTest >> "$log" 2>&1
            status=$?
          fi
          if [ "$status" -ne 0 ] && [ -f map-format/build/reports/spotbugs/xml.xml ]; then
            printf '\n--- SPOTBUGS FINDINGS ---\n' >> "$log"
            grep -n -E 'BugInstance|ShortMessage|LongMessage|SourceLine' map-format/build/reports/spotbugs/xml.xml >> "$log" 2>&1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$status" -eq 0 ]; then
            tail -n 300 "$log" > "$result"
            printf '\nISSUE_194_TOPOLOGY_STATUS=SUCCESS\n' >> "$result"
            git add map-format/src/main map-format/src/test "$result"
            message="Require diagonal box face triangulation"
          else
            git reset --hard HEAD
            tail -n 500 "$log" > "$result"
            printf '\nISSUE_194_TOPOLOGY_STATUS=FAILURE:%s\n' "$status" >> "$result"
            git add "$result"
            message="Record issue 194 topology check failure"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "$message"
            git push origin HEAD:agent/issue-194-canonical-collision-bytes
          fi
          exit 0
