name: Temporary Self Review Fixes

on:
  push:
    branches:
      - agent/issue-198-open-central-walls

permissions:
  contents: write

jobs:
  fix-self-review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply self-review corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_name, old, new):
              path = Path(path_name)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path_name}: expected one match, found {count}')
              path.write_text(text.replace(old, new, 1))

          replace_once(
              'client/src/main/java/pl/grzegorz2047/standalonethewalls/client/network/ConnectedLobbySession.java',
              '''            matchSnapshot.set(next);\n        }\n        return Optional.empty();\n    }\n\n    private Optional<DirectConnectFailure> processPreparationSpawnAssignment''',
              '''            matchSnapshot.set(next);\n            if (next.phase() == LobbyMatchPhase.OPEN_COMBAT) {\n                PreparationState currentPreparation = preparationState.get();\n                if (currentPreparation != null) {\n                    currentPreparation.scene().openCentralBarriers();\n                }\n            }\n        }\n        return Optional.empty();\n    }\n\n    private Optional<DirectConnectFailure> processPreparationSpawnAssignment''')

          replace_once(
              'client/src/main/java/pl/grzegorz2047/standalonethewalls/client/preparation/PreparationSceneGraphLoader.java',
              '''        PreparationPhasePresentationBridge.bind(verified);\n        return new PhaseAwareWorldNode(loaded, verified);''',
              '''        return new PhaseAwareWorldNode(loaded, verified);''')

          model_path = Path('client/src/main/java/pl/grzegorz2047/standalonethewalls/client/ui/directconnect/ConnectedLobbyMatchModel.java')
          model = model_path.read_text()
          model = model.replace(
              'import pl.grzegorz2047.standalonethewalls.client.preparation.PreparationPhasePresentationBridge;\n',
              '')
          old_method = '''    public boolean lobbyControlsAllowed() {\n        PreparationPhasePresentationBridge.apply(phase);\n        return phase == LobbyMatchPhase.WAITING_FOR_PLAYERS\n                || phase == LobbyMatchPhase.START_COUNTDOWN;\n    }'''
          new_method = '''    public boolean lobbyControlsAllowed() {\n        return phase == LobbyMatchPhase.WAITING_FOR_PLAYERS\n                || phase == LobbyMatchPhase.START_COUNTDOWN;\n    }'''
          if model.count(old_method) != 1:
              raise SystemExit('ConnectedLobbyMatchModel: expected side-effecting method')
          model_path.write_text(model.replace(old_method, new_method, 1))

          for obsolete in (
              'client/src/main/java/pl/grzegorz2047/standalonethewalls/client/preparation/PreparationPhasePresentationBridge.java',
              'client/src/test/java/pl/grzegorz2047/standalonethewalls/client/preparation/PreparationPhasePresentationBridgeTest.java',
          ):
              path = Path(obsolete)
              if not path.exists():
                  raise SystemExit(f'missing obsolete bridge file: {obsolete}')
              path.unlink()

          replace_once(
              'client/src/test/java/pl/grzegorz2047/standalonethewalls/client/preparation/PreparationSceneGraphLoaderTest.java',
              '''    @Test\n    void loadsTheVerifiedCollisionGlbAsASeparateDetachedGraph()''',
              '''    @Test\n    void openPolicyDetachesOnlyCentralWallVisualsOnLogicalUpdate()\n            throws PreparationSceneLoadException, PreparationSceneGraphException {\n        DesktopAssetManager assetManager = new DesktopAssetManager(true);\n        VerifiedPreparationScene verified = verifiedGreenScene();\n        Node graph = PreparationSceneGraphLoader.load(assetManager, verified);\n\n        assertThat(graph.getChild("CentralWallX")).isNotNull();\n        assertThat(graph.getChild("CentralWallZ")).isNotNull();\n        assertThat(graph.getChild("Ground")).isNotNull();\n        assertThat(graph.getChild("PreparationSun")).isNotNull();\n\n        assertThat(verified.openCentralBarriers()).isTrue();\n        graph.updateLogicalState(0.0f);\n\n        assertThat(graph.getChild("CentralWallX")).isNull();\n        assertThat(graph.getChild("CentralWallZ")).isNull();\n        assertThat(graph.getChild("Ground")).isNotNull();\n        assertThat(graph.getChild("PreparationSun")).isNotNull();\n    }\n\n    @Test\n    void loadsTheVerifiedCollisionGlbAsASeparateDetachedGraph()''')

          session_test_path = Path('client/src/test/java/pl/grzegorz2047/standalonethewalls/client/network/ConnectedLobbySessionTest.java')
          session_test = session_test_path.read_text()
          replacements = [
              ('import java.util.ArrayDeque;\nimport java.util.List;',
               'import java.util.ArrayDeque;\nimport java.util.HexFormat;\nimport java.util.List;'),
              ('import org.junit.jupiter.api.Test;\n',
               'import org.junit.jupiter.api.Test;\nimport pl.grzegorz2047.standalonethewalls.mapformat.MinimalPreparationBundle;\nimport pl.grzegorz2047.standalonethewalls.mapformat.PreparationBarrierPolicy;\n'),
              ('import pl.grzegorz2047.standalonethewalls.protocol.lobby.LobbyMatchPhaseSnapshot;\n',
               'import pl.grzegorz2047.standalonethewalls.protocol.lobby.LobbyMatchPhaseSnapshot;\nimport pl.grzegorz2047.standalonethewalls.protocol.lobby.LobbyMatchProtocolCodec;\n'),
              ('import pl.grzegorz2047.standalonethewalls.protocol.lobby.LobbyTeam;\n',
               'import pl.grzegorz2047.standalonethewalls.protocol.lobby.LobbyTeam;\nimport pl.grzegorz2047.standalonethewalls.protocol.preparation.PreparationSpawnAssignment;\nimport pl.grzegorz2047.standalonethewalls.protocol.preparation.PreparationSpawnProtocolCodec;\n'),
          ]
          for old, new in replacements:
              if session_test.count(old) != 1:
                  raise SystemExit(f'ConnectedLobbySessionTest import anchor not unique: {old!r}')
              session_test = session_test.replace(old, new, 1)

          test_anchor = '''    private static ConnectedLobbySession createSession(\n            StubReliableChannel channel, LobbySnapshot initial) {'''
          race_test = '''    @Test\n    void openCombatOpensVerifiedSceneBeforeTheRendererGraphIsLoaded()\n            throws InterruptedException, ExecutionException, TimeoutException {\n        StubReliableChannel channel = new StubReliableChannel();\n        AuthenticatedReliableSession transport =\n                AuthenticatedReliableSessionTestFactory.create(channel, PLAYER_ID, HANDLE);\n        LobbySnapshot roster =\n                new LobbySnapshot(\n                        1L,\n                        List.of(\n                                new LobbyMember(\n                                        PLAYER_ID, HANDLE, LobbyTeam.GREEN, true)));\n        LobbyMatchPhaseSnapshot preparation =\n                new LobbyMatchPhaseSnapshot(\n                        1L,\n                        1L,\n                        0L,\n                        LobbyMatchPhase.PREPARATION,\n                        2L,\n                        1,\n                        1L,\n                        LobbyCountdownCancellationReason.NONE);\n        ConnectedLobbySession session =\n                new ConnectedLobbySession(transport, roster, preparation, ignored -> {});\n        session.startReceiving();\n\n        byte[] digest =\n                HexFormat.of().parseHex(MinimalPreparationBundle.EXPECTED_ARCHIVE_SHA256);\n        PreparationSpawnAssignment assignment =\n                new PreparationSpawnAssignment(\n                        1L,\n                        1L,\n                        MinimalPreparationBundle.MAP_ID,\n                        digest,\n                        LobbyTeam.GREEN,\n                        0,\n                        -15.0d,\n                        0.5d,\n                        -14.0d,\n                        45.0d);\n        channel.deliver(preparationSpawnEnvelope(assignment, 1L));\n        waitUntil(() -> session.currentVerifiedPreparationScene().isPresent());\n        var scene = session.currentVerifiedPreparationScene().orElseThrow();\n        assertEquals(PreparationBarrierPolicy.CLOSED, scene.barrierPolicy());\n\n        channel.deliver(\n                matchSnapshotEnvelope(\n                        new LobbyMatchPhaseSnapshot(\n                                2L,\n                                1L,\n                                1L,\n                                LobbyMatchPhase.WALLS_OPENING,\n                                1L,\n                                1,\n                                1L,\n                                LobbyCountdownCancellationReason.NONE),\n                        2L));\n        waitUntil(() -> session.currentMatchSnapshot().revision() == 2L);\n        assertEquals(PreparationBarrierPolicy.CLOSED, scene.barrierPolicy());\n\n        channel.deliver(\n                matchSnapshotEnvelope(\n                        new LobbyMatchPhaseSnapshot(\n                                3L,\n                                1L,\n                                2L,\n                                LobbyMatchPhase.OPEN_COMBAT,\n                                2L,\n                                1,\n                                1L,\n                                LobbyCountdownCancellationReason.NONE),\n                        3L));\n        waitUntil(() -> session.currentMatchSnapshot().phase() == LobbyMatchPhase.OPEN_COMBAT);\n        assertEquals(PreparationBarrierPolicy.OPEN, scene.barrierPolicy());\n\n        session.closeAsync().toCompletableFuture().get(TIMEOUT.toMillis(), TimeUnit.MILLISECONDS);\n    }\n\n'''
          if session_test.count(test_anchor) != 1:
              raise SystemExit('ConnectedLobbySessionTest test insertion anchor not unique')
          session_test = session_test.replace(test_anchor, race_test + test_anchor, 1)

          helper_anchor = '''    private static ProtocolEnvelope snapshotEnvelope(LobbySnapshot snapshot, long sequence) {'''
          helpers = '''    private static ProtocolEnvelope matchSnapshotEnvelope(\n            LobbyMatchPhaseSnapshot snapshot, long sequence) {\n        return new ProtocolEnvelope(\n                ProtocolVersion.CURRENT,\n                MessageType.LOBBY_MATCH_SNAPSHOT,\n                SESSION_ID,\n                sequence,\n                LobbyMatchProtocolCodec.encodeSnapshot(snapshot));\n    }\n\n    private static ProtocolEnvelope preparationSpawnEnvelope(\n            PreparationSpawnAssignment assignment, long sequence) {\n        return new ProtocolEnvelope(\n                ProtocolVersion.CURRENT,\n                MessageType.PREPARATION_SPAWN_ASSIGNMENT,\n                SESSION_ID,\n                sequence,\n                PreparationSpawnProtocolCodec.encodeAssignment(assignment));\n    }\n\n'''
          if session_test.count(helper_anchor) != 1:
              raise SystemExit('ConnectedLobbySessionTest helper insertion anchor not unique')
          session_test = session_test.replace(helper_anchor, helpers + helper_anchor, 1)
          session_test_path.write_text(session_test)

          replace_once(
              'client/src/test/java/pl/grzegorz2047/standalonethewalls/client/preparation/PreparationBarrierPredictionBoundaryTest.java',
              '''    private static PreparationSpawnAssignment assignment() {''',
              '''    @Test\n    void openingDropsAnUnconfirmedCrouchStepAtTheBoundary()\n            throws PreparationSceneLoadException, PreparationSceneGraphException {\n        VerifiedPreparationScene scene = PreparationSceneLoader.loadDefault(assignment());\n        PreparationPlayerState closed = PreparationPlayerState.atAuthoritativeSpawn(scene);\n        PreparationCollisionWorld collisions =\n                PreparationCollisionWorld.load(new DesktopAssetManager(true), scene);\n        PreparationPredictionHistory history = new PreparationPredictionHistory();\n\n        PreparationPlayerState crouched =\n                history.predict(closed, collisions, 1L, 0.0d, 0.0d, false, true, 0.05d);\n        history.markSubmitted(1L);\n        assertThat(crouched.crouching()).isTrue();\n        assertThat(history.pendingStepCount()).isOne();\n\n        assertThat(scene.openCentralBarriers()).isTrue();\n        PreparationPlayerState authoritativeOpen =\n                closed.withAuthoritativeState(\n                        closed.position().x(),\n                        closed.position().y(),\n                        closed.position().z(),\n                        0.0d,\n                        true,\n                        false,\n                        closed.yawDegrees(),\n                        closed.pitchDegrees());\n        PreparationPlayerState reset = history.reconcile(authoritativeOpen, collisions, 0L);\n\n        assertThat(reset.crouching()).isFalse();\n        assertThat(reset.barrierPolicy()).isEqualTo(PreparationBarrierPolicy.OPEN);\n        assertThat(history.pendingStepCount()).isZero();\n    }\n\n    private static PreparationSpawnAssignment assignment() {''')
          PY

      - name: Apply canonical formatting
        run: ./gradlew --no-daemon spotlessApply

      - name: Commit self-review fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix client barrier phase ownership after self review"
          git push origin "HEAD:${GITHUB_REF_NAME}"
