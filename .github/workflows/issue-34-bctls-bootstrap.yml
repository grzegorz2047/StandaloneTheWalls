name: One-time Issue 34 BC TLS Bootstrap

on:
  push:
    branches:
      - agent/issue-34-secure-transport
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-34-secure-transport

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Register module and dependency catalog
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "settings.gradle.kts",
              '    "bot-client",\n)',
              '    "bot-client",\n    "transport-bctls",\n)',
          )
          replace_once(
              "gradle/libs.versions.toml",
              'assertj = "3.27.3"\n',
              'assertj = "3.27.3"\nbouncycastle = "1.84"\n',
          )
          replace_once(
              "gradle/libs.versions.toml",
              '[libraries]\n',
              '[libraries]\n'
              'bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }\n'
              'bouncycastle-provider = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }\n'
              'bouncycastle-tls = { module = "org.bouncycastle:bctls-jdk18on", version.ref = "bouncycastle" }\n',
          )
          replace_once(
              "build.gradle.kts",
              '    "bot-client",\n)',
              '    "bot-client",\n    "transport-bctls",\n)',
          )
          replace_once(
              "README.md",
              '- `bot-client` - headless integration and load-test client\n',
              '- `bot-client` - headless integration and load-test client\n'
              '- `transport-bctls` - pure-Java BCJSSE TLS 1.3 reliable-transport adapter\n',
          )
          replace_once(
              "ARCHITECTURE.md",
              '| `bot-client` | Headless integration and load-test behavior | core modules, SLF4J |\n',
              '| `bot-client` | Headless integration and load-test behavior | core modules, SLF4J |\n'
              '| `transport-bctls` | TLS 1.3, server pinning and RFC 9266 channel binding | `protocol`, Bouncy Castle |\n',
          )
          replace_once(
              "ARCHITECTURE.md",
              '## Fixed-tick simulation\n',
              '## Secure transport adapters\n\n'
              'Concrete networking libraries live outside the core modules. The first reliable adapter is\n'
              '`transport-bctls`, which enforces TLS 1.3, ALPN `sunderfront/1`, explicit server\n'
              'pinning/TOFU, and the RFC 9266 `tls-exporter` binding required by player identity.\n'
              'Protocol framing, runtime socket ownership, realtime DTLS/UDP and reconnect remain separate\n'
              'adapters and work items. See ADR 0005 and issue #34.\n\n'
              '## Fixed-tick simulation\n',
          )

      - name: Generate strict locks and SHA-256 metadata
        run: ./gradlew --no-daemon resolveAndLockAll --write-locks --write-verification-metadata sha256

      - name: Apply repository formatting
        run: ./gradlew --no-daemon spotlessApply

      - name: Commit generated dependency trust state
        run: |
          rm .github/workflows/issue-34-bctls-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Register and lock BC TLS 1.84 adapter"
          git push origin HEAD:agent/issue-34-secure-transport

      - name: Run full quality gate on committed tree
        run: ./gradlew --no-daemon check
