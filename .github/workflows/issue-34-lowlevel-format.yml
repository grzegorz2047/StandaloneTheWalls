name: One-time Issue 34 Low-level TLS Format

on:
  push:
    branches:
      - agent/issue-34-secure-transport
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-34-secure-transport

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply Java formatting
        run: ./gradlew --no-daemon spotlessJavaApply

      - name: Commit only the TLS module formatting
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue-34-lowlevel-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transport-bctls .github/workflows/issue-34-lowlevel-format.yml
          unexpected="$(git diff --cached --name-only | grep -Ev '^(transport-bctls/|\.github/workflows/issue-34-lowlevel-format\.yml$)' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected staged paths:"
            echo "$unexpected"
            exit 1
          fi
          git commit -m "Format low-level BC TLS adapter"
          git push origin HEAD:agent/issue-34-secure-transport
