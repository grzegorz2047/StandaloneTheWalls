name: Issue 192 Final Spotless

on:
  push:
    branches:
      - agent/issue-192-authoritative-obstacle-boxes
    paths:
      - .github/workflows/issue-192-final-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-192-authoritative-obstacle-boxes
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Recognize canonical central wall axes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('map-format/src/main/java/pl/grzegorz2047/standalonethewalls/mapformat/Glb2PreparationObstacleDecoder.java')
          source = path.read_text(encoding='utf-8')
          old_constant = '    private static final String OBSTACLE_SUFFIX = "WallCollision";'
          new_constants = '''    private static final String WALL_SUFFIX = "WallCollision";
              private static final String WALL_X_SUFFIX = "WallXCollision";
              private static final String WALL_Z_SUFFIX = "WallZCollision";'''
          old_method = '''    private static boolean isObstacleName(String name) {
                  return name != null && name.endsWith(OBSTACLE_SUFFIX);
              }'''
          new_method = '''    private static boolean isObstacleName(String name) {
                  return name != null
                          && (name.endsWith(WALL_SUFFIX)
                                  || name.endsWith(WALL_X_SUFFIX)
                                  || name.endsWith(WALL_Z_SUFFIX));
              }'''
          if old_constant not in source or old_method not in source:
              raise SystemExit('expected obstacle naming markers were not found')
          path.write_text(
              source.replace(old_constant, new_constants).replace(old_method, new_method),
              encoding='utf-8',
          )
          PY
      - name: Apply repository formatting
        run: ./gradlew --no-daemon spotlessApply
      - name: Commit suffix fix and formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Recognize canonical central wall obstacle names"
          git push origin HEAD:agent/issue-192-authoritative-obstacle-boxes
