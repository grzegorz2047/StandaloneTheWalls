name: Fix Issue 122 Snapshot Test Race

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/fix-issue-122-test-race.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-122-lobby-team-ready-protocol

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Guard snapshot access with existence check
        shell: python
        run: |
          from pathlib import Path

          path = Path('server/src/test/java/pl/grzegorz2047/standalonethewalls/server/identity/session/MinimalLobbyRuntimeTest.java')
          text = path.read_text()
          old = '''            waitUntil(
                      () ->
                              lobby.memberCount() == 1
                                      && latestSnapshotUnchecked(alpha).revision() == 1L);
          '''
          new = '''            waitUntil(
                      () ->
                              lobby.memberCount() == 1
                                      && snapshotCount(alpha) >= 1
                                      && latestSnapshotUnchecked(alpha).revision() == 1L);
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one snapshot wait replacement, got {count}')
          path.write_text(text.replace(old, new, 1))

      - name: Format changed test
        run: ./gradlew --no-daemon spotlessApply

      - name: Repeat formerly racy test
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Targeted race test attempt ${attempt}"
            ./gradlew --no-daemon :server:test \
              --tests 'pl.grzegorz2047.standalonethewalls.server.identity.session.MinimalLobbyRuntimeTest.reportsRejectedAndIdempotentCommandsWithoutFalseRevisionOrBroadcast' \
              --rerun-tasks
          done

      - name: Run complete server test suite
        run: ./gradlew --no-daemon :server:test --rerun-tasks

      - name: Commit tested synchronization fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/src/test/java/pl/grzegorz2047/standalonethewalls/server/identity/session/MinimalLobbyRuntimeTest.java
          git commit -m '[P0][Test] Guard initial lobby snapshot synchronization'
          git push origin HEAD:agent/issue-122-lobby-team-ready-protocol
