name: Issue 194 Canonical Collision Bytes

on:
  push:
    branches:
      - agent/issue-194-canonical-collision-bytes
    paths:
      - .github/scripts/issue_194_apply.py
      - .github/workflows/issue-194-apply.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-194-canonical-collision-bytes
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply implementation
        run: python3 .github/scripts/issue_194_apply.py
      - name: Format and run focused quality gate
        run: ./gradlew --no-daemon spotlessApply :map-format:test :map-format:spotbugsMain :map-format:spotbugsTest
      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map-format/src/main map-format/src/test
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Verify canonical collision mesh bytes"
          git push origin HEAD:agent/issue-194-canonical-collision-bytes
