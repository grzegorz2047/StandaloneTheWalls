name: Issue 194 Canonical Collision Bytes

on:
  push:
    branches:
      - agent/issue-194-canonical-collision-bytes
    paths:
      - .github/scripts/issue_194_apply.py
      - .github/workflows/issue-194-apply.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-194-canonical-collision-bytes
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply, verify and persist result
        shell: bash
        run: |
          set +e
          result=.github/issue-194-result.txt
          : > "$result"
          python3 .github/scripts/issue_194_apply.py >> "$result" 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            ./gradlew --no-daemon spotlessApply :map-format:test :map-format:spotbugsMain :map-format:spotbugsTest >> "$result" 2>&1
            status=$?
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$status" -eq 0 ]; then
            printf '\nISSUE_194_STATUS=SUCCESS\n' >> "$result"
            git add map-format/src/main map-format/src/test "$result"
            message="Verify canonical collision mesh bytes"
          else
            printf '\nISSUE_194_STATUS=FAILURE:%s\n' "$status" >> "$result"
            git reset --hard HEAD
            printf 'ISSUE_194_STATUS=FAILURE:%s\n' "$status" > "$result"
            git add "$result"
            message="Record issue 194 focused check failure"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "$message"
            git push origin HEAD:agent/issue-194-canonical-collision-bytes
          fi
          exit 0
