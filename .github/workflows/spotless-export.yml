name: Spotless Export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Apply repository formatter
        run: ./gradlew --no-daemon spotlessApply
      - name: Upload formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: spotless-export
          path: |
            map-format/src/main/java/pl/grzegorz2047/standalonethewalls/mapformat/Glb2ContainerDecoder.java
            map-format/src/main/java/pl/grzegorz2047/standalonethewalls/mapformat/MinimalPreparationBundle.java
            map-format/src/test/java/pl/grzegorz2047/standalonethewalls/mapformat/Glb2ContainerDecoderTest.java
            map-format/src/test/java/pl/grzegorz2047/standalonethewalls/mapformat/MinimalPreparationBundleTest.java
          if-no-files-found: error
          retention-days: 1
