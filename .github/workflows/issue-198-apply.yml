name: Apply issue 198 phase foundation

on:
  push:
    branches:
      - agent/issue-198-open-central-walls

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-198-open-central-walls
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply deterministic phase patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}")
              target.write_text(text.replace(old, new))

          replace(
              'protocol/src/main/java/pl/grzegorz2047/standalonethewalls/protocol/lobby/LobbyMatchPhase.java',
              '''    WAITING_FOR_PLAYERS(1),
              START_COUNTDOWN(2),
              PREPARATION(3);''',
              '''    WAITING_FOR_PLAYERS(1),
              START_COUNTDOWN(2),
              PREPARATION(3),
              WALLS_OPENING(4),
              OPEN_COMBAT(5);''')
          replace(
              'protocol/src/main/java/pl/grzegorz2047/standalonethewalls/protocol/lobby/LobbyMatchPhase.java',
              '''            case 3 -> Optional.of(PREPARATION);
              default -> Optional.empty();''',
              '''            case 3 -> Optional.of(PREPARATION);
              case 4 -> Optional.of(WALLS_OPENING);
              case 5 -> Optional.of(OPEN_COMBAT);
              default -> Optional.empty();''')

          replace(
              'server/src/main/java/pl/grzegorz2047/standalonethewalls/server/lobby/LobbyMatchProtocolAdapter.java',
              '''                    case PREPARATION -> LobbyMatchPhase.PREPARATION;
                    case BOOT,
                            LOADING_MAP,
                            WALLS_OPENING,
                            OPEN_COMBAT,
                            DEATHMATCH_TRANSITION,''',
              '''                    case PREPARATION -> LobbyMatchPhase.PREPARATION;
                    case WALLS_OPENING -> LobbyMatchPhase.WALLS_OPENING;
                    case OPEN_COMBAT -> LobbyMatchPhase.OPEN_COMBAT;
                    case BOOT,
                            LOADING_MAP,
                            DEATHMATCH_TRANSITION,''')

          replace(
              'server/src/main/java/pl/grzegorz2047/standalonethewalls/server/lobby/LobbyMatchCoordinator.java',
              '''        lastProcessedTick = tickNumber;
        if (matchState.phase() != MatchPhase.START_COUNTDOWN) {
            return Optional.empty();
        }
        MatchDecision decision =''',
              '''        lastProcessedTick = tickNumber;
        if (matchState.phase() != MatchPhase.START_COUNTDOWN
                && matchState.phase() != MatchPhase.PREPARATION
                && matchState.phase() != MatchPhase.WALLS_OPENING) {
            return Optional.empty();
        }
        MatchDecision decision =''')

          replace(
              'server/src/test/java/pl/grzegorz2047/standalonethewalls/server/lobby/LobbyMatchCoordinatorTest.java',
              '''    @Test
    void entersPreparationExactlyOnceAndStopsAcceptingLobbyCommands() {
        LobbyMatchCoordinator coordinator = new LobbyMatchCoordinator(LOBBY, MATCH);
        coordinator.updateRoster(twoPlayers(1L, true, true));

        LobbyMatchSnapshot lastCountdownTick = coordinator.advanceTick(0L).orElseThrow();
        LobbyMatchSnapshot prepared = coordinator.advanceTick(1L).orElseThrow();

        assertThat(lastCountdownTick.phase()).isEqualTo(MatchPhase.START_COUNTDOWN);
        assertThat(lastCountdownTick.ticksRemaining()).isOne();
        assertThat(prepared.phase()).isEqualTo(MatchPhase.PREPARATION);
        assertThat(prepared.ticksRemaining()).isEqualTo(2L);
        assertThat(coordinator.acceptsLobbyCommands()).isFalse();

        long preparationRevision = prepared.revision();
        assertThat(coordinator.advanceTick(1L)).isEmpty();
        assertThat(coordinator.advanceTick(2L)).isEmpty();
        assertThat(coordinator.snapshot().revision()).isEqualTo(preparationRevision);
        assertThat(coordinator.snapshot().phase()).isEqualTo(MatchPhase.PREPARATION);
        assertThat(coordinator.snapshot().ticksRemaining()).isEqualTo(2L);
    }''',
              '''    @Test
    void advancesPreparationAndWallsOpeningExactlyOnceThenStopsAtOpenCombat() {
        LobbyMatchCoordinator coordinator = new LobbyMatchCoordinator(LOBBY, MATCH);
        coordinator.updateRoster(twoPlayers(1L, true, true));

        LobbyMatchSnapshot lastCountdownTick = coordinator.advanceTick(0L).orElseThrow();
        LobbyMatchSnapshot prepared = coordinator.advanceTick(1L).orElseThrow();
        LobbyMatchSnapshot lastPreparationTick = coordinator.advanceTick(2L).orElseThrow();
        LobbyMatchSnapshot opening = coordinator.advanceTick(3L).orElseThrow();
        LobbyMatchSnapshot combat = coordinator.advanceTick(4L).orElseThrow();

        assertThat(lastCountdownTick.phase()).isEqualTo(MatchPhase.START_COUNTDOWN);
        assertThat(lastCountdownTick.ticksRemaining()).isOne();
        assertThat(prepared.phase()).isEqualTo(MatchPhase.PREPARATION);
        assertThat(prepared.ticksRemaining()).isEqualTo(2L);
        assertThat(lastPreparationTick.phase()).isEqualTo(MatchPhase.PREPARATION);
        assertThat(lastPreparationTick.ticksRemaining()).isOne();
        assertThat(opening.phase()).isEqualTo(MatchPhase.WALLS_OPENING);
        assertThat(opening.ticksRemaining()).isOne();
        assertThat(combat.phase()).isEqualTo(MatchPhase.OPEN_COMBAT);
        assertThat(combat.ticksRemaining()).isEqualTo(2L);
        assertThat(coordinator.acceptsLobbyCommands()).isFalse();

        long combatRevision = combat.revision();
        assertThat(coordinator.advanceTick(4L)).isEmpty();
        assertThat(coordinator.advanceTick(5L)).isEmpty();
        assertThat(coordinator.snapshot().revision()).isEqualTo(combatRevision);
        assertThat(coordinator.snapshot().phase()).isEqualTo(MatchPhase.OPEN_COMBAT);
        assertThat(coordinator.snapshot().ticksRemaining()).isEqualTo(2L);
    }''')

          replace(
              'server/src/test/java/pl/grzegorz2047/standalonethewalls/server/lobby/LobbyMatchProtocolAdapterTest.java',
              '''    void mapsWaitingCountdownAndPreparationWithoutEnumOrdinals() {''',
              '''    void mapsWaitingCountdownPreparationOpeningAndCombatWithoutEnumOrdinals() {''')
          replace(
              'server/src/test/java/pl/grzegorz2047/standalonethewalls/server/lobby/LobbyMatchProtocolAdapterTest.java',
              '''        LobbyMatchPhaseSnapshot preparation =
                LobbyMatchProtocolAdapter.toProtocol(
                        snapshot(MatchPhase.PREPARATION, 400L, Optional.empty()));

        assertThat(waiting.phase())''',
              '''        LobbyMatchPhaseSnapshot preparation =
                LobbyMatchProtocolAdapter.toProtocol(
                        snapshot(MatchPhase.PREPARATION, 400L, Optional.empty()));
        LobbyMatchPhaseSnapshot opening =
                LobbyMatchProtocolAdapter.toProtocol(
                        snapshot(MatchPhase.WALLS_OPENING, 50L, Optional.empty()));
        LobbyMatchPhaseSnapshot combat =
                LobbyMatchProtocolAdapter.toProtocol(
                        snapshot(MatchPhase.OPEN_COMBAT, 8_400L, Optional.empty()));

        assertThat(waiting.phase())''')
          replace(
              'server/src/test/java/pl/grzegorz2047/standalonethewalls/server/lobby/LobbyMatchProtocolAdapterTest.java',
              '''        assertThat(preparation.phase()).isEqualTo(LobbyMatchPhase.PREPARATION);
        assertThat(preparation.ticksRemaining()).isEqualTo(400L);''',
              '''        assertThat(preparation.phase()).isEqualTo(LobbyMatchPhase.PREPARATION);
        assertThat(preparation.ticksRemaining()).isEqualTo(400L);
        assertThat(opening.phase()).isEqualTo(LobbyMatchPhase.WALLS_OPENING);
        assertThat(opening.ticksRemaining()).isEqualTo(50L);
        assertThat(combat.phase()).isEqualTo(LobbyMatchPhase.OPEN_COMBAT);
        assertThat(combat.ticksRemaining()).isEqualTo(8_400L);''')

          replace(
              'protocol/src/test/java/pl/grzegorz2047/standalonethewalls/protocol/lobby/LobbyMatchProtocolCodecTest.java',
              '''    void roundTripsWaitingCancellationAndPreparationSnapshots() throws LobbyProtocolException {''',
              '''    void roundTripsAllPublishedMatchPhases() throws LobbyProtocolException {''')
          replace(
              'protocol/src/test/java/pl/grzegorz2047/standalonethewalls/protocol/lobby/LobbyMatchProtocolCodecTest.java',
              '''        LobbyMatchPhaseSnapshot preparation =
                new LobbyMatchPhaseSnapshot(
                        9L,
                        12L,
                        99L,
                        LobbyMatchPhase.PREPARATION,
                        1_200L,
                        6,
                        1L,
                        LobbyCountdownCancellationReason.NONE);

        assertThat(''',
              '''        LobbyMatchPhaseSnapshot preparation =
                new LobbyMatchPhaseSnapshot(
                        9L,
                        12L,
                        99L,
                        LobbyMatchPhase.PREPARATION,
                        1_200L,
                        6,
                        1L,
                        LobbyCountdownCancellationReason.NONE);
        LobbyMatchPhaseSnapshot opening =
                new LobbyMatchPhaseSnapshot(
                        10L,
                        12L,
                        1_299L,
                        LobbyMatchPhase.WALLS_OPENING,
                        100L,
                        6,
                        1L,
                        LobbyCountdownCancellationReason.NONE);
        LobbyMatchPhaseSnapshot combat =
                new LobbyMatchPhaseSnapshot(
                        11L,
                        12L,
                        1_399L,
                        LobbyMatchPhase.OPEN_COMBAT,
                        8_400L,
                        6,
                        1L,
                        LobbyCountdownCancellationReason.NONE);

        assertThat(''')
          replace(
              'protocol/src/test/java/pl/grzegorz2047/standalonethewalls/protocol/lobby/LobbyMatchProtocolCodecTest.java',
              '''        assertThat(
                        LobbyMatchProtocolCodec.decodeSnapshot(
                                LobbyMatchProtocolCodec.encodeSnapshot(preparation)))
                .isEqualTo(preparation);
    }''',
              '''        assertThat(
                        LobbyMatchProtocolCodec.decodeSnapshot(
                                LobbyMatchProtocolCodec.encodeSnapshot(preparation)))
                .isEqualTo(preparation);
        assertThat(
                        LobbyMatchProtocolCodec.decodeSnapshot(
                                LobbyMatchProtocolCodec.encodeSnapshot(opening)))
                .isEqualTo(opening);
        assertThat(
                        LobbyMatchProtocolCodec.decodeSnapshot(
                                LobbyMatchProtocolCodec.encodeSnapshot(combat)))
                .isEqualTo(combat);
    }''')
          PY

      - name: Format changed Java sources
        run: ./gradlew --no-daemon spotlessApply

      - name: Run focused phase tests
        run: ./gradlew --no-daemon :protocol:test :server:test --tests '*LobbyMatch*'

      - name: Commit applied changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add protocol/src/main/java/pl/grzegorz2047/standalonethewalls/protocol/lobby/LobbyMatchPhase.java \
            protocol/src/test/java/pl/grzegorz2047/standalonethewalls/protocol/lobby/LobbyMatchProtocolCodecTest.java \
            server/src/main/java/pl/grzegorz2047/standalonethewalls/server/lobby/LobbyMatchCoordinator.java \
            server/src/main/java/pl/grzegorz2047/standalonethewalls/server/lobby/LobbyMatchProtocolAdapter.java \
            server/src/test/java/pl/grzegorz2047/standalonethewalls/server/lobby/LobbyMatchCoordinatorTest.java \
            server/src/test/java/pl/grzegorz2047/standalonethewalls/server/lobby/LobbyMatchProtocolAdapterTest.java
          git commit -m 'Advance match phases through open combat'
          git push origin HEAD:agent/issue-198-open-central-walls
