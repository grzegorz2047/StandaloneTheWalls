name: Temporary Self Review Server Fixes

on:
  push:
    branches:
      - agent/issue-198-open-central-walls

permissions:
  contents: write

jobs:
  fix-server-self-review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply server self-review corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path('server/src/main/java/pl/grzegorz2047/standalonethewalls/server/lobby/MinimalLobbyRuntime.java')
          runtime = runtime_path.read_text()
          runtime = runtime.replace(
              'import pl.grzegorz2047.standalonethewalls.protocol.ReliableChannel;\n', '')
          old_imports = '''import pl.grzegorz2047.standalonethewalls.server.preparation.PreparationMovementSimulation;\nimport pl.grzegorz2047.standalonethewalls.server.preparation.PreparationTransitionPlanner;\nimport pl.grzegorz2047.standalonethewalls.server.preparation.PreparationTransitionPublishException;\nimport pl.grzegorz2047.standalonethewalls.server.preparation.PreparationTransitionPublisher;\n'''
          new_imports = '''import pl.grzegorz2047.standalonethewalls.server.preparation.PreparationMovementSimulation;\nimport pl.grzegorz2047.standalonethewalls.server.preparation.PreparationSpawnPublishException;\nimport pl.grzegorz2047.standalonethewalls.server.preparation.PreparationSpawnPublisher;\nimport pl.grzegorz2047.standalonethewalls.server.preparation.PreparationTransitionPlanner;\n'''
          if runtime.count(old_imports) != 1:
              raise SystemExit('MinimalLobbyRuntime: preparation imports anchor changed')
          runtime = runtime.replace(old_imports, new_imports, 1)

          start = runtime.index('    private void publishPreparationTransition(')
          end = runtime.index('    private void advancePreparationMovement(', start)
          new_method = '''    private void publishPreparationTransition(\n            LobbyState state, LobbyMatchSnapshot matchSnapshot) {\n        List<PreparationClientSpawn> plan =\n                PreparationTransitionPlanner.plan(preparationMap, state.roster, matchSnapshot);\n        Map<\n                        pl.grzegorz2047.standalonethewalls.protocol.identity.PlayerId,\n                        PreparationSpawnAssignment>\n                assignments = new HashMap<>();\n        for (PreparationClientSpawn delivery : plan) {\n            MemberState member = state.members.get(delivery.participantId());\n            if (member == null) {\n                throw new IllegalStateException(\n                        "preparation transition plan contains an unowned participant");\n            }\n            member.preparationInputMailbox.open(matchSnapshot.roundNumber());\n            assignments.put(member.identity.playerId(), delivery.assignment());\n        }\n        state.preparationMovement =\n                PreparationMovementSimulation.start(\n                        matchSnapshot.roundNumber(),\n                        matchSnapshot.authoritativeTick(),\n                        preparationMap,\n                        assignments);\n\n        byte[] snapshotPayload =\n                LobbyMatchProtocolCodec.encodeSnapshot(\n                        LobbyMatchProtocolAdapter.toProtocol(matchSnapshot));\n        List<LobbyParticipantId> failed =\n                new ArrayList<>(\n                        sendToMembers(\n                                state.members,\n                                MessageType.LOBBY_MATCH_SNAPSHOT,\n                                snapshotPayload));\n        for (PreparationClientSpawn delivery : plan) {\n            if (failed.contains(delivery.participantId())) {\n                continue;\n            }\n            MemberState member = state.members.get(delivery.participantId());\n            if (member == null) {\n                throw new IllegalStateException(\n                        "preparation transition member disappeared before assignment send");\n            }\n            try {\n                PreparationSpawnPublisher.publish(\n                        List.of(delivery),\n                        Map.of(\n                                delivery.participantId(),\n                                member.session.reliableChannel()),\n                        sendTimeout);\n            } catch (PreparationSpawnPublishException exception) {\n                if (exception.code()\n                                == PreparationSpawnPublishException.Code.SEND_START_FAILED\n                        || exception.code() == PreparationSpawnPublishException.Code.SEND_FAILED\n                        || exception.code() == PreparationSpawnPublishException.Code.SEND_TIMEOUT) {\n                    failed.add(delivery.participantId());\n                    continue;\n                }\n                state.preparationMovement = null;\n                for (MemberState retained : state.members.values()) {\n                    retained.preparationInputMailbox.close();\n                }\n                throw exception;\n            }\n        }\n\n        if (!failed.isEmpty()) {\n            removeFailedMembers(state, failed);\n            if (state.members.isEmpty()) {\n                return;\n            }\n            stabilizeSnapshots(state);\n        }\n        PreparationMovementSimulation movement = state.preparationMovement;\n        if (movement != null) {\n            publishPreparationSnapshot(state, movement.currentSnapshot().orElseThrow());\n        }\n    }\n\n'''
          runtime = runtime[:start] + new_method + runtime[end:]

          channels_start = runtime.index(
              '    private static Map<LobbyParticipantId, ReliableChannel> preparationChannels(')
          channels_end = runtime.index('    private void removeFailedMembers(', channels_start)
          runtime = runtime[:channels_start] + runtime[channels_end:]
          runtime_path.write_text(runtime)

          test_path = Path('server/src/test/java/pl/grzegorz2047/standalonethewalls/server/identity/session/MinimalLobbyRuntimeTest.java')
          tests = test_path.read_text()
          anchor = '''    @Test\n    void shutdownDuringCountdownClosesEverySessionAndRejectsLaterTicks()'''
          additions = '''    @Test\n    void preparationSpawnSendFailureRemovesOnlyBrokenSessionAndKeepsRemainingWorld()\n            throws InterruptedException {\n        AuthorizedPlayerSessionQueue queue = queue(2);\n        TestSession alpha = new TestSession(1, playerId('a'), "alpha");\n        TestSession bravo = new TestSession(2, playerId('b'), "bravo");\n        enqueue(queue, alpha);\n        enqueue(queue, bravo);\n        MinimalLobbyRuntime lobby = countdownLobby(queue);\n\n        try {\n            lobby.start();\n            waitUntil(() -> lobby.memberCount() == 2);\n            readyTwoPlayers(alpha, bravo);\n            waitUntil(\n                    () ->\n                            latestMatchSnapshotUnchecked(alpha).phase()\n                                    == LobbyMatchPhase.START_COUNTDOWN);\n\n            assertThat(lobby.offerSimulationTick(0L)).isTrue();\n            waitUntil(() -> latestMatchSnapshotUnchecked(alpha).ticksRemaining() == 2L);\n            assertThat(lobby.offerSimulationTick(1L)).isTrue();\n            waitUntil(() -> latestMatchSnapshotUnchecked(alpha).ticksRemaining() == 1L);\n\n            bravo.channel.failNextSend(MessageType.PREPARATION_SPAWN_ASSIGNMENT);\n            assertThat(lobby.offerSimulationTick(2L)).isTrue();\n            waitUntil(\n                    () ->\n                            lobby.memberCount() == 1\n                                    && bravo.closeCount() == 1\n                                    && latestMatchSnapshotUnchecked(alpha).phase()\n                                            == LobbyMatchPhase.PREPARATION\n                                    && latestMatchSnapshotUnchecked(alpha).connectedPlayers() == 1\n                                    && preparationAssignmentCount(alpha) == 1\n                                    && preparationWorldSnapshotCount(alpha) >= 1);\n\n            assertThat(lobby.isRunning()).isTrue();\n            assertThat(lobby.failure()).isEmpty();\n            assertThat(alpha.closeCount()).isZero();\n            assertThat(latestSnapshotUnchecked(alpha).members())\n                    .extracting(LobbyMember::playerId)\n                    .containsExactly(alpha.playerId());\n            assertThat(latestPreparationWorldSnapshotUnchecked(alpha).players())\n                    .extracting(PreparationPlayerSnapshot::playerId)\n                    .containsExactly(alpha.playerId());\n        } finally {\n            lobby.close();\n            queue.close();\n        }\n    }\n\n    @Test\n    void openingSnapshotSendFailureRemovesOnlyBrokenSessionAndPreservesOpening()\n            throws InterruptedException {\n        AuthorizedPlayerSessionQueue queue = queue(2);\n        TestSession alpha = new TestSession(1, playerId('a'), "alpha");\n        TestSession bravo = new TestSession(2, playerId('b'), "bravo");\n        enqueue(queue, alpha);\n        enqueue(queue, bravo);\n        MinimalLobbyRuntime lobby = countdownLobby(queue);\n\n        try {\n            lobby.start();\n            waitUntil(() -> lobby.memberCount() == 2);\n            readyTwoPlayers(alpha, bravo);\n            waitUntil(\n                    () ->\n                            latestMatchSnapshotUnchecked(alpha).phase()\n                                    == LobbyMatchPhase.START_COUNTDOWN);\n            assertThat(lobby.offerSimulationTick(0L)).isTrue();\n            assertThat(lobby.offerSimulationTick(1L)).isTrue();\n            assertThat(lobby.offerSimulationTick(2L)).isTrue();\n            waitUntil(() -> preparationAssignmentCount(alpha) == 1);\n            assertThat(lobby.offerSimulationTick(3L)).isTrue();\n            waitUntil(\n                    () ->\n                            latestMatchSnapshotUnchecked(alpha).phase()\n                                            == LobbyMatchPhase.PREPARATION\n                                    && latestMatchSnapshotUnchecked(alpha).ticksRemaining() == 1L);\n\n            bravo.channel.failNextSend(MessageType.LOBBY_MATCH_SNAPSHOT);\n            assertThat(lobby.offerSimulationTick(4L)).isTrue();\n            waitUntil(\n                    () ->\n                            lobby.memberCount() == 1\n                                    && bravo.closeCount() == 1\n                                    && latestMatchSnapshotUnchecked(alpha).phase()\n                                            == LobbyMatchPhase.WALLS_OPENING\n                                    && latestMatchSnapshotUnchecked(alpha).connectedPlayers() == 1);\n\n            assertThat(lobby.isRunning()).isTrue();\n            assertThat(lobby.failure()).isEmpty();\n            assertThat(alpha.closeCount()).isZero();\n            assertThat(lobby.offerSimulationTick(5L)).isTrue();\n            waitUntil(\n                    () ->\n                            latestMatchSnapshotUnchecked(alpha).phase()\n                                    == LobbyMatchPhase.OPEN_COMBAT);\n        } finally {\n            lobby.close();\n            queue.close();\n        }\n    }\n\n    @Test\n    void openCombatSnapshotSendFailureRemovesOnlyBrokenSessionAndPreservesOpenCombat()\n            throws InterruptedException {\n        AuthorizedPlayerSessionQueue queue = queue(2);\n        TestSession alpha = new TestSession(1, playerId('a'), "alpha");\n        TestSession bravo = new TestSession(2, playerId('b'), "bravo");\n        enqueue(queue, alpha);\n        enqueue(queue, bravo);\n        MinimalLobbyRuntime lobby = countdownLobby(queue);\n\n        try {\n            lobby.start();\n            waitUntil(() -> lobby.memberCount() == 2);\n            readyTwoPlayers(alpha, bravo);\n            waitUntil(\n                    () ->\n                            latestMatchSnapshotUnchecked(alpha).phase()\n                                    == LobbyMatchPhase.START_COUNTDOWN);\n            for (long tick = 0L; tick <= 4L; tick++) {\n                assertThat(lobby.offerSimulationTick(tick)).isTrue();\n            }\n            waitUntil(\n                    () ->\n                            latestMatchSnapshotUnchecked(alpha).phase()\n                                    == LobbyMatchPhase.WALLS_OPENING);\n\n            bravo.channel.failNextSend(MessageType.LOBBY_MATCH_SNAPSHOT);\n            assertThat(lobby.offerSimulationTick(5L)).isTrue();\n            waitUntil(\n                    () ->\n                            lobby.memberCount() == 1\n                                    && bravo.closeCount() == 1\n                                    && latestMatchSnapshotUnchecked(alpha).phase()\n                                            == LobbyMatchPhase.OPEN_COMBAT\n                                    && latestMatchSnapshotUnchecked(alpha).connectedPlayers() == 1);\n\n            assertThat(lobby.isRunning()).isTrue();\n            assertThat(lobby.failure()).isEmpty();\n            assertThat(alpha.closeCount()).isZero();\n        } finally {\n            lobby.close();\n            queue.close();\n        }\n    }\n\n    @Test\n    void shutdownAtOpeningBoundaryClosesSessionsAndRejectsOpenCombatTick()\n            throws InterruptedException {\n        AuthorizedPlayerSessionQueue queue = queue(2);\n        TestSession alpha = new TestSession(1, playerId('a'), "alpha");\n        TestSession bravo = new TestSession(2, playerId('b'), "bravo");\n        enqueue(queue, alpha);\n        enqueue(queue, bravo);\n        MinimalLobbyRuntime lobby = countdownLobby(queue);\n\n        try {\n            lobby.start();\n            waitUntil(() -> lobby.memberCount() == 2);\n            readyTwoPlayers(alpha, bravo);\n            waitUntil(\n                    () ->\n                            latestMatchSnapshotUnchecked(alpha).phase()\n                                    == LobbyMatchPhase.START_COUNTDOWN);\n            for (long tick = 0L; tick <= 4L; tick++) {\n                assertThat(lobby.offerSimulationTick(tick)).isTrue();\n            }\n            waitUntil(\n                    () ->\n                            latestMatchSnapshotUnchecked(alpha).phase()\n                                    == LobbyMatchPhase.WALLS_OPENING);\n\n            lobby.close();\n            lobby.close();\n\n            assertThat(lobby.isRunning()).isFalse();\n            assertThat(lobby.offerSimulationTick(5L)).isFalse();\n            assertThat(lobby.failure()).isEmpty();\n            assertThat(lobby.memberCount()).isZero();\n            assertThat(alpha.closeCount()).isEqualTo(1);\n            assertThat(bravo.closeCount()).isEqualTo(1);\n            assertThat(queue.activeTransferCount()).isZero();\n        } finally {\n            lobby.close();\n            queue.close();\n        }\n    }\n\n'''
          if tests.count(anchor) != 1:
              raise SystemExit('MinimalLobbyRuntimeTest: shutdown anchor changed')
          test_path.write_text(tests.replace(anchor, additions + anchor, 1))

          movement_test_path = Path('server/src/test/java/pl/grzegorz2047/standalonethewalls/server/preparation/PreparationObstacleMovementSimulationTest.java')
          movement_tests = movement_test_path.read_text()
          movement_anchor = '''    @Test\n    void rejectsASpawnWithoutAuthoritativeStandingClearance()'''
          fresh_test = '''    @Test\n    void freshSimulationStartsClosedAfterAnotherSimulationOpened() {\n        PreparationObstacleBox centralBarrier =\n                obstacle(\n                        PreparationObstacleMap.CENTRAL_WALL_X_NAME,\n                        -0.4d,\n                        0.0d,\n                        -2.0d,\n                        -0.39d,\n                        5.0d,\n                        2.0d);\n        PreparationMovementSimulation opened =\n                simulation(-0.8d, 0.5d, 0.0d, centralBarrier);\n\n        opened.advanceTick(11L, Map.of(), PreparationBarrierPolicy.OPEN);\n        PreparationMovementSimulation fresh =\n                simulation(-0.8d, 0.5d, 0.0d, centralBarrier);\n\n        assertThat(opened.barrierPolicy()).isEqualTo(PreparationBarrierPolicy.OPEN);\n        assertThat(fresh.barrierPolicy()).isEqualTo(PreparationBarrierPolicy.CLOSED);\n    }\n\n'''
          if movement_tests.count(movement_anchor) != 1:
              raise SystemExit('PreparationObstacleMovementSimulationTest: insertion anchor changed')
          movement_test_path.write_text(\n              movement_tests.replace(movement_anchor, fresh_test + movement_anchor, 1))
          PY

      - name: Apply canonical formatting
        run: ./gradlew --no-daemon spotlessApply

      - name: Commit server self-review fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Isolate phase send failures after self review"
          git push origin "HEAD:${GITHUB_REF_NAME}"
