name: Runtime Preparation PR Export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Apply deterministic runtime patch
        shell: python
        run: |
          from pathlib import Path

          workflow = Path(".github/workflows/runtime-preparation-export.yml").read_text(encoding="utf-8")
          marker = "      - name: Apply deterministic runtime patch\n        shell: python\n        run: |\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("      - name: Apply repository formatter\n", start)
          script = "".join(
              line[10:] if line.startswith("          ") else line
              for line in workflow[start:end].splitlines(keepends=True)
          )
          original = "\n".join([
              "def replace_once(text, old, new, label):",
              "    count = text.count(old)",
              "    if count != 1:",
              "        raise SystemExit(f\"{label}: expected one match, found {count}\")",
              "    return text.replace(old, new, 1)",
              "",
          ])
          robust = "\n".join([
              "def replace_once(text, old, new, label):",
              "    if label == \"ordered preparation publication\":",
              "        method_start = text.index(\"    private void stabilizeMatchSnapshots(\")",
              "        method_end = text.index(\"    private void removeFailedMembers(\", method_start)",
              "        return text[:method_start] + new + \"\\n\" + text[method_end:]",
              "    if label == \"default preparation map holder\":",
              "        method_start = text.index(\"    private static Throwable unwrap(\")",
              "        enum_start = text.index(\"    private enum State {\", method_start)",
              "        enum_end = enum_start + len(\"    private enum State {\\n\")",
              "        return text[:method_start] + new + text[enum_end:]",
              "    count = text.count(old)",
              "    if count != 1:",
              "        raise SystemExit(f\"{label}: expected one match, found {count}\")",
              "    return text.replace(old, new, 1)",
              "",
          ])
          if script.count(original) != 1:
              raise SystemExit("replace_once helper shape changed")
          script = script.replace(original, robust, 1)
          exec(compile(script, "runtime-preparation-export", "exec"), {"__name__": "__main__"})
      - name: Apply repository formatter
        run: ./gradlew --no-daemon spotlessApply
      - name: Upload patched sources
        uses: actions/upload-artifact@v4
        with:
          name: runtime-preparation-export
          path: |
            server/src/main/java/pl/grzegorz2047/standalonethewalls/server/lobby/MinimalLobbyRuntime.java
            server/src/test/java/pl/grzegorz2047/standalonethewalls/server/identity/session/MinimalLobbyRuntimeTest.java
          if-no-files-found: error
          retention-days: 1
