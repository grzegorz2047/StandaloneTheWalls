name: Runtime Preparation PR Export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Apply deterministic runtime patch
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/runtime-preparation-export.yml").read_text(encoding="utf-8")
          marker = "      - name: Apply deterministic runtime patch\n        shell: python\n        run: |\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("      - name: Apply repository formatter\n", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, "runtime-preparation-export", "exec"), {"__name__": "__main__"})
      - name: Apply repository formatter
        run: ./gradlew --no-daemon spotlessApply
      - name: Upload patched sources
        uses: actions/upload-artifact@v4
        with:
          name: runtime-preparation-export
          path: |
            server/src/main/java/pl/grzegorz2047/standalonethewalls/server/lobby/MinimalLobbyRuntime.java
            server/src/test/java/pl/grzegorz2047/standalonethewalls/server/identity/session/MinimalLobbyRuntimeTest.java
          if-no-files-found: error
          retention-days: 1
