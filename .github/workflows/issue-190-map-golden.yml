name: Issue 190 Map Golden

on:
  push:
    branches:
      - agent/issue-190-authoritative-support-boxes
    paths:
      - .github/workflows/issue-190-map-golden.yml

permissions:
  contents: read

jobs:
  golden:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-190-authoritative-support-boxes
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run deterministic map golden test
        run: ./gradlew --no-daemon :map-format:test --tests '*MinimalPreparationBundleTest.generatesTheSameCompleteVerifiedArchiveEveryTime' --info
