name: Issue 77 formatter helper

on:
  push:
    branches:
      - agent/issue-77-local-display-name

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[issue77 formatted]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-77-local-display-name

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply final source fix and repository formatter
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("identity-policy-sqlite/src/test/java/pl/grzegorz2047/standalonethewalls/identity/policy/sqlite/SqliteLocalDisplayNameAdministrationStoreTest.java")
          source = path.read_text(encoding="utf-8")
          source = source.replace(
              "import java.util.concurrent.CountDownLatch;\n",
              "import java.util.concurrent.CountDownLatch;\nimport java.util.concurrent.ExecutionException;\n",
              1,
          )
          source = source.replace(
              "import java.util.concurrent.TimeUnit;\n",
              "import java.util.concurrent.TimeUnit;\nimport java.util.concurrent.TimeoutException;\n",
              1,
          )
          source = source.replace(
              "void twoStoreInstancesAllowOnlyOneExactConcurrentUpdate() throws Exception {",
              "void twoStoreInstancesAllowOnlyOneExactConcurrentUpdate()\n            throws InterruptedException, ExecutionException, TimeoutException {",
              1,
          )
          path.write_text(source, encoding="utf-8")
          PY
          ./gradlew --no-daemon spotlessApply

      - name: Commit exact formatted sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            identity-policy/src/main/java/pl/grzegorz2047/standalonethewalls/identity/policy/InMemoryLocalDisplayNameStore.java \
            identity-policy/src/main/java/pl/grzegorz2047/standalonethewalls/identity/policy/LocalDisplayNameAuditEvent.java \
            identity-policy/src/test/java/pl/grzegorz2047/standalonethewalls/identity/policy/LocalDisplayNameAdministrationServiceTest.java \
            identity-policy-sqlite/src/main/java/pl/grzegorz2047/standalonethewalls/identity/policy/sqlite/SqliteLocalDisplayNameAdministrationStore.java \
            identity-policy-sqlite/src/main/java/pl/grzegorz2047/standalonethewalls/identity/policy/sqlite/SqliteLocalHandleAdministrationStore.java \
            identity-policy-sqlite/src/main/java/pl/grzegorz2047/standalonethewalls/identity/policy/sqlite/SqliteLocalPlayerBanAdministrationStore.java \
            identity-policy-sqlite/src/test/java/pl/grzegorz2047/standalonethewalls/identity/policy/sqlite/SqliteLocalDisplayNameAdministrationStoreTest.java
          git diff --cached --quiet && exit 0
          git commit -m "[issue77 formatted] Apply repository formatter"
          git push origin HEAD:agent/issue-77-local-display-name
