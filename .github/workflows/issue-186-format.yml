name: Format issue 186 remote crouch tests

on:
  push:
    branches:
      - agent/issue-186-remote-crouch-pose

permissions:
  contents: write

jobs:
  format-issue-186:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out remote crouch branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/issue-186-remote-crouch-pose
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Apply repository Java formatting
        run: ./gradlew --no-daemon spotlessApply

      - name: Commit formatting and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/issue-186-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            client/src/test/java/pl/grzegorz2047/standalonethewalls/client/preparation/PreparationRemoteSnapshotInterpolatorTest.java \
            protocol/src/test/java/pl/grzegorz2047/standalonethewalls/protocol/preparation/PreparationMovementProtocolCodecTest.java \
            server/src/test/java/pl/grzegorz2047/standalonethewalls/server/preparation/PreparationMovementSimulationTest.java \
            .github/workflows/issue-186-format.yml
          git diff --cached --check
          git commit -m "Format remote crouch tests"
          git push origin HEAD:agent/issue-186-remote-crouch-pose
